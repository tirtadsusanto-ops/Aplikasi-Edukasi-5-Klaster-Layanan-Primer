</style></head><body><div class="watermark" id="author-watermark">Dr.dr.Tirta Darmawan Susanto,MKes</div><header><span class="eyebrow">Aplikasi Klaster 5</span><h1>Lintas Klaster</h1><p>Keselamatan pelayanan penunjang dan keutuhan perjalanan pasien</p></header><main class="wrap"><div class="row"><button id="backTop" class="back">← Kembali ke indeks</button></div><div id="stageSteps" class="steps"></div><div id="error" class="alert red hidden" role="alert" tabindex="-1"></div><div id="content"></div></main><script>const CLUSTER={"id":5,"title":"Lintas Klaster","subtitle":"Keselamatan pelayanan penunjang dan keutuhan perjalanan pasien","materials":[{"id":"k5m1","title":"Materi 1 — Dasar pelayanan penunjang dan keselamatan","sections":[{"id":"k5m1-s1","title":"Kedudukan Lintas Klaster dan perjalanan pasien","paragraphs":[{"text":"Aplikasi ini menggunakan sebutan Klaster 5 untuk memudahkan urutan belajar; domain pelayanannya tetap Lintas Klaster, yang mendukung empat klaster lainnya melalui pelayanan gigi dan mulut, kegawatdaruratan, farmasi, laboratorium, rawat inap, serta penanggulangan krisis kesehatan.","refs":["LK2024","ILP2023"]},{"text":"Tim menghubungkan kebutuhan penunjang dengan tujuan asuhan pasien, bukan memindahkan seluruh tanggung jawab klinis kepada unit penunjang. Petugas yang merujuk pemeriksaan tetap memastikan penanggung jawab penerimaan hasil dan tindak lanjutnya. Koordinator menghubungkan profesi sesuai penugasan, sedangkan setiap profesi mempertahankan batas kewenangannya.","refs":["LK2024","ILP2023"]},{"text":"Tata kerja Lintas Klaster dan penanggung jawab perjalanan pasien. Lintas Klaster menyediakan dukungan diagnostik, terapeutik, kegawatdaruratan, serta pelayanan penunjang bagi kelompok sasaran yang dilayani klaster terkait. Kepala Puskesmas dan penanggung jawab Lintas Klaster menghubungkan pelayanan gigi, kefarmasian, Labkesmas tingkat 1, rawat inap, krisis, serta rehabilitasi dasar sesuai kemampuan fasilitas.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-01","sourceLocator":"Slide 7–13"},{"text":"Contoh: pasien Klaster 3 memerlukan obat dan pemeriksaan darah. Tim mencatat tenaga yang meminta pemeriksaan, unit penerima permintaan, serta penerima kembali hasil dan penanggung jawab tindak lanjut; perpindahan unit tidak menghapus tanggung jawab asuhan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-01","sourceLocator":"Slide 7–13"},{"text":"Batas profesi: Keterlibatan unit tidak memindahkan kewenangan diagnosis, pengkajian klinis, atau intervensi profesional kepada seluruh staf.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-01","sourceLocator":"Slide 7–13"},{"text":"Pengayaan terbaru ditelusuri ke 211 slide asli PPT Lintas Klaster versi V25, termasuk slide tersembunyi. Sampul menyebut 2025, sedangkan kata pengantar masih Oktober 2024; berkas diperlakukan sebagai versi kerja sumber, bukan bukti penetapan aturan baru. Bagian kosong tidak diisi dengan dugaan dan catatan editorial tidak disamakan dengan prosedur yang telah disetujui. Prinsip pelayanan memakai acuan resmi yang sudah tercantum; rincian yang belum konsisten tetap memerlukan telaah profesional.","refs":["LKPPT2025","ILP2023"],"enrichmentUnit":"K5-SOURCE-STATUS","sourceLocator":"Slide 1, 4–5, 9–10, 102–103, 139, 167–168, 211"}]},{"id":"k5m1-s2","title":"Gigi dan mulut sepanjang siklus hidup","paragraphs":[{"text":"Tim menilai kebutuhan kesehatan gigi dan mulut pada setiap kelompok usia melalui edukasi, skrining, pemeriksaan, pelayanan, serta rujukan sesuai temuan. Pertumbuhan anak yang baik atau kehamilan tanpa keluhan tidak menghapus kebutuhan perhatian terhadap gigi dan mulut.","refs":["LK2024"]},{"text":"Petugas membantu pasien mengidentifikasi siapa yang dapat mendampingi kebersihan mulut, hambatan mengikuti instruksi, serta akses tindak lanjut. Keluarga membantu perawatan sehari-hari sesuai kemampuan, sedangkan dokter gigi dan tenaga berwenang menentukan diagnosis dan tindakan profesional. Temuan yang memerlukan penanganan tidak dianggap selesai setelah penyuluhan.","refs":["LK2024"]},{"text":"Skrining gigi menurut siklus hidup, tindak lanjut, dan dukungan keluarga. Pelayanan gigi menautkan penemuan faktor risiko dan kelainan dengan tindak lanjut sesuai kelompok usia. Tim menyiapkan instrumen, mencatat temuan pemeriksaan oleh tenaga berwenang, memberikan edukasi yang sesuai kebutuhan, serta menghubungkan kasus yang memerlukan penanganan dengan fasilitas yang mampu. Temuan yang dicurigai sebagai lesi prakanker memerlukan penilaian dan rujukan yang sesuai; hasil skrining tidak diperlakukan sebagai diagnosis definitif.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-02","sourceLocator":"Slide 19–38, 42–43"},{"text":"Contoh: anak sekolah tidak ditemukan karies, tetapi orang tua mengira tidak ada kebutuhan pencegahan. Tim menjelaskan tindak lanjut pencegahan oleh tenaga gigi sesuai penilaian, sedangkan temuan yang membutuhkan perawatan memakai jalur berbeda. Hasil skrining bukan diagnosis definitif.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-02","sourceLocator":"Slide 19–38, 42–43"},{"text":"Batas profesi: Pemeriksaan dan aplikasi topikal fluoride mengikuti kompetensi serta penetapan tenaga gigi; materi tidak memberikan kewenangan melakukan tindakan kepada semua staf.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-02","sourceLocator":"Slide 19–38, 42–43"},{"text":"Catatan sumber dan keselamatan: Slide 23 memuat rumusan lesi prakanker yang secara tata bahasa tidak konsisten; gunakan jalur dugaan lesi untuk penilaian berwenang, bukan definisi diagnosis baru. Catatan pembicara slide 27 meminta penambahan topikal fluoride; catatan editorial dibedakan dari isi slide 26 yang sudah memperlihatkan alur tersebut.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-02","sourceLocator":"Slide 19–38, 42–43"}]},{"id":"k5m1-s3","title":"Triase dan prioritas kegawatdaruratan","paragraphs":[{"text":"Tim mendahulukan triase, pengenalan kondisi gawat, dan penanganan awal sesuai kompetensi serta prosedur setempat. Ancaman terhadap jalan napas, pernapasan, sirkulasi, dan kesadaran memerlukan respons segera; urutan kedatangan dan kelengkapan administrasi tidak boleh menunda respons tersebut.","refs":["LK2024"]},{"text":"Petugas menilai ulang pasien ketika kondisi berubah meskipun pasien sudah pernah ditriase. Wawancara keluarga dan pengisian kebutuhan sosial yang tidak mendesak dilakukan setelah kebutuhan keselamatan segera ditangani. Tenaga yang belum berwenang meminta bantuan, bukan melakukan tindakan di luar kompetensi.","refs":["LK2024"]}]},{"id":"k5m1-s4","title":"Rujukan dan serah terima yang aman","paragraphs":[{"text":"Tim menyiapkan stabilisasi sesuai kemampuan, komunikasi dengan fasilitas tujuan, pendampingan, serta informasi serah terima berdasarkan kebutuhan klinis. Surat rujukan tidak menggantikan komunikasi pada keadaan yang memerlukan respons segera.","refs":["LK2024"]},{"text":"Serah terima menjelaskan identitas, masalah utama, keadaan terkini, tindakan dan waktu pemberian, obat, alergi yang diketahui, kebutuhan pemantauan, serta kontak yang relevan. Petugas membagikan informasi yang diperlukan bagi keselamatan dan menjaga kerahasiaan informasi keluarga. Tim mencatat penerima informasi dan rencana memperoleh umpan balik. Jika riwayat alergi atau informasi penting lain belum terkonfirmasi, petugas menyatakan ketidakpastian tersebut secara jelas dan tidak mengubah dugaan menjadi kepastian.","refs":["LK2024"]},{"text":"Alur kegawatdaruratan, survei primer dan sekunder, pemantauan serta rujukan. Pelayanan dimulai dengan pengenalan tanda kegawatan dan triase berdasarkan keadaan pasien. Tim berwenang melakukan penilaian awal serta stabilisasi sesuai kompetensi, kemudian memutuskan apakah kebutuhan pasien dapat ditangani di Puskesmas atau memerlukan rujukan. Administrasi dan wawancara yang tidak mendesak tidak menunda respons keselamatan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-04","sourceLocator":"Slide 46–59, 73–74"},{"text":"Survei sekunder melengkapi SAMPLE: tanda/gejala, alergi, obat yang digunakan, riwayat medis, asupan terakhir, serta kejadian sebelum keluhan. Informasi ini dikumpulkan sesuai prioritas setelah ancaman segera ditangani dan tidak menggantikan survei primer atau penilaian ulang.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-04","sourceLocator":"Slide 59"},{"text":"Contoh: pasien sesak memerlukan rujukan sementara informasi alergi belum jelas. Tim mendahulukan penanganan gawat sesuai kewenangan, menyatakan alergi belum terkonfirmasi, dan melengkapi informasi serah terima serta pemantauan tanpa menunda bantuan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-04","sourceLocator":"Slide 46–59, 73–74"},{"text":"Batas profesi: Kuis menilai prioritas serta koordinasi. Resusitasi, penggunaan AED, pemeriksaan fisik khusus, dan tindakan invasif memerlukan pelatihan serta penilaian praktik tersendiri.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-04","sourceLocator":"Slide 46–59, 73–74"},{"text":"Catatan sumber dan keselamatan: Slide 56 mengulang label bernapas normal/ada denyut pada dua cabang dengan tindakan berbeda; jangan menyalin diagram sebagai algoritme klinis atau kunci ujian tanpa klarifikasi. Slide 54 membedakan prioritas 0 pada konteks bencana dan pasien meninggal saat tiba; konteks tersebut harus dipertahankan dan waktu tunggu tidak digeneralisasi.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-04","sourceLocator":"Slide 46–59, 73–74"}]},{"id":"k5m1-s5","title":"Perencanaan dan pengadaan sediaan farmasi","paragraphs":[{"text":"Pengelola menghubungkan perencanaan obat dan bahan medis habis pakai dengan kebutuhan pelayanan, pemakaian, persediaan, serta sumber daya yang tersedia. Pengelola memeriksa kesesuaian penerimaan dengan dokumen, jumlah, keadaan, serta kedaluwarsa sebelum memasukkan barang ke stok.","refs":["LK2024"]},{"text":"Petugas mengikuti mekanisme pengadaan dan permintaan resmi; keterbatasan stok tidak membenarkan pengadaan tanpa pencatatan. Pengelola mendokumentasikan distribusi dan menindaklanjuti ketidaksesuaian agar unit pelayanan memperoleh dukungan yang dapat ditelusuri.","refs":["LK2024"]},{"text":"Siklus sediaan farmasi, BMHP dan PKMK. Pengelolaan sumber baru mencakup sediaan farmasi, BMHP, serta pangan olahan untuk keperluan medis khusus atau PKMK. Pengelola menautkan pemilihan dan perencanaan dengan kebutuhan pelayanan, penggunaan, stok yang tersedia, waktu tunggu, serta usulan unit. Penerimaan memeriksa kesesuaian jenis, jumlah, mutu, dokumen dan kedaluwarsa; ketidaksesuaian dicatat serta ditindaklanjuti.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-06","sourceLocator":"Slide 77–88, 93–103"},{"text":"Contoh: stok PKMK menumpuk tetapi satu unit melaporkan kekosongan. Pengelola mencocokkan kebutuhan, stok fisik, penerimaan dan mutasi antarlokasi sebelum menyusun usulan baru. Persen stok pengaman dan waktu tunggu harus diterjemahkan ke satuan jumlah kebutuhan yang sebanding sebelum perhitungan digunakan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-06","sourceLocator":"Slide 77–88, 93–103"},{"text":"Batas profesi: Pengkajian atau substitusi terapi melibatkan tenaga berwenang; staf logistik tidak mengganti regimen pasien.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-06","sourceLocator":"Slide 77–88, 93–103"},{"text":"Catatan sumber dan keselamatan: Rumus slide 83 menuliskan stok pengaman sebagai persen dan waktu tunggu sebagai minggu; contoh hitung harus terlebih dahulu menyamakan satuan menjadi jumlah kebutuhan, bukan menjumlahkan persen/minggu langsung dengan unit obat. Slide 102–103 tersembunyi; pengendalian tetap dicatat sebagai isi berkas, bukan otomatis kebijakan final.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-06","sourceLocator":"Slide 77–88, 93–103"}]},{"id":"k5m1-s6","title":"Penyimpanan dan pengendalian obat","paragraphs":[{"text":"Petugas menyimpan obat menurut persyaratan setiap produk, mencatat kondisi penyimpanan, dan menerapkan FEFO atau penggunaan stok yang lebih dahulu kedaluwarsa. Obat kedaluwarsa atau rusak dipisahkan serta ditangani menurut prosedur, bukan dibagikan agar stok habis.","refs":["LK2024"]},{"text":"Pengelola memberi perhatian pada obat dengan nama atau rupa mirip atau LASA melalui pemisahan, penandaan, dan pemeriksaan sesuai prosedur. Petugas mencocokkan stok fisik dan catatan serta menelusuri selisih; petugas tidak mengubah angka semata-mata untuk menyamakan laporan.","refs":["LK2024"]},{"text":"Rantai dingin, vaksin dan obat berisiko. Petugas mengikuti persyaratan penyimpanan produk, mencatat pemantauan kondisi, dan menindaklanjuti penyimpangan. Pada vaksin, tim menilai rantai dingin, tanggal kedaluwarsa, status vial dan informasi pemakaian; diagram VVM pada slide 92 menuntut pembacaan perbandingan warna, bukan penggunaan semua vial yang masih mempunyai tanggal berlaku.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-07","sourceLocator":"Slide 87–92, 94"},{"text":"Contoh: vial belum kedaluwarsa tetapi indikator atau kondisi penyimpanannya meragukan. Petugas menahan pemakaian untuk klarifikasi kelayakan kepada penanggung jawab; tanggal berlaku tidak menggantikan penilaian rantai dingin dan status vial.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-07","sourceLocator":"Slide 87–92, 94"},{"text":"Batas profesi: Penetapan kelayakan produk dan pemusnahan mengikuti tenaga serta prosedur yang berwenang.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-07","sourceLocator":"Slide 87–92, 94"},{"text":"Catatan sumber dan keselamatan: Batas suhu, pemakaian vial terbuka, dan model refrigerator pada slide 89–91 perlu dicocokkan dengan produk serta pedoman imunisasi yang berlaku; jangan menjadikannya angka universal seluruh vaksin.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-07","sourceLocator":"Slide 87–92, 94"}]},{"id":"k5m1-s7","title":"Pengkajian resep dan konseling obat","paragraphs":[{"text":"Tenaga farmasi mengkaji resep dan mengklarifikasi ketidaksesuaian kepada pemberi resep sebelum penyerahan sesuai kewenangannya. Riwayat alergi, obat dari fasilitas lain, obat bebas, dan suplemen perlu disampaikan karena daftar resep Puskesmas belum tentu menggambarkan seluruh penggunaan obat.","refs":["LK2024"]},{"text":"Konseling menguji pemahaman pasien tentang penggunaan, perubahan regimen, serta hal yang perlu dipantau, terutama bila pasien menggunakan banyak obat atau memerlukan bantuan caregiver. Petugas meminta pasien menjelaskan kembali instruksi dengan kata-katanya sendiri dan mengklarifikasi kesalahan; petugas tidak menilai pemahaman hanya dari anggukan.","refs":["LK2024"]},{"text":"Pengkajian resep, penyerahan dan informasi obat. Pengkajian resep menilai kesesuaian identitas dan informasi fasilitas, karakteristik sediaan, serta aspek klinis seperti indikasi, dosis, cara penggunaan, duplikasi, alergi, kontraindikasi dan interaksi. Sumber membedakan peran apoteker dalam pengkajian klinis dari bantuan tenaga vokasi pada lingkup yang sesuai.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-08","sourceLocator":"Slide 105–112"},{"text":"Contoh: dua nama dagang diduga mempunyai zat aktif sama. Ketepatan identitas dan kelengkapan resep belum cukup untuk menutup pengkajian; apoteker dan pemberi resep mengklarifikasi dugaan duplikasi sebelum obat diserahkan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-08","sourceLocator":"Slide 105–112"},{"text":"Batas profesi: Materi tidak memberikan kewenangan pengkajian klinis atau substitusi mandiri kepada seluruh staf.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-08","sourceLocator":"Slide 105–112"},{"text":"Konseling terstruktur, pemahaman pasien dan visite. Apoteker memulai konseling dengan memastikan identitas dan menggali pemahaman pasien mengenai obat, cara penggunaan, serta hasil yang diharapkan. Petugas menilai penggunaan nyata dan hambatan, memberikan penjelasan yang sesuai, kemudian meminta pasien atau pendamping yang disetujui mengulangi penjelasan untuk memeriksa pemahaman.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-09","sourceLocator":"Slide 113–120"},{"text":"Contoh: pasien mengangguk setelah diberi instruksi, tetapi belum dapat menerangkan penggunaan obat. Petugas menggali kembali pemahaman, memberi penjelasan yang sesuai, meminta penjelasan balik dan mencatat tindak lanjut. Daftar obat bebas atau herbal juga relevan saat menilai penggunaan nyata.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-09","sourceLocator":"Slide 113–120"},{"text":"Batas profesi: Konseling farmasi dan visite mengikuti tenaga serta kolaborasi yang ditetapkan; staf lain mendukung komunikasi dalam lingkupnya.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-09","sourceLocator":"Slide 113–120"},{"text":"Catatan sumber dan keselamatan: Slide 114 menumpuk salinan teks dan nomor halaman sumber; gunakan uraian yang lebih terstruktur pada slide 115–116. Definisi polifarmasi pada slide 114 tidak konsisten dengan rumusan banyak obat pada slide 118; jangan mengajarkannya sebagai definisi tunggal.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-09","sourceLocator":"Slide 113–120"}]},{"id":"k5m1-s8","title":"Siklus pemeriksaan laboratorium","paragraphs":[{"text":"Tim memastikan identitas pasien dan kesesuaian permintaan sebelum pengambilan spesimen. Petugas menjelaskan persiapan pemeriksaan, cara pengambilan, serta tempat dan waktu memperoleh hasil sesuai jenis pemeriksaan dan prosedur setempat.","refs":["LK2024"]},{"text":"Petugas menolak penyamaan identitas berdasarkan ingatan dan menelusuri label yang tidak sesuai sebelum hasil digunakan. Pengambilan, penyimpanan, pengemasan, serta pengiriman spesimen mengikuti persyaratan pemeriksaan, keselamatan petugas, dan prosedur laboratorium. Satu hasil penapisan tidak otomatis menggantikan seluruh proses penegakan diagnosis.","refs":["LK2024"]},{"text":"Alur spesimen klinis, sampel lingkungan dan rujukan aman. Pada alur klinis, permintaan pemeriksaan dari tenaga berwenang terhubung dengan identitas pasien, pengambilan spesimen, pemeriksaan, validasi dan penyampaian hasil untuk keputusan tindak lanjut. Pada alur sampel lingkungan, sanitarian menyiapkan informasi pengambilan dan jenis sampel serta berkoordinasi dengan laboratorium dan pihak yang menindaklanjuti hasil. Pencatatan manual yang diperlukan saat sistem elektronik tidak tersedia tetap menjaga ketertelusuran.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-13","sourceLocator":"Slide 152–160"},{"text":"Contoh: spesimen klinis pasien dan sampel air diterima pada hari yang sama. Tim memastikan identitas atau lokasi asal, jenis permintaan, prosedur yang sesuai, serta penerima hasil masing-masing; jalur sampel lingkungan tidak disamakan dengan seluruh alur pasien klinis.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-13","sourceLocator":"Slide 152–160"},{"text":"Batas profesi: Pengambilan, pengemasan bahan infeksius dan penetapan kategori pengiriman memerlukan tenaga yang kompeten; kerangka tidak melatih pengiriman bahan berbahaya hanya melalui kuis.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-13","sourceLocator":"Slide 152–160"},{"text":"Catatan sumber dan keselamatan: Catatan pembicara slide 158 merupakan instruksi editorial untuk menambah kotak tindak lanjut; catatan tersebut tidak dianggap sudah tercetak sebagai ketentuan pada gambar. Detail klasifikasi kategori A/B, nomor UN dan dry ice pada slide 159–160 harus mengikuti persyaratan pengiriman yang berlaku.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-13","sourceLocator":"Slide 152–160"}]},{"id":"k5m1-s9","title":"Rawat inap dan keputusan pelayanan","paragraphs":[{"text":"Puskesmas menyelenggarakan rawat inap sesuai kemampuan, indikasi, serta prosedur; keterbatasan tempat atau alat harus dinilai dalam keputusan rujukan. Tim memantau perkembangan pasien, mendokumentasikan perubahan, dan menilai kembali kebutuhan perawatan atau rujukan.","refs":["LK2024"]},{"text":"Tim mulai membicarakan kebutuhan setelah pulang selama perawatan, bukan baru pada saat pasien meninggalkan fasilitas. Rencana pulang mencakup obat, kemampuan pasien dan caregiver, kontrol, tanda memburuk, serta kontak bantuan; pasien yang stabil secara klinis masih dapat memerlukan dukungan rumah.","refs":["LK2024"]},{"text":"Home pharmacy care dan program rujuk balik. Pelayanan kefarmasian di rumah menilai penggunaan obat nyata, pemahaman pasien, kemampuan pendamping, penyimpanan, akses dan masalah yang memerlukan komunikasi kepada tim. Tim membuat rencana tindak lanjut yang sesuai tujuan pasien; pendamping tidak diasumsikan mampu hanya karena berada di rumah yang sama.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-11","sourceLocator":"Slide 128–136"},{"text":"Contoh: pasien membawa surat rujuk balik tetapi pendamping tidak mengetahui obat yang diminum di rumah. Tim menilai penggunaan nyata, pemahaman, penyimpanan serta dukungan pendamping. Surat tidak membuktikan obat tersedia atau semua kebutuhan rumah telah terpenuhi; penetapan stabil dan kelayakan PRB tetap pada tenaga berwenang.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-11","sourceLocator":"Slide 128–136"},{"text":"Batas profesi: Penetapan stabil, regimen dan kelayakan PRB dilakukan oleh tenaga/fasilitas berwenang; model bisnis dalam slide tidak otomatis menjadi kontrak atau ketentuan pembiayaan lokal.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-11","sourceLocator":"Slide 128–136"},{"text":"Catatan sumber dan keselamatan: Daftar obat geriatrik dan ambang pada slide 129 perlu penelaahan sumber terkini sebelum dipakai sebagai daftar larangan atau kunci ujian. Daftar penyakit, syarat stabil dan model kerja sama pada slide 131–136 perlu dicocokkan dengan ketentuan program yang berlaku.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-11","sourceLocator":"Slide 128–136"},{"text":"Rawat inap, observasi, stabilisasi dan kesiapan pulang. Tim menilai indikasi perawatan dan kemampuan sarana, tenaga serta pemantauan. Pasien dapat memerlukan perawatan sesuai kemampuan, observasi untuk keputusan diagnostik, atau stabilisasi sementara sebelum rujukan; adanya tempat tidur tidak cukup untuk menyimpulkan seluruh kebutuhan dapat ditangani.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-15","sourceLocator":"Slide 172, 174"},{"text":"Contoh: pasien stabil secara klinis tetapi belum mampu merawat diri dan caregiver belum memahami tugasnya. Tim menilai kesiapan pulang, dukungan, obat serta akses kontrol; stabilitas klinis saja belum menunjukkan seluruh kebutuhan setelah pulang terpenuhi.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-15","sourceLocator":"Slide 172, 174"},{"text":"Batas profesi: Keputusan rawat, pulang dan rujukan memerlukan penilaian klinis berwenang; kuis tidak menggantikannya.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-15","sourceLocator":"Slide 172, 174"}]},{"id":"k5m1-s10","title":"Kesiapsiagaan krisis kesehatan","paragraphs":[{"text":"Pengelola menilai risiko krisis, menyiapkan koordinasi dan komunikasi, serta memetakan sumber daya sebelum kejadian. Saat krisis, tim mengoordinasikan respons berdasarkan kebutuhan dan risiko, menjaga dukungan obat, air, sanitasi, serta kesinambungan layanan bagi kelompok rentan.","refs":["LK2024"]},{"text":"Pemetaan kebutuhan mencakup bayi, ibu hamil, lansia bergantung, penyandang disabilitas, dan pasien dengan terapi berkelanjutan. Tim tidak menunggu keluhan seluruh keluarga sebelum merencanakan akses obat, bantuan mobilitas, dan pengasuhan pada kondisi darurat.","refs":["LK2024"]},{"text":"Kesiapsiagaan krisis, pembagian tanggung jawab dan RHA. Tim menghubungkan deteksi dini, pelaporan dan aktivasi respons dengan Kepala Puskesmas, penanggung jawab klaster, serta jejaring. Kesiapsiagaan menilai ancaman, kerentanan masyarakat dan fasilitas, sumber daya, rencana kontingensi, komunikasi, simulasi, serta kemampuan rujukan. Kelompok rentan dan kesinambungan layanan esensial dimasukkan sejak perencanaan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-16","sourceLocator":"Slide 177–188"},{"text":"Contoh: banjir memutus akses dan satu desa memiliki banyak lansia bergantung. Penilaian cepat menelaah dampak, kapasitas yang masih berfungsi, kebutuhan mendesak dan rekomendasi; respons awal tidak menunggu laporan lengkap bila informasi yang tersedia sudah menunjukkan kebutuhan segera.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-16","sourceLocator":"Slide 177–188"},{"text":"Batas profesi: Penetapan status kejadian dan mobilisasi resmi mengikuti pejabat serta mekanisme yang berwenang; partisipasi staf tetap sesuai penugasan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-16","sourceLocator":"Slide 177–188"},{"text":"Respons krisis, layanan esensial dan komunikasi risiko. Respons krisis menjaga pelayanan medis dan kesehatan masyarakat sambil menghubungkan kebutuhan dengan rencana operasi serta koordinasi bantuan. Sumber menguraikan pelayanan primer dan lanjutan, surveilans dan pengendalian penyakit, kesehatan lingkungan, kesehatan reproduksi, gizi, kesehatan jiwa, identifikasi korban meninggal, serta pemulasaran jenazah. Pengelola memantau akses nyata, bantuan yang diterima dan kesinambungan obat serta pengasuhan menurut kebutuhan dan peran layanan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-17","sourceLocator":"Slide 189–192, 197–199"},{"text":"Contoh: bantuan tercatat terkirim, tetapi warga bergantung belum memperoleh obat. Catatan distribusi membedakan barang yang dikirim, diterima dan masih dibutuhkan. Komunikasi risiko mendengarkan kekhawatiran, menyatakan ketidakpastian yang relevan dan menjelaskan akses pertolongan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-17","sourceLocator":"Slide 189–192, 197–199"},{"text":"Batas profesi: Peserta tidak mengeluarkan perintah karantina, menetapkan kewajiban hukum, atau menjanjikan sumber daya di luar penugasan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-17","sourceLocator":"Slide 189–192, 197–199"},{"text":"Catatan sumber dan keselamatan: Slide 189 dan 190 merupakan duplikasi; jangan menghitungnya sebagai dua materi baru. Peran dan frasa kewajiban pada materi krisis ditelusuri ke regulasi yang berlaku sebelum dinyatakan sebagai ketentuan nasional.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-17","sourceLocator":"Slide 189–192, 197–199"},{"text":"Pemulihan pascakrisis dan evaluasi kebutuhan. Tim menilai dampak kesehatan, kerusakan sarana dan perbekalan, kerugian akibat layanan yang tidak berjalan, gangguan akses, serta peningkatan risiko yang masih berlangsung. Temuan digunakan untuk memperkirakan kebutuhan pemulihan dan menetapkan prioritas yang dapat ditindaklanjuti.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-18","sourceLocator":"Slide 193–199"},{"text":"Contoh: gedung Puskesmas telah dibuka kembali, tetapi transportasi dan alat bantu warga belum pulih. Tim membedakan perbaikan bangunan, fungsi layanan dan akses pasien lalu merencanakan tindak lanjut kebutuhan tersisa.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-18","sourceLocator":"Slide 193–199"},{"text":"Batas profesi: Penilaian teknis bangunan, penganggaran dan keputusan rekonstruksi mengikuti tenaga serta pejabat yang berwenang.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-18","sourceLocator":"Slide 193–199"}]},{"id":"k5m1-s11","title":"Pelayanan gigi, sarana, dan pencatatan","paragraphs":[{"text":"Pelayanan gigi memerlukan sarana, alat, bahan, instrumen pemeriksaan, serta tenaga yang sesuai dengan jenis pelayanan. Petugas mencatat temuan, tindakan, dan tindak lanjut pada rekam pelayanan agar informasi dapat digunakan pada kunjungan berikutnya.","refs":["LK2024"]},{"text":"Tim mengenali bahwa perdarahan atau pembengkakan gigi dan mulut yang disertai gangguan keadaan umum dapat memerlukan penilaian segera oleh tenaga berwenang. Tim menghubungkan kebutuhan kegawatdaruratan dengan penanganan awal dan rujukan, bukan membatasi seluruh keluhan gigi pada antrean rutin.","refs":["LK2024"]},{"text":"Pengenalan kegawatdaruratan gigi dan mulut. Tim tidak menempatkan seluruh keluhan gigi pada antrean rutin. Perdarahan yang tidak terkendali, pembengkakan atau infeksi dengan ancaman keadaan umum, trauma wajah, dan keadaan gawat lain memerlukan penilaian keselamatan segera serta bantuan tenaga yang sesuai.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-03","sourceLocator":"Slide 39–40"},{"text":"Contoh: pasien dengan pembengkakan mulut disertai keadaan umum memburuk datang saat antrean penuh. Petugas menghubungkan penilaian keselamatan segera dan bantuan tenaga gigi, tanpa menunggu seluruh antrean rutin selesai.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-03","sourceLocator":"Slide 39–40"},{"text":"Batas profesi: Daftar kondisi pada slide 40 merupakan pengenalan; tata laksana anafilaksis, avulsi, dislokasi TMJ, abses, dan tindakan lainnya memerlukan protokol klinis serta kompetensi yang sesuai.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-03","sourceLocator":"Slide 39–40"}]},{"id":"k5m1-s12","title":"Organisasi dan mutu laboratorium","paragraphs":[{"text":"Laboratorium Puskesmas merupakan bagian jejaring laboratorium kesehatan masyarakat yang memerlukan tenaga, sarana, alat, dan alur rujukan sesuai kemampuan pemeriksaan. Layanan dapat mencakup spesimen klinis maupun sampel lingkungan, vektor, dan binatang pembawa penyakit sesuai fungsi serta prosedur.","refs":["LK2024"]},{"text":"Laboratorium menjaga mutu melalui pemantapan mutu internal, pemantapan mutu eksternal, pengendalian alat, dan kalibrasi sesuai kebutuhan. Pencatatan dan analisis hasil mendukung pelayanan serta pemantauan wilayah; data agregat tidak menghapus kewajiban tindak lanjut individual yang memerlukan tindakan.","refs":["LK2024"]},{"text":"Labkesmas tingkat 1, fungsi jejaring dan kesiapan sumber daya. Labkesmas tingkat 1 menghubungkan pemeriksaan spesimen klinis, pengujian sampel lingkungan/vektor/BPP, surveilans dan respons, pengelolaan data, serta komunikasi hasil dengan pelayanan Puskesmas. Matriks slide 145 menempatkan fungsi jejaring secara berjenjang; peserta tidak membebankan seluruh empat belas fungsi kepada Puskesmas.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-12","sourceLocator":"Slide 141–150"},{"text":"Matriks sumber menempatkan fungsi Labkesmas secara berjenjang. Lima fungsi langsung Puskesmas meliputi pemeriksaan spesimen klinis; pengujian sampel lingkungan, vektor dan binatang pembawa penyakit sesuai kemampuan; surveilans penyakit dan faktor risiko kesehatan serta respons kejadian luar biasa, wabah dan bencana; pengelolaan dan analisis data laboratorium; serta komunikasi dengan tenaga klinis dan pemangku kepentingan. Puskesmas berkoordinasi dalam jejaring dan tidak otomatis menjalankan seluruh empat belas fungsi semua jenjang.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-12","sourceLocator":"Slide 145"},{"text":"Contoh: alat laboratorium baru sudah ada, tetapi pelaksana dan validasi hasil belum siap. Pengelola menelaah tenaga, alur, keselamatan dan dukungan jejaring sebelum membuka layanan; keberadaan alat saja belum membuktikan kesiapan pemeriksaan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-12","sourceLocator":"Slide 141–150"},{"text":"Batas profesi: Pemeriksaan, validasi dan pengambilan sampel dilakukan tenaga sesuai kompetensi; pengadaan atau penetapan standar tidak diputuskan oleh peserta kuis.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-12","sourceLocator":"Slide 141–150"},{"text":"Catatan sumber dan keselamatan: Angka tenaga, luas ruang dan jumlah alat pada slide 147–150 ditelusuri ke regulasi sumber sebelum dinyatakan sebagai syarat wajib. Angka jumlah fasilitas pada slide 144 merupakan angka dalam bahan sumber; audit tidak menyatakannya sebagai data nasional terkini.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-12","sourceLocator":"Slide 141–150"},{"text":"Mutu laboratorium pada tahap pra analitik, analitik dan pasca analitik. Pengendalian mutu internal mencakup ketepatan identifikasi dan permintaan, pengambilan serta penanganan spesimen, kesiapan alat dan bahan kontrol, sampai penyalinan, identitas penerima, keterbacaan dan ketepatan penyampaian hasil. Temuan mutu harus dihubungkan dengan tindakan koreksi dan penilaian apakah hasil perbaikan sudah memadai.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-14","sourceLocator":"Slide 162–168"},{"text":"Contoh: bahan kontrol internal tidak memenuhi kriteria ketika laporan hampir diterbitkan. Petugas mengeskalasi temuan dan mengikuti pengendalian hasil. Pemeriksaan bahan kontrol sehari-hari berbeda dari PME melalui uji profisiensi, uji banding atau uji silang. Koreksi harus diperiksa hasilnya, bukan hanya dicatat sebagai rencana.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-14","sourceLocator":"Slide 162–168"},{"text":"Batas profesi: Keputusan menerima hasil pemeriksaan, mengulang analisis dan mengeluarkan hasil mengikuti penanggung jawab serta prosedur laboratorium.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-14","sourceLocator":"Slide 162–168"},{"text":"Catatan sumber dan keselamatan: Slide 167–168 tersembunyi dan secara eksplisit bertajuk RPMK; verifikasi status aturan sebelum menggunakan kata wajib atau angka dua kali setahun sebagai ketentuan nasional.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-14","sourceLocator":"Slide 162–168"}]},{"id":"k5m1-s13","title":"Tingkat penanganan keadaan gawat","paragraphs":[{"text":"Tim melakukan survei primer untuk mengenali dan menangani ancaman nyawa, kemudian melakukan survei sekunder dan penanganan definitif sesuai keadaan serta kemampuan fasilitas. Tenaga pelaksana mengikuti prosedur dan kompetensinya pada resusitasi, trauma, luka bakar, sengatan listrik, gigitan hewan berbisa, tenggelam, serta fraktur.","refs":["LK2024"]},{"text":"Materi pengenalan ini tidak memberi kewenangan melakukan tindakan resusitasi atau tata laksana khusus tanpa pelatihan dan penilaian praktik yang sesuai. Tim menggunakan penilaian ulang, stabilisasi, pemantauan, dan rujukan ketika kebutuhan pasien melampaui kemampuan Puskesmas.","refs":["LK2024"]},{"text":"Kegawatdaruratan khusus dan batas penggunaan rincian terapi. Kasus luka bakar, sengatan listrik, gigitan hewan berbisa, tenggelam, dan fraktur menghubungkan kebutuhan penilaian segera, bantuan tenaga terlatih, pemantauan, serta rujukan berdasarkan kondisi dan kemampuan fasilitas. Tim mencatat mekanisme kejadian serta perubahan keadaan dan tidak menunda eskalasi hanya untuk melengkapi tabel atau perhitungan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-05","sourceLocator":"Slide 60–72"},{"text":"Contoh: pasien setelah tenggelam tampak membaik. Penilaian dan pemantauan oleh tenaga berwenang menentukan langkah berikutnya; satu angka observasi yang tidak jelas konteksnya dalam slide tidak cukup menjadi aturan pulang semua pasien.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-05","sourceLocator":"Slide 60–72"},{"text":"Batas profesi: Penetapan terapi dan keputusan klinis tetap berada pada tenaga yang kompeten.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-05","sourceLocator":"Slide 60–72"},{"text":"Catatan sumber dan keselamatan: Slide 60–61 menggabungkan beberapa kondisi dan terapi secara sangat ringkas. Slide 66 dan 67 berisi duplikasi. Slide 69 memuat istilah/angka terapi yang perlu penelaahan klinis. Slide 70 mencantumkan rincian antivenom dan tes alergi; status serta kesesuaian protokol perlu diverifikasi. Slide 71 memuat angka observasi 8 jam dan 24 jam tanpa konteks keputusan yang cukup.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-05","sourceLocator":"Slide 60–72"}]},{"id":"k5m1-s14","title":"Pengenalan rehabilitasi medik dasar dan alur fisioterapi","paragraphs":[{"text":"Rehabilitasi medik dasar dan alur fisioterapi. Bahan PPT baru menyediakan uraian rehabilitasi medik dasar dan fisioterapi yang sebelumnya belum tersedia dalam salinan PDF lama. Tim menilai keluhan dan fungsi dalam klaster terkait, kemudian menghubungkan kebutuhan dengan tenaga yang kompeten. Sumber memuat tujuan pelayanan, kebutuhan SDM, contoh kondisi, alur pemeriksaan, penetapan indikasi, asuhan, dokumentasi dan tindak lanjut. Contoh kebutuhan asesmen dalam sumber mencakup nyeri muskuloskeletal, keterbatasan fungsi setelah fraktur, masalah neuromuskular dan keterlambatan tumbuh kembang; pencantuman kondisi tidak berarti semua pasien menerima modalitas yang sama.","refs":["ICOPE2025","KMK6312026","LKPPT2025"],"enrichmentUnit":"K5-PPT-19","sourceLocator":"Slide 200–205"},{"text":"Contoh: pasien dengan fungsi berjalan menurun meminta alat tertentu. Tim menghubungkan asesmen berwenang, penilaian indikasi dan kontraindikasi, tujuan fungsi, rencana asuhan, evaluasi ulang serta komunikasi dengan perujuk. Diagnosis atau permintaan alat saja tidak menentukan modalitas bagi semua pasien.","refs":["ICOPE2025","KMK6312026","LKPPT2025"],"enrichmentUnit":"K5-PPT-19","sourceLocator":"Slide 200–205"},{"text":"Batas profesi: Pencantuman dokter, fisioterapis serta tenaga dengan pelatihan khusus pada slide 203 tidak ditafsirkan sebagai izin otomatis bagi semua staf untuk melakukan seluruh modalitas.","refs":["ICOPE2025","KMK6312026","LKPPT2025"],"enrichmentUnit":"K5-PPT-19","sourceLocator":"Slide 200–205"},{"text":"Catatan sumber dan keselamatan: Istilah aktualisasi rendah dan penomoran bercabang pada slide 204 memerlukan klarifikasi bila akan diterjemahkan menjadi algoritme teknis. Kalimat lama tentang ketidaktersediaan fisioterapi dikoreksi dengan membedakan PDF lama dan PPT baru.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-19","sourceLocator":"Slide 200–205"}]},{"id":"k5m1-s15","title":"Pengenalan modalitas fisik dan keselamatan","paragraphs":[{"text":"Pengenalan modalitas fisik dan keselamatan terapi. Sumber baru memperkenalkan infrared, stimulasi listrik TENS, serta ultrasound sebagai modalitas yang dibahas dalam bagian fisioterapi. Dalam pembelajaran staf umum, materi menekankan penilaian oleh tenaga kompeten, penjelasan tujuan dan persetujuan, pemeriksaan area serta kontraindikasi, pemantauan kenyamanan, pelaporan keluhan saat tindakan, dan evaluasi setelah terapi.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-20","sourceLocator":"Slide 206–209"},{"text":"Contoh: petugas menemukan label yang menyamakan TENS dengan infrared. Ketidakkonsistenan itu perlu klarifikasi; pengenalan nama infrared, TENS dan ultrasound tidak memberi kewenangan memilih alat atau menetapkan dosis. Tujuan, persetujuan, kondisi area dan kontraindikasi dinilai tenaga kompeten sebelum tindakan; keluhan selama terapi perlu ditanggapi.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-20","sourceLocator":"Slide 206–209"},{"text":"Batas profesi: Pengoperasian alat, pemilihan modalitas, indikasi dan dosis memerlukan kompetensi serta prosedur yang sesuai; materi ini menilai pengenalan dan eskalasi.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-20","sourceLocator":"Slide 206–209"},{"text":"Catatan sumber dan keselamatan: Slide 207 menyebut TENS sebagai terapi infrared dan mengulang istilah infrared dalam prosedur. Slide 206–209 memakai judul Layanan Fisiologis; nomenklatur dan rincian klinis perlu penelaahan. Slide 208 menyatakan manfaat serta efek samping dengan rumusan umum tanpa rujukan penelitian yang cukup pada slide; jangan membuat klaim efektivitas pasti. Slide 209 menyebut waktu 7–10 menit; jangan menerapkannya kepada seluruh pasien atau alat tanpa penetapan profesional.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-20","sourceLocator":"Slide 206–209"}]},{"id":"k5m1-s16","title":"Pengenalan pemantauan terapi dan farmakovigilans","paragraphs":[{"text":"Farmakovigilans, PTO dan evaluasi penggunaan obat. Tim membedakan dugaan efek samping obat dari masalah efektivitas, ketidaktersediaan, ketidakmampuan membeli, atau hambatan penggunaan. Petugas mencatat obat dan waktu penggunaan, keluhan atau perubahan keadaan, serta informasi yang diperlukan untuk evaluasi, kemudian segera mengomunikasikan masalah kepada tenaga penanggung jawab sesuai risiko.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-10","sourceLocator":"Slide 121–127"},{"text":"Contoh: keluhan baru timbul setelah perubahan obat dan pasien kesulitan membeli obat lain. Catat obat, waktu penggunaan, keluhan serta hambatan akses secara terpisah; komunikasikan menurut risiko. Dugaan efek samping belum membuktikan sebab obat. PTO menelaah kebutuhan individu, sedangkan evaluasi penggunaan obat menilai pola terhadap kriteria; keduanya berbeda dari pelaporan dugaan efek samping.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-10","sourceLocator":"Slide 121–127"},{"text":"Batas profesi: Petugas tidak menghentikan atau mengganti terapi di luar kewenangan; keputusan keselamatan segera mengikuti penilaian klinis.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-10","sourceLocator":"Slide 121–127"},{"text":"Catatan sumber dan keselamatan: Alamat dan mekanisme sistem pelaporan pada slide 122 perlu dikonfirmasi pada pelaksanaan; jangan menganggap pembukaan laman berarti laporan diterima.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-10","sourceLocator":"Slide 121–127"}]}],"legacy":[{"id":"pedoman-I-13","title":"Lintas klaster: keselamatan, obat, spesimen, dan rujukan","body":"<p>Pelayanan lintas klaster membantu menyelesaikan kebutuhan pasien dari berbagai kelompok usia. Triase menentukan prioritas berdasarkan keadaan klinis. Petugas memberikan penanganan segera pada keadaan mengancam nyawa; petugas tidak mendahulukan kelengkapan administrasi daripada tindakan yang diperlukan.<\/p>\n<p>Pelayanan kefarmasian tidak hanya menyerahkan obat. Apoteker mengkaji resep untuk menemukan masalah terkait obat; tenaga teknis kefarmasian membantu sesuai kewenangan. Pengkajian, pemberian informasi, dan konseling membantu mencegah kesalahan penggunaan obat.<\/p>\n<p>Keamanan laboratorium dimulai sebelum pemeriksaan. Petugas memastikan identitas, jenis dan mutu spesimen, wadah, serta cara pengiriman. Pada pot dahak, pedoman meminta nama pasien dan identitas spesimen ditulis pada dinding pot, bukan hanya pada tutup. Tutup yang tertukar dapat merusak keterlacakan.<\/p>\n<p><b>Contoh lapangan:<\/b> pasien membutuhkan pemeriksaan dahak. Petugas menyiapkan wadah dan memberi identitas pada dinding pot, mengarahkan pengumpulan di tempat sesuai pedoman, lalu menghubungkan hasil dengan pemeriksa untuk tindak lanjut. Resep yang memerlukan penjelasan dikaji terlebih dahulu, bukan langsung diserahkan tanpa pemeriksaan.<\/p>","refs":["LK2024","K2"]},{"id":"pedoman-I-14","title":"Dari pelayanan harian ke kesiapsiagaan krisis","body":"<p>Pelayanan memerlukan obat, bahan medis habis pakai, tenaga, alat, ruang, serta sistem rujukan yang siap. Tim merencanakan kebutuhan, memeriksa penerimaan, menjaga penyimpanan, mengendalikan stok, serta mendokumentasikan pemakaian. Laboratorium dan rawat inap bekerja sesuai kemampuan fasilitas, kompetensi petugas, serta jalur rujukan.<\/p>\n<p>Krisis kesehatan berbeda dari kegawatdaruratan satu orang. Pedoman membagi penanggulangan menjadi prakrisis, darurat krisis, dan pascakrisis. Pada prakrisis, tim mengkaji risiko, membuat rencana, memperkuat fasilitas, melatih SDM, dan menyiapkan sumber daya. Pada darurat krisis, tim melakukan penilaian cepat, pelayanan darurat, pelaporan, koordinasi, serta menjaga pelayanan esensial tetap berjalan.<\/p>\n<p>Sesudah krisis, tim berpartisipasi dalam penilaian kerusakan dan kebutuhan, pemulihan, serta evaluasi pembelajaran. Persiapan layanan ibu, anak, lansia, penyakit kronis, obat, dan sanitasi tidak berhenti hanya karena perhatian terpusat pada korban akut.<\/p>\n<p><b>Contoh lapangan:<\/b> Puskesmas menghadapi banjir. Tim menyiapkan penilaian cepat dan pelayanan darurat sambil memastikan kebutuhan layanan esensial, obat, tenaga, serta pelaporan. Menghentikan seluruh pelayanan rutin tanpa pengaturan kesinambungan bukan rencana terpadu.<\/p>","refs":["LK2024"]}],"figures":[]},{"id":"k5m2","title":"Materi 2 — Koordinasi, transisi, dan dukungan pasien serta keluarga","sections":[{"id":"k5m2-s1","title":"Koordinasi asuhan yang mempunyai penanggung jawab","paragraphs":[{"text":"Tim pelayanan mengusulkan rencana terpadu yang menghubungkan masalah prioritas, tujuan pasien, intervensi, penanggung jawab, jadwal, serta umpan balik. Koordinator memastikan hubungan antarpelayanan tanpa mengambil alih seluruh tugas profesi lain.","refs":["LK2024","ILP2023"]},{"text":"Tim menutup alur rujukan dengan memastikan pasien diterima, memperoleh tindak lanjut, dan mengomunikasikan hasil kembali kepada pihak yang merencanakan asuhan. Jumlah surat atau telepon tidak membuktikan bahwa kebutuhan pasien telah terpenuhi.","refs":["LK2024","ILP2023"]},{"text":"Tata kerja Lintas Klaster dan penanggung jawab perjalanan pasien. Lintas Klaster menyediakan dukungan diagnostik, terapeutik, kegawatdaruratan, serta pelayanan penunjang bagi kelompok sasaran yang dilayani klaster terkait. Kepala Puskesmas dan penanggung jawab Lintas Klaster menghubungkan pelayanan gigi, kefarmasian, Labkesmas tingkat 1, rawat inap, krisis, serta rehabilitasi dasar sesuai kemampuan fasilitas.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-01","sourceLocator":"Slide 7–13"},{"text":"Tata kerja Lintas Klaster dan penanggung jawab perjalanan pasien. Pada satu kunjungan, tim menetapkan unit yang memeriksa pasien, unit penunjang yang menerima permintaan, dan tenaga yang menerima kembali hasil serta menetapkan tindak lanjut. Perpindahan ke unit penunjang tidak menutup tanggung jawab asuhan; informasi yang belum ditindaklanjuti tetap mempunyai penanggung jawab.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-01","sourceLocator":"Slide 7–13"},{"text":"Kasus penerapan: Seorang lansia dari Klaster 3 memerlukan pemeriksaan darah, obat, dan penilaian kebutuhan fisioterapi; setiap unit mengira unit lain akan menghubungi keluarga. Respons yang diharapkan: Menetapkan peran tiap unit dan penanggung jawab penerimaan hasil. Menyepakati komunikasi serta tindak lanjut bersama pasien dan pendamping yang disetujui.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-01","sourceLocator":"Slide 7–13"},{"text":"Batas profesi: Keterlibatan unit tidak memindahkan kewenangan diagnosis, pengkajian klinis, atau intervensi profesional kepada seluruh staf.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-01","sourceLocator":"Slide 7–13"},{"text":"Alur kegawatdaruratan, survei primer dan sekunder, pemantauan serta rujukan. Pelayanan dimulai dengan pengenalan tanda kegawatan dan triase berdasarkan keadaan pasien. Tim berwenang melakukan penilaian awal serta stabilisasi sesuai kompetensi, kemudian memutuskan apakah kebutuhan pasien dapat ditangani di Puskesmas atau memerlukan rujukan. Administrasi dan wawancara yang tidak mendesak tidak menunda respons keselamatan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-04","sourceLocator":"Slide 46–59, 73–74"},{"text":"Alur kegawatdaruratan, survei primer dan sekunder, pemantauan serta rujukan. Gambar survei sekunder pada slide 59 memuat SAMPLE: tanda/gejala, alergi, obat yang digunakan, riwayat medis, asupan terakhir, serta kejadian sebelum keluhan. Setelah ancaman segera ditangani, tenaga berwenang melengkapi pemeriksaan dan pemantauan sesuai kondisi. Saat rujukan, tim memperbarui keadaan, tindakan, obat, kebutuhan pemantauan, penerima, transportasi dan pendamping; tim tetap menelusuri hasil rujukan atau rujuk balik.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-04","sourceLocator":"Slide 46–59, 73–74"},{"text":"Kasus penerapan: Pasien sesak memburuk ketika keluarga belum menyelesaikan administrasi; obat dari fasilitas lain dan alerginya belum terkonfirmasi. Respons yang diharapkan: Mendahulukan penilaian gawat dan bantuan sesuai kewenangan. Menyampaikan ketidakpastian secara jelas, melengkapi informasi relevan, dan menyiapkan rujukan aman.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-04","sourceLocator":"Slide 46–59, 73–74"},{"text":"Batas profesi: Kuis menilai prioritas serta koordinasi. Resusitasi, penggunaan AED, pemeriksaan fisik khusus, dan tindakan invasif memerlukan pelatihan serta penilaian praktik tersendiri.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-04","sourceLocator":"Slide 46–59, 73–74"},{"text":"Catatan sumber dan keselamatan: Slide 56 mengulang label bernapas normal/ada denyut pada dua cabang dengan tindakan berbeda; jangan menyalin diagram sebagai algoritme klinis atau kunci ujian tanpa klarifikasi. Slide 54 membedakan prioritas 0 pada konteks bencana dan pasien meninggal saat tiba; konteks tersebut harus dipertahankan dan waktu tunggu tidak digeneralisasi.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-04","sourceLocator":"Slide 46–59, 73–74"}]},{"id":"k5m2-s2","title":"Rekonsiliasi dan kesinambungan pengobatan","paragraphs":[{"text":"Pada perpindahan layanan, tim membandingkan obat yang benar-benar digunakan dengan daftar sebelum dan sesudah perawatan. Tim mengklarifikasi duplikasi, obat yang dihentikan, perubahan dosis yang tercatat, serta ketidakjelasan instruksi kepada tenaga berwenang sebelum menyepakati daftar yang digunakan di rumah.","refs":["LK2024"]},{"text":"Petugas menjelaskan perubahan kepada pasien dan caregiver yang disetujui pasien, kemudian meminta penjelasan balik. Tim menilai siapa yang mengambil obat, siapa yang membantu penggunaan, ketersediaan obat, dan hambatan pembiayaan atau transportasi tanpa mengubah terapi sendiri di luar kewenangan.","refs":["LK2024"]},{"text":"Rantai dingin, vaksin dan obat berisiko. Petugas mengikuti persyaratan penyimpanan produk, mencatat pemantauan kondisi, dan menindaklanjuti penyimpangan. Pada vaksin, tim menilai rantai dingin, tanggal kedaluwarsa, status vial dan informasi pemakaian; diagram VVM pada slide 92 menuntut pembacaan perbandingan warna, bukan penggunaan semua vial yang masih mempunyai tanggal berlaku.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-07","sourceLocator":"Slide 87–92, 94"},{"text":"Rantai dingin, vaksin dan obat berisiko. Petugas memisahkan produk yang memerlukan klarifikasi kelayakan dan menghubungi penanggung jawab sebelum pemakaian. Obat LASA, obat berisiko tinggi, narkotika/psikotropika/prekursor serta obat emergensi memerlukan pengaturan akses, penandaan, pemeriksaan dan penyimpanan sesuai aturan serta prosedur.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-07","sourceLocator":"Slide 87–92, 94"},{"text":"Kasus penerapan: Satu vial masih belum kedaluwarsa tetapi warna indikator mencapai batas tidak digunakan; pada rak lain obat bernama mirip ditempatkan berdekatan. Respons yang diharapkan: Menahan pemakaian dan mengeskalasi penilaian kelayakan vaksin. Memperbaiki pengaturan risiko LASA melalui penanggung jawab.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-07","sourceLocator":"Slide 87–92, 94"},{"text":"Batas profesi: Penetapan kelayakan produk dan pemusnahan mengikuti tenaga serta prosedur yang berwenang.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-07","sourceLocator":"Slide 87–92, 94"},{"text":"Catatan sumber dan keselamatan: Batas suhu, pemakaian vial terbuka, dan model refrigerator pada slide 89–91 perlu dicocokkan dengan produk serta pedoman imunisasi yang berlaku; jangan menjadikannya angka universal seluruh vaksin.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-07","sourceLocator":"Slide 87–92, 94"},{"text":"Pengkajian resep, penyerahan dan informasi obat. Pengkajian resep menilai kesesuaian identitas dan informasi fasilitas, karakteristik sediaan, serta aspek klinis seperti indikasi, dosis, cara penggunaan, duplikasi, alergi, kontraindikasi dan interaksi. Sumber membedakan peran apoteker dalam pengkajian klinis dari bantuan tenaga vokasi pada lingkup yang sesuai.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-08","sourceLocator":"Slide 105–112"},{"text":"Pengkajian resep, penyerahan dan informasi obat. Sebelum penyerahan, petugas memastikan ketepatan penyiapan, etiket, wadah dan penerima. Ketidaktersediaan obat atau masalah resep dikomunikasikan kepada pemberi resep atau penanggung jawab klinis. Informasi obat menjelaskan penggunaan, hasil yang diharapkan, penyimpanan dan masalah yang perlu dilaporkan; pelayanan informasi dapat bersifat aktif maupun responsif.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-08","sourceLocator":"Slide 105–112"},{"text":"Kasus penerapan: Pasien menerima dua nama dagang berbeda yang diduga mempunyai zat aktif sama dan meminta obat segera diserahkan. Respons yang diharapkan: Mengklarifikasi masalah melalui apoteker dan pemberi resep sebelum penyerahan. Memastikan daftar serta informasi penggunaan yang disepakati.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-08","sourceLocator":"Slide 105–112"},{"text":"Batas profesi: Materi tidak memberikan kewenangan pengkajian klinis atau substitusi mandiri kepada seluruh staf.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-08","sourceLocator":"Slide 105–112"}]},{"id":"k5m2-s3","title":"Hasil laboratorium dan tanggung jawab tindak lanjut","paragraphs":[{"text":"Pengelola menetapkan siapa yang memeriksa hasil, menghubungi pasien, serta mencatat keputusan tindak lanjut. Hasil yang memerlukan tindakan segera dikomunikasikan melalui jalur eskalasi sesuai prosedur; petugas tidak menunggu kunjungan rutin hanya karena hasil sudah tersimpan pada sistem.","refs":["LK2024"]},{"text":"Jika pasien belum dapat dihubungi, tim mendokumentasikan upaya dan melakukan eskalasi sesuai risiko serta prosedur. Petugas memeriksa kesesuaian identitas dan mutu spesimen ketika temuan tidak sesuai kondisi pasien; petugas tidak mengabaikan hasil tanpa klarifikasi atau menyimpulkan diagnosis dari hasil yang identitasnya meragukan.","refs":["LK2024"]},{"text":"Labkesmas tingkat 1, fungsi jejaring dan kesiapan sumber daya. Labkesmas tingkat 1 menghubungkan pemeriksaan spesimen klinis, pengujian sampel lingkungan/vektor/BPP, surveilans dan respons, pengelolaan data, serta komunikasi hasil dengan pelayanan Puskesmas. Matriks slide 145 menempatkan fungsi jejaring secara berjenjang; peserta tidak membebankan seluruh empat belas fungsi kepada Puskesmas.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-12","sourceLocator":"Slide 141–150"},{"text":"Labkesmas tingkat 1, fungsi jejaring dan kesiapan sumber daya. Pengelola menilai kesiapan tenaga kompeten, penanggung jawab, alur validasi, ruangan, peralatan, keselamatan dan pemeliharaan berdasarkan kebutuhan serta kemampuan layanan. Kesenjangan yang tidak dapat dipenuhi di unit sendiri dihubungkan dengan jejaring dan rujukan; daftar alat tidak membuktikan bahwa semua pemeriksaan sudah dapat dilakukan dengan mutu yang baik.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-12","sourceLocator":"Slide 141–150"},{"text":"Kasus penerapan: Puskesmas mempunyai alat baru tetapi tenaga pelaksana, validasi hasil dan prosedur rujukan belum siap. Respons yang diharapkan: Menilai kesenjangan proses serta sumber daya dan merencanakan dukungan jejaring. Tidak membuka semua pemeriksaan hanya berdasarkan keberadaan alat.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-12","sourceLocator":"Slide 141–150"},{"text":"Batas profesi: Pemeriksaan, validasi dan pengambilan sampel dilakukan tenaga sesuai kompetensi; pengadaan atau penetapan standar tidak diputuskan oleh peserta kuis.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-12","sourceLocator":"Slide 141–150"},{"text":"Catatan sumber dan keselamatan: Angka tenaga, luas ruang dan jumlah alat pada slide 147–150 ditelusuri ke regulasi sumber sebelum dinyatakan sebagai syarat wajib. Angka jumlah fasilitas pada slide 144 merupakan angka dalam bahan sumber; audit tidak menyatakannya sebagai data nasional terkini.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-12","sourceLocator":"Slide 141–150"}]},{"id":"k5m2-s4","title":"Perencanaan pulang dan dukungan transisi","paragraphs":[{"text":"Tim menilai kesiapan pulang melalui kondisi klinis, pemahaman rencana, kemampuan perawatan, dukungan rumah, alat yang diperlukan, serta akses kontrol. Tim menguji kemampuan caregiver melalui demonstrasi balik untuk tugas yang sesuai perannya dan menyiapkan bantuan jika kemampuan belum memadai.","refs":["LK2024","CHARTRAND2023"]},{"text":"Discharge planning menyiapkan kebutuhan sesudah pemulangan, sedangkan transitional care menghubungkan dukungan ketika pasien berpindah tempat atau tingkat pelayanan. Bukti penelitian mendukung paket transisi yang terstruktur, tetapi tidak menjamin bahwa satu telepon atau satu lembar edukasi akan mencegah seluruh readmisi.","refs":["LK2024","CHARTRAND2023"]},{"text":"Kegawatdaruratan khusus dan batas penggunaan rincian terapi. Kasus luka bakar, sengatan listrik, gigitan hewan berbisa, tenggelam, dan fraktur menghubungkan kebutuhan penilaian segera, bantuan tenaga terlatih, pemantauan, serta rujukan berdasarkan kondisi dan kemampuan fasilitas. Tim mencatat mekanisme kejadian serta perubahan keadaan dan tidak menunda eskalasi hanya untuk melengkapi tabel atau perhitungan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-05","sourceLocator":"Slide 60–72"},{"text":"Kegawatdaruratan khusus dan batas penggunaan rincian terapi. Kerangka membatasi pengajaran staf umum pada pengenalan masalah, koordinasi, dan batas peran. Rumus cairan, dosis obat, antivenom, teknik jalan napas, serta tindakan khusus pada slide sumber menjadi bahan pendalaman tenaga berwenang setelah penelaahan protokol yang sesuai.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-05","sourceLocator":"Slide 60–72"},{"text":"Kasus penerapan: Pasien setelah tenggelam tampak membaik, tetapi petugas hanya mengacu pada satu angka lama observasi dari slide tanpa menilai keadaan klinisnya. Respons yang diharapkan: Menetapkan evaluasi oleh tenaga berwenang dan pemantauan berdasarkan keadaan pasien. Tidak menggunakan durasi tunggal dari slide sebagai aturan pulang universal.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-05","sourceLocator":"Slide 60–72"},{"text":"Batas profesi: Penetapan terapi dan keputusan klinis tetap berada pada tenaga yang kompeten.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-05","sourceLocator":"Slide 60–72"},{"text":"Catatan sumber dan keselamatan: Slide 60–61 menggabungkan beberapa kondisi dan terapi secara sangat ringkas. Slide 66 dan 67 berisi duplikasi. Slide 69 memuat istilah/angka terapi yang perlu penelaahan klinis. Slide 70 mencantumkan rincian antivenom dan tes alergi; status serta kesesuaian protokol perlu diverifikasi. Slide 71 memuat angka observasi 8 jam dan 24 jam tanpa konteks keputusan yang cukup.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-05","sourceLocator":"Slide 60–72"},{"text":"Rawat inap, observasi, stabilisasi dan kesiapan pulang. Tim menilai indikasi perawatan dan kemampuan sarana, tenaga serta pemantauan. Pasien dapat memerlukan perawatan sesuai kemampuan, observasi untuk keputusan diagnostik, atau stabilisasi sementara sebelum rujukan; adanya tempat tidur tidak cukup untuk menyimpulkan seluruh kebutuhan dapat ditangani.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-15","sourceLocator":"Slide 172, 174"},{"text":"Rawat inap, observasi, stabilisasi dan kesiapan pulang. Sebelum pasien kembali ke rumah, tim menilai obat, pemahaman, fungsi, kemampuan caregiver, alat dan akses kontrol. Rencana pulang serta serah terima menjelaskan penanggung jawab dan kontak bantuan. Pemantauan setelah pulang atau kunjungan rumah ditetapkan menurut kebutuhan dan risiko, sambil mempertahankan pengayaan transitional care serta paliatif yang sudah ada.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-15","sourceLocator":"Slide 172, 174"},{"text":"Kasus penerapan: Pasien stabil secara klinis, tetapi caregiver belum mampu membantu perawatan dan rumah sulit dijangkau. Respons yang diharapkan: Meninjau kesiapan pulang bersama tim dan keluarga. Mengatur dukungan nyata, informasi obat dan tindak lanjut, atau rujukan sesuai kebutuhan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-15","sourceLocator":"Slide 172, 174"},{"text":"Batas profesi: Keputusan rawat, pulang dan rujukan memerlukan penilaian klinis berwenang; kuis tidak menggantikannya.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-15","sourceLocator":"Slide 172, 174"}]},{"id":"k5m2-s5","title":"Caregiver dan kebutuhan sosial","paragraphs":[{"text":"Tim menanyakan tugas pengasuhan yang sulit, kesehatan pengasuh, waktu istirahat, serta bantuan yang tersedia. Tim menyepakati pembagian tugas dan pengganti caregiver berdasarkan sumber daya nyata, bukan menganggap seluruh anggota keluarga siap hanya karena tinggal satu rumah.","refs":["ICOPE2025","LK2024"]},{"text":"Tim menghubungkan bantuan sosial yang tersedia dengan kebutuhan yang disetujui pasien dan mengevaluasi apakah bantuan diterima serta memecahkan hambatan. Keluarga merupakan mitra yang memiliki kebutuhan dukungan; keluarga bukan pengganti tenaga profesional untuk tindakan yang memerlukan kompetensi khusus.","refs":["ICOPE2025","LK2024"]}]},{"id":"k5m2-s6","title":"Rehabilitasi dan fungsi sehari hari","paragraphs":[{"text":"Tim menghubungkan penilaian fungsi sehari-hari dengan mobilitas, keamanan rumah, kebutuhan alat, dan dukungan caregiver. Temuan fungsi mengarahkan koordinasi dengan profesi rehabilitasi atau layanan yang tersedia sesuai indikasi, bukan pemberian latihan seragam kepada semua pasien.","refs":["ICOPE2025","LK2024"]},{"text":"Salinan PDF pedoman Lintas Klaster lama mencantumkan fisioterapi pada daftar isi, tetapi uraian babnya tidak ditemukan dalam PDF tersebut. Sumber PPT versi V25 yang baru ditelaah kini menyediakan rehabilitasi medik dasar dan fisioterapi pada slide 200–209. Materi menggunakan alur asesmen, penetapan indikasi oleh tenaga kompeten, asuhan, evaluasi ulang, dokumentasi dan komunikasi kepada perujuk; rincian alat, dosis serta label yang belum konsisten tidak dijadikan protokol otomatis.","refs":["LK2024","LKPPT2025","ICOPE2025"]},{"text":"Rehabilitasi medik dasar dan alur fisioterapi. Bahan PPT baru menyediakan uraian rehabilitasi medik dasar dan fisioterapi yang sebelumnya belum tersedia dalam salinan PDF lama. Tim menilai keluhan dan fungsi dalam klaster terkait, kemudian menghubungkan kebutuhan dengan tenaga yang kompeten. Sumber memuat tujuan pelayanan, kebutuhan SDM, contoh kondisi, alur pemeriksaan, penetapan indikasi, asuhan, dokumentasi dan tindak lanjut. Contoh kebutuhan asesmen dalam sumber mencakup nyeri muskuloskeletal, keterbatasan fungsi setelah fraktur, masalah neuromuskular dan keterlambatan tumbuh kembang; pencantuman kondisi tidak berarti semua pasien menerima modalitas yang sama.","refs":["ICOPE2025","KMK6312026","LKPPT2025"],"enrichmentUnit":"K5-PPT-19","sourceLocator":"Slide 200–205"},{"text":"Rehabilitasi medik dasar dan alur fisioterapi. Fisioterapis melakukan pemeriksaan dan asesmen sesuai lingkupnya, menilai kebutuhan konsultasi ketika terdapat kontraindikasi atau kebutuhan spesialistik, kemudian menyusun serta mengevaluasi asuhan. Hasil evaluasi dikomunikasikan kepada dokter perujuk untuk keputusan kelanjutan dan koordinasi. Dukungan keluarga, keamanan rumah, kemampuan harian dan tujuan pasien tetap menjadi bagian rencana terpadu; kuis tidak memberikan kewenangan tindakan baru.","refs":["ICOPE2025","KMK6312026","LKPPT2025"],"enrichmentUnit":"K5-PPT-19","sourceLocator":"Slide 200–205"},{"text":"Kasus penerapan: Pasien dengan keterbatasan fungsi pascaperawatan meminta latihan atau alat tertentu, tetapi indikasi, kontraindikasi dan kebutuhan penanganan lanjut belum dinilai. Respons yang diharapkan: Menghubungkan pasien dengan asesmen berwenang sebelum intervensi. Menyepakati tujuan fungsi, dokumentasi, evaluasi ulang dan komunikasi dengan perujuk serta caregiver.","refs":["ICOPE2025","KMK6312026","LKPPT2025"],"enrichmentUnit":"K5-PPT-19","sourceLocator":"Slide 200–205"},{"text":"Batas profesi: Pencantuman dokter, fisioterapis serta tenaga dengan pelatihan khusus pada slide 203 tidak ditafsirkan sebagai izin otomatis bagi semua staf untuk melakukan seluruh modalitas.","refs":["ICOPE2025","KMK6312026","LKPPT2025"],"enrichmentUnit":"K5-PPT-19","sourceLocator":"Slide 200–205"},{"text":"Catatan sumber dan keselamatan: Istilah aktualisasi rendah dan penomoran bercabang pada slide 204 memerlukan klarifikasi bila akan diterjemahkan menjadi algoritme teknis. Kalimat lama tentang ketidaktersediaan fisioterapi dikoreksi dengan membedakan PDF lama dan PPT baru.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-19","sourceLocator":"Slide 200–205"}]},{"id":"k5m2-s7","title":"Paliatif dan tujuan yang disepakati","paragraphs":[{"text":"Tim menghubungkan kebutuhan kenyamanan, gejala, fungsi, dukungan psikososial-spiritual, dan preferensi pasien dengan rencana asuhan yang realistis. Tim meninjau kembali tujuan ketika gejala, kemampuan caregiver, atau pilihan pasien berubah; kesepakatan lama tidak menggantikan penilaian ulang.","refs":["K3","KMK6312026"]},{"text":"Petugas mendengarkan keyakinan dan harapan pasien tanpa memaksakan nilai pribadi. Dukungan spiritual mengikuti pilihan pasien dan berjalan bersama penanganan gejala serta koordinasi klinis; dukungan tersebut tidak menggantikan evaluasi keluhan yang memburuk.","refs":["K3","KMK6312026"]}]},{"id":"k5m2-s8","title":"Pelayanan gigi yang tersambung dengan dukungan rumah","paragraphs":[{"text":"Setelah pemeriksaan atau tindakan gigi oleh tenaga berwenang, tim memastikan pasien memahami tindak lanjut, memiliki bantuan yang diperlukan, dan mengetahui cara mencari pertolongan jika keadaan memburuk. Pada pasien bergantung, tim menilai siapa yang membantu kebersihan mulut dan apakah ia memahami tugas yang aman.","refs":["LK2024"]},{"text":"Jika rujukan gigi belum terlaksana, tim menilai alasan seperti transportasi, biaya, komunikasi, dan dukungan pendamping, kemudian menghubungkan bantuan yang tersedia. Tim tidak menganggap ketidakhadiran selalu sebagai penolakan atau menutup rujukan hanya karena surat sudah diberikan.","refs":["LK2024"]},{"text":"Skrining gigi menurut siklus hidup, tindak lanjut, dan dukungan keluarga. Pelayanan gigi menautkan penemuan faktor risiko dan kelainan dengan tindak lanjut sesuai kelompok usia. Tim menyiapkan instrumen, mencatat temuan pemeriksaan oleh tenaga berwenang, memberikan edukasi yang sesuai kebutuhan, serta menghubungkan kasus yang memerlukan penanganan dengan fasilitas yang mampu. Temuan yang dicurigai sebagai lesi prakanker memerlukan penilaian dan rujukan yang sesuai; hasil skrining tidak diperlakukan sebagai diagnosis definitif.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-02","sourceLocator":"Slide 19–38, 42–43"},{"text":"Skrining gigi menurut siklus hidup, tindak lanjut, dan dukungan keluarga. Pada anak sekolah, diagram sumber membedakan jalur karies positif untuk penatalaksanaan dan jalur pencegahan dengan topikal fluoride pada temuan negatif. Pada lansia atau pasien bergantung, tim menilai siapa yang membantu kebersihan mulut, kemampuan mengunyah, serta hambatan datang untuk tindak lanjut. Tim mendokumentasikan hasil dan memastikan rujukan atau rujuk balik berlanjut.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-02","sourceLocator":"Slide 19–38, 42–43"},{"text":"Kasus penerapan: Skrining sekolah menemukan seorang anak tanpa karies dan anak lain dengan kelainan gigi yang membutuhkan perawatan; seorang lansia dalam keluarga yang sama sulit datang kontrol. Respons yang diharapkan: Membedakan edukasi/pencegahan, penilaian tindakan gigi, dan rujukan. Mengatur dukungan pendamping serta tindak lanjut yang terdokumentasi.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-02","sourceLocator":"Slide 19–38, 42–43"},{"text":"Batas profesi: Pemeriksaan dan aplikasi topikal fluoride mengikuti kompetensi serta penetapan tenaga gigi; materi tidak memberikan kewenangan melakukan tindakan kepada semua staf.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-02","sourceLocator":"Slide 19–38, 42–43"},{"text":"Catatan sumber dan keselamatan: Slide 23 memuat rumusan lesi prakanker yang secara tata bahasa tidak konsisten; gunakan jalur dugaan lesi untuk penilaian berwenang, bukan definisi diagnosis baru. Catatan pembicara slide 27 meminta penambahan topikal fluoride; catatan editorial dibedakan dari isi slide 26 yang sudah memperlihatkan alur tersebut.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-02","sourceLocator":"Slide 19–38, 42–43"},{"text":"Pengenalan kegawatdaruratan gigi dan mulut. Tim tidak menempatkan seluruh keluhan gigi pada antrean rutin. Perdarahan yang tidak terkendali, pembengkakan atau infeksi dengan ancaman keadaan umum, trauma wajah, dan keadaan gawat lain memerlukan penilaian keselamatan segera serta bantuan tenaga yang sesuai.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-03","sourceLocator":"Slide 39–40"},{"text":"Pengenalan kegawatdaruratan gigi dan mulut. Petugas mencatat keluhan, keadaan pasien, tindakan yang telah dilakukan, serta informasi penting untuk penerima. Tim mengatur tindak lanjut gigi setelah kebutuhan segera tertangani; edukasi keluarga mendukung perawatan rumah tanpa menggantikan tindakan profesional.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-03","sourceLocator":"Slide 39–40"},{"text":"Kasus penerapan: Pasien datang dengan pembengkakan mulut dan keadaan umum memburuk saat antrean pemeriksaan gigi penuh. Respons yang diharapkan: Mengeskalasi penilaian keselamatan segera. Menghubungkan tenaga berwenang dan rujukan berdasarkan kemampuan fasilitas.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-03","sourceLocator":"Slide 39–40"},{"text":"Batas profesi: Daftar kondisi pada slide 40 merupakan pengenalan; tata laksana anafilaksis, avulsi, dislokasi TMJ, abses, dan tindakan lainnya memerlukan protokol klinis serta kompetensi yang sesuai.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-03","sourceLocator":"Slide 39–40"}]},{"id":"k5m2-s9","title":"Respons krisis yang melindungi kesinambungan asuhan","paragraphs":[{"text":"Saat pengungsian, tim memadukan triase, pencatatan kebutuhan prioritas, komunikasi antarlayanan, serta kesinambungan obat dan alat bantu. Tim memperbarui data keluarga rentan dan menugaskan penanggung jawab untuk menindaklanjuti kebutuhan yang belum terpenuhi.","refs":["LK2024"]},{"text":"Tim mengevaluasi respons dengan memeriksa akses nyata terhadap bantuan dan perubahan kebutuhan, bukan hanya jumlah barang yang dikirim. Setelah respons awal, tim menilai kembali kesiapan pulang, keamanan rumah, serta keberlanjutan pengasuhan dan pelayanan rutin.","refs":["LK2024"]},{"text":"Kesiapsiagaan krisis, pembagian tanggung jawab dan RHA. Tim menghubungkan deteksi dini, pelaporan dan aktivasi respons dengan Kepala Puskesmas, penanggung jawab klaster, serta jejaring. Kesiapsiagaan menilai ancaman, kerentanan masyarakat dan fasilitas, sumber daya, rencana kontingensi, komunikasi, simulasi, serta kemampuan rujukan. Kelompok rentan dan kesinambungan layanan esensial dimasukkan sejak perencanaan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-16","sourceLocator":"Slide 177–188"},{"text":"Kesiapsiagaan krisis, pembagian tanggung jawab dan RHA. Penilaian cepat kesehatan menelaah jenis dan dampak kejadian, kapasitas yang masih dapat digunakan, kebutuhan segera, serta rekomendasi prioritas. Tim yang ditugaskan berkoordinasi lintas profesi dan sektor; informasi awal tidak digunakan untuk menetapkan seluruh kewenangan atau status hukum krisis oleh peserta.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-16","sourceLocator":"Slide 177–188"},{"text":"Kasus penerapan: Banjir memutus akses Puskesmas dan laporan penyakit meningkat; terdapat keluarga dengan bayi serta lansia bergantung. Respons yang diharapkan: Mengaktifkan pelaporan dan koordinasi, menilai kebutuhan segera serta kapasitas dan akses pelayanan. Memetakan bantuan keluarga rentan dan kebutuhan rujukan tanpa menunggu laporan sempurna.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-16","sourceLocator":"Slide 177–188"},{"text":"Batas profesi: Penetapan status kejadian dan mobilisasi resmi mengikuti pejabat serta mekanisme yang berwenang; partisipasi staf tetap sesuai penugasan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-16","sourceLocator":"Slide 177–188"},{"text":"Respons krisis, layanan esensial dan komunikasi risiko. Respons krisis menjaga pelayanan medis dan kesehatan masyarakat sambil menghubungkan kebutuhan dengan rencana operasi serta koordinasi bantuan. Sumber menguraikan pelayanan primer dan lanjutan, surveilans dan pengendalian penyakit, kesehatan lingkungan, kesehatan reproduksi, gizi, kesehatan jiwa, identifikasi korban meninggal, serta pemulasaran jenazah. Pengelola memantau akses nyata, bantuan yang diterima dan kesinambungan obat serta pengasuhan menurut kebutuhan dan peran layanan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-17","sourceLocator":"Slide 189–192, 197–199"},{"text":"Respons krisis, layanan esensial dan komunikasi risiko. Komunikasi risiko menjelaskan masalah, ketidakpastian yang relevan, tindakan yang dapat dilakukan masyarakat dan cara mencari pertolongan melalui kanal yang disepakati. Tim memberi ruang bagi kekhawatiran serta kebutuhan penyandang disabilitas dan melibatkan komunitas. Pelaporan perkembangan mendukung koreksi keputusan dan alokasi bantuan; pencatatan manual tetap dapat menjaga ketertelusuran ketika sistem elektronik terhambat.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-17","sourceLocator":"Slide 189–192, 197–199"},{"text":"Respons krisis, layanan esensial dan komunikasi risiko. Permintaan dukungan sumber daya disampaikan melalui penanggung jawab dan dinas kesehatan secara berjenjang sesuai mekanisme yang berlaku. Tim mengomunikasikan jenis bantuan, jumlah, lokasi, waktu kebutuhan, akses dan kapasitas penerimaan; pengendali operasi yang berwenang mengoordinasikan mobilisasi serta distribusinya. Pencatatan menjaga agar bantuan yang dikirim, yang diterima dan yang masih dibutuhkan dapat dibedakan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-17","sourceLocator":"Slide 189–192, 197–199"},{"text":"Kasus penerapan: Paket bantuan telah dikirim tetapi pasien bergantung belum menerima obat; rumor di pengungsian membuat warga enggan memakai layanan. Respons yang diharapkan: Menelusuri kebutuhan yang belum terpenuhi dan mengoordinasikan distribusi serta tindak lanjut. Menyampaikan informasi yang jelas dan mendengarkan hambatan warga melalui kanal yang sesuai.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-17","sourceLocator":"Slide 189–192, 197–199"},{"text":"Batas profesi: Peserta tidak mengeluarkan perintah karantina, menetapkan kewajiban hukum, atau menjanjikan sumber daya di luar penugasan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-17","sourceLocator":"Slide 189–192, 197–199"},{"text":"Catatan sumber dan keselamatan: Slide 189 dan 190 merupakan duplikasi; jangan menghitungnya sebagai dua materi baru. Peran dan frasa kewajiban pada materi krisis ditelusuri ke regulasi yang berlaku sebelum dinyatakan sebagai ketentuan nasional.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-17","sourceLocator":"Slide 189–192, 197–199"},{"text":"Pemulihan pascakrisis dan evaluasi kebutuhan. Tim menilai dampak kesehatan, kerusakan sarana dan perbekalan, kerugian akibat layanan yang tidak berjalan, gangguan akses, serta peningkatan risiko yang masih berlangsung. Temuan digunakan untuk memperkirakan kebutuhan pemulihan dan menetapkan prioritas yang dapat ditindaklanjuti.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-18","sourceLocator":"Slide 193–199"},{"text":"Pemulihan pascakrisis dan evaluasi kebutuhan. Pemulihan menghubungkan fungsi layanan, dukungan keluarga rentan, sumber daya serta partisipasi masyarakat. Tim mencatat pelaksanaan dan hambatan, memeriksa perubahan kebutuhan, serta menggunakan evaluasi dan pembelajaran untuk memperbaiki kesiapsiagaan berikutnya. Kembali beroperasinya gedung tidak otomatis berarti seluruh akses dan pengasuhan pasien sudah pulih.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-18","sourceLocator":"Slide 193–199"},{"text":"Kasus penerapan: Puskesmas sudah dibuka kembali setelah banjir, tetapi alat bantu pasien dan akses obat di satu desa belum pulih. Respons yang diharapkan: Memisahkan capaian pemulihan bangunan dari pulihnya fungsi serta akses. Menyusun prioritas, penanggung jawab dan penilaian ulang untuk kebutuhan tersisa.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-18","sourceLocator":"Slide 193–199"},{"text":"Batas profesi: Penilaian teknis bangunan, penganggaran dan keputusan rekonstruksi mengikuti tenaga serta pejabat yang berwenang.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-18","sourceLocator":"Slide 193–199"}]},{"id":"k5m2-s10","title":"Dokumentasi, privasi, dan bantuan digital","paragraphs":[{"text":"Petugas mendokumentasikan tujuan, persetujuan, hasil pemeriksaan, keputusan, penanggung jawab, dan tindak lanjut dalam catatan yang dapat digunakan tenaga penerima. Petugas membatasi data keluarga dan sosial yang dibagikan pada kebutuhan pelayanan serta melindungi akses terhadap informasi sensitif.","refs":["AIWHO2021","LK2024"]},{"text":"Tim menggunakan sistem digital dan AI sebagai bantuan yang memerlukan pemeriksaan manusia. Keluaran AI yang tidak sesuai data pasien atau sumber harus diklarifikasi sebelum digunakan; kecepatan sistem tidak menggantikan tanggung jawab klinis, keselamatan, atau perlindungan data.","refs":["AIWHO2021","LK2024"]}]},{"id":"k5m2-s11","title":"Pemantauan terapi dan dukungan farmasi di rumah","paragraphs":[{"text":"Tenaga berwenang menghubungkan visite, pemantauan terapi obat, evaluasi penggunaan obat, dan pemantauan efek samping dengan masalah pasien. Penggunaan obat yang memerlukan klarifikasi dilaporkan kepada penanggung jawab klinis; staf tidak mengubah regimen di luar kewenangan.","refs":["LK2024"]},{"text":"Home pharmacy care dan rujuk balik dapat mendukung kesinambungan penggunaan obat sesuai penugasan serta kebutuhan pasien. Petugas menilai penggunaan nyata, hambatan penyimpanan di rumah, kemampuan pasien atau caregiver, dan akses obat, kemudian mendokumentasikan tindak lanjut.","refs":["LK2024"]},{"text":"Konseling terstruktur, pemahaman pasien dan visite. Apoteker memulai konseling dengan memastikan identitas dan menggali pemahaman pasien mengenai obat, cara penggunaan, serta hasil yang diharapkan. Petugas menilai penggunaan nyata dan hambatan, memberikan penjelasan yang sesuai, kemudian meminta pasien atau pendamping yang disetujui mengulangi penjelasan untuk memeriksa pemahaman.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-09","sourceLocator":"Slide 113–120"},{"text":"Konseling terstruktur, pemahaman pasien dan visite. Pasien dengan kondisi khusus, terapi panjang, obat dengan instruksi khusus atau indeks terapi sempit, polifarmasi, dan hambatan kepatuhan memerlukan perhatian yang sesuai. Visite menghubungkan informasi klinis, riwayat obat termasuk obat bebas atau herbal, hasil pemeriksaan, serta masalah sosial dengan rekomendasi yang dikomunikasikan kepada tim. Tanda tangan dokumentasi tidak menggantikan pemeriksaan pemahaman.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-09","sourceLocator":"Slide 113–120"},{"text":"Kasus penerapan: Pasien pulang dengan regimen berubah mengangguk saat dijelaskan, tetapi caregiver tidak dapat menjelaskan obat yang dihentikan. Respons yang diharapkan: Menggali kembali pemahaman, mengklarifikasi perubahan, meminta penjelasan balik, dan mencatat tindak lanjut. Mendukung caregiver tanpa menyerahkan perubahan terapi kepadanya.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-09","sourceLocator":"Slide 113–120"},{"text":"Batas profesi: Konseling farmasi dan visite mengikuti tenaga serta kolaborasi yang ditetapkan; staf lain mendukung komunikasi dalam lingkupnya.","refs":["LK2024","LKPP
