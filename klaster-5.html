utusan Menteri Kesehatan Nomor HK.01.07/MENKES/2015/2023 tentang Petunjuk Teknis Integrasi Pelayanan Kesehatan Primer. Jakarta: Kementerian Kesehatan RI; 2023.","url":"https://kesprimkom.kemkes.go.id/assets/uploads/contents/others/2023kepmenkes2015.pdf"},{"key":"ICOPE2025","text":"World Health Organization. Integrated care for older people (ICOPE): guidance for person-centred assessment and pathways in primary care. 2nd ed. Geneva: World Health Organization; 2025.","url":"https://www.who.int/publications/i/item/9789240103726"},{"key":"CHARTRAND2023","text":"Chartrand J, Shea B, Hutton B, Dingwall O, Kakkar A, Chartrand M, et al. Patient- and family-centred care transition interventions for adults: a systematic review and meta-analysis of RCTs. Int J Qual Health Care. 2023;35(4):mzad102. doi:10.1093/intqhc/mzad102.","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10750974/"},{"key":"AIWHO2021","text":"World Health Organization. Ethics and governance of artificial intelligence for health: WHO guidance. Geneva: World Health Organization; 2021.","url":"https://www.who.int/publications/i/item/9789240029200"},{"key":"KMK6312026","text":"Kementerian Kesehatan Republik Indonesia. Keputusan Menteri Kesehatan Nomor HK.01.07/MENKES/631/2026 tentang Standar Kompetensi Dokter Spesialis dan Subspesialis Bidang Kedokteran Keluarga Layanan Primer. Jakarta: Kementerian Kesehatan RI; 2026 Jun 22. Salinan PDF unggahan.","url":"sources/KMK_631_2026.pdf"},{"key":"K3","text":"Kementerian Kesehatan Republik Indonesia. Pedoman kerja Puskesmas: Klaster III: Kesehatan Dewasa dan Lanjut Usia. Jakarta: Kementerian Kesehatan RI; 2024.","url":"https://renbut.kemkes.go.id/regulasi/Pedoman%20Puskesmas%20Klaster%203.pdf"},{"key":"LKPPT2025","text":"Kementerian Kesehatan Republik Indonesia. Pedoman kerja Puskesmas: Lintas Klaster [presentasi; versi kerja V25]. 2025 [tahun pada sampul]. Salinan unggahan: V25_Pedoman Puskesmas_Lintas Klaster(1).pptx. 211 slide; kata pengantar masih bertanggal Oktober 2024.","url":""},{"key":"K1","text":"Kementerian Kesehatan Republik Indonesia. Pedoman kerja Puskesmas Klaster I Manajemen. Jakarta: Kementerian Kesehatan RI; 2024.","url":"https://renbut.kemkes.go.id/regulasi/Pedoman%20Puskesmas%20Klaster%201.pdf"},{"key":"K2","text":"Kementerian Kesehatan Republik Indonesia. Pedoman kerja Puskesmas Klaster II Kesehatan Ibu dan Anak. Jakarta: Kementerian Kesehatan RI; 2024.","url":"https://renbut.kemkes.go.id/regulasi/Pedoman%20Puskesmas%20Klaster%202.pdf"},{"key":"K4","text":"Kementerian Kesehatan Republik Indonesia. Pedoman kerja Puskesmas Klaster IV Penanggulangan Penyakit Menular dan Kesehatan Lingkungan. Jakarta: Kementerian Kesehatan RI; 2024.","url":"https://renbut.kemkes.go.id/regulasi/Pedoman%20Puskesmas%20Klaster%204.pdf"}],"questions":{"pre":[{"id":"TF-k5-pre-01","difficulty":"medium","stem":"Pelayanan gigi di Puskesmas paling banyak digunakan anak sekolah. Pengelola tetap menyiapkan dukungan gigi bagi ibu, orang dewasa dan lansia melalui Lintas Klaster sesuai kebutuhan kelompok yang dilayani.","options":["Benar","Salah"],"answer":0,"explanation":"Pola pengguna terbanyak tidak membatasi fungsi penunjang pada satu klaster usia. Lintas Klaster mendukung berbagai kelompok sasaran sesuai kebutuhan dan kemampuan fasilitas.","materialSection":"k5m1-s1","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-01"},{"id":"TF-k5-pre-02","difficulty":"medium","stem":"Pada kunjungan komunitas, petugas menemukan kelainan mulut yang dicurigai sebagai lesi prakanker. Agar rujukan cepat diterima, hasil skrining dicatat sebagai diagnosis definitif tanpa menunggu penilaian tenaga yang berwenang.","options":["Benar","Salah"],"answer":1,"explanation":"Dugaan lesi memerlukan penilaian dan rujukan yang sesuai. Mempercepat komunikasi tidak membenarkan perubahan hasil skrining menjadi diagnosis definitif.","materialSection":"k5m1-s2","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-02"},{"id":"TF-k5-pre-03","difficulty":"medium","stem":"Pasien sudah mendapat penilaian awal untuk perdarahan mulut. Saat menyiapkan tindak lanjut, tim mendokumentasikan keadaan serta tindakan yang telah dilakukan dan menghubungkan keluarga dengan layanan gigi berikutnya.","options":["Benar","Salah"],"answer":0,"explanation":"Tertanganinya kebutuhan segera belum mengakhiri asuhan gigi. Keadaan terkini, tindakan dan rencana tindak lanjut perlu dikomunikasikan serta didokumentasikan.","materialSection":"k5m2-s8","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-03"},{"id":"TF-k5-pre-04","difficulty":"medium","stem":"Penerima rujukan telah menyetujui pemindahan pasien berdasarkan informasi awal. Kondisi pasien kemudian berubah, tetapi tim tetap memakai informasi awal tanpa pembaruan karena persetujuan penerima sudah diperoleh.","options":["Benar","Salah"],"answer":1,"explanation":"Serah terima harus mencerminkan keadaan terkini dan kebutuhan pemantauan. Persetujuan awal tidak menggantikan pembaruan informasi ketika keadaan pasien berubah.","materialSection":"k5m1-s4","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-04"},{"id":"TF-k5-pre-05","difficulty":"medium","stem":"Seorang staf baru telah lulus kuis tentang luka bakar dan gigitan berbisa, tetapi belum mendapat pelatihan tindakan khusus. Koordinator menugaskannya mengenali kebutuhan bantuan dan menghubungkan tenaga terlatih, bukan menetapkan terapi khusus dari ringkasan slide.","options":["Benar","Salah"],"answer":0,"explanation":"Pengetahuan tentang kondisi gawat tidak memberikan kewenangan tindakan baru. Ringkasan terapi yang belum ditelaah tidak menjadi protokol staf umum.","materialSection":"k5m1-s13","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-05"},{"id":"TF-k5-pre-06","difficulty":"medium","stem":"Saat menghitung kebutuhan farmasi, jumlah stok dinyatakan dalam unit, stok pengaman dalam persen dan waktu tunggu dalam minggu. Pengelola langsung menjumlahkan ketiga angka itu karena semuanya berasal dari formulir kebutuhan yang sama.","options":["Benar","Salah"],"answer":1,"explanation":"Komponen yang berbeda satuan harus ditelaah dan diterjemahkan menjadi jumlah kebutuhan yang sebanding. Berasal dari satu formulir tidak membuat persen, minggu dan unit dapat dijumlahkan langsung.","materialSection":"k5m1-s5","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-06"},{"id":"TF-k5-pre-07","difficulty":"medium","stem":"Dua obat bernama mirip tersimpan berdekatan, sedangkan akses obat berisiko tinggi belum tertata. Pengelola memperbaiki pemisahan, penandaan, pemeriksaan dan akses sesuai prosedur, sambil mencocokkan stok dengan catatan.","options":["Benar","Salah"],"answer":0,"explanation":"Pengendalian obat juga mencakup risiko LASA dan pengaturan akses, bukan hanya jumlah persediaan. Perbaikan dilakukan melalui penanggung jawab serta prosedur yang sesuai.","materialSection":"k5m1-s6","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-07"},{"id":"TF-k5-pre-08","difficulty":"medium","stem":"Pasien memakai obat resep dari fasilitas lain, obat bebas dan suplemen. Karena seluruh produk itu diperoleh di luar Puskesmas, tim hanya mencatat resep Puskesmas ketika mengkaji penggunaan obatnya.","options":["Benar","Salah"],"answer":1,"explanation":"Daftar resep satu fasilitas belum tentu mencakup penggunaan nyata. Obat dari fasilitas lain, obat bebas dan suplemen perlu diinformasikan untuk pengkajian yang sesuai.","materialSection":"k5m1-s7","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-08"},{"id":"TF-k5-pre-09","difficulty":"medium","stem":"Dalam visite, apoteker memperoleh riwayat herbal, hasil pemeriksaan dan informasi bahwa pasien kesulitan memperoleh obat. Informasi tersebut dihubungkan dengan temuan klinis untuk rekomendasi yang dikomunikasikan kepada tim sesuai kewenangan.","options":["Benar","Salah"],"answer":0,"explanation":"Visite menghubungkan penggunaan nyata, hasil pemeriksaan dan masalah sosial dengan evaluasi terapi. Informasi tersebut tidak terbatas pada daftar obat yang diresepkan.","materialSection":"k5m2-s11","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-09"},{"id":"TF-k5-pre-10","difficulty":"medium","stem":"Tim telah menghitung jumlah resep bulanan. Tim menganggap angka total itu sekaligus menyelesaikan PTO pasien yang bermasalah dan evaluasi kesesuaian pola penggunaan obat, tanpa penilaian individu atau kriteria pembanding.","options":["Benar","Salah"],"answer":1,"explanation":"PTO menelaah kebutuhan individual, sedangkan evaluasi penggunaan obat menilai pola terhadap kriteria yang sesuai. Menghitung jumlah resep saja tidak menyelesaikan kedua penilaian.","materialSection":"k5m1-s16","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-10"},{"id":"TF-k5-pre-11","difficulty":"medium","stem":"Fasilitas membahas model depo untuk obat PRB. Sebelum memilih, pengelola menelaah peran apotek dalam penyediaan serta peran FKTP dalam stok depo, penyiapan, penyerahan dan pelaporan mutasi sesuai kerja sama yang berlaku.","options":["Benar","Salah"],"answer":0,"explanation":"Pemilihan model memerlukan pembagian tanggung jawab dan ketertelusuran. Diagram sumber tidak otomatis menjadi kontrak atau bukti bahwa obat sudah tersedia setempat.","materialSection":"k5m2-s11","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-11"},{"id":"TF-k5-pre-12","difficulty":"medium","stem":"Dalam rapat jejaring, pengelola melihat daftar empat belas fungsi Labkesmas. Ia memasukkan seluruh fungsi semua jenjang sebagai tugas langsung laboratorium Puskesmas tanpa membedakan tingkat pelaksanaannya.","options":["Benar","Salah"],"answer":1,"explanation":"Matriks membagi fungsi secara berjenjang. Puskesmas menjalankan fungsi langsung sesuai kemampuan dan berkoordinasi melalui jejaring, bukan otomatis mengambil seluruh fungsi semua tingkat.","materialSection":"k5m1-s12","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-12"},{"id":"TF-k5-pre-13","difficulty":"medium","stem":"Hasil pemeriksaan sampel air sudah diterima Puskesmas, tetapi belum diketahui siapa yang menindaklanjuti temuan lingkungan. Tim menetapkan penerima hasil dan penanggung jawab tindakan lingkungan, lalu memeriksa apakah informasi benar-benar diterima.","options":["Benar","Salah"],"answer":0,"explanation":"Alur lingkungan perlu terhubung sampai tindak lanjut yang sesuai. Diterimanya hasil oleh fasilitas tidak membuktikan penanggung jawab intervensi sudah menerimanya.","materialSection":"k5m2-s12","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-13"},{"id":"TF-k5-pre-14","difficulty":"medium","stem":"Slide tersembunyi bertajuk RPMK mencantumkan frekuensi PME. Pengelola langsung menyebut angka itu sebagai kewajiban nasional yang telah berlaku tanpa memeriksa status sumber atau aturan yang disahkan.","options":["Benar","Salah"],"answer":1,"explanation":"Judul RPMK dan slide kerja tidak membuktikan pengundangan. Prinsip mutu dapat dipelajari, tetapi klaim kewajiban serta frekuensi nasional memerlukan verifikasi.","materialSection":"k5m1-s12","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-14"},{"id":"TF-k5-pre-15","difficulty":"medium","stem":"Pasien memerlukan observasi untuk memperjelas keputusan perawatan, sedangkan kebutuhan lain dapat melampaui kemampuan Puskesmas. Tim membedakan observasi, perawatan sesuai kapasitas dan stabilisasi sebelum rujukan dalam menentukan rencana.","options":["Benar","Salah"],"answer":0,"explanation":"Adanya tempat tidur tidak berarti seluruh kondisi harus dirawat tuntas. Indikasi, pemantauan dan kapasitas menentukan pelayanan atau rujukan.","materialSection":"k5m1-s9","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-15"},{"id":"TF-k5-pre-16","difficulty":"medium","stem":"Tim penilaian cepat sudah mengumpulkan dampak banjir dan kapasitas yang masih berfungsi. Karena memegang data awal, setiap anggotanya dianggap dapat menetapkan sendiri status hukum krisis dan menjanjikan mobilisasi resmi di luar penugasan.","options":["Benar","Salah"],"answer":1,"explanation":"Informasi penilaian cepat mendukung rekomendasi serta koordinasi. Penetapan status dan mobilisasi resmi tetap mengikuti pejabat serta mekanisme yang berwenang.","materialSection":"k5m1-s10","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-16"},{"id":"TF-k5-pre-17","difficulty":"medium","stem":"Warga takut menggunakan layanan setelah mendengar rumor di pengungsian. Tim mendengarkan kekhawatiran, menjelaskan informasi yang diketahui dan ketidakpastian yang relevan, serta menunjukkan kanal pertolongan yang dapat diakses.","options":["Benar","Salah"],"answer":0,"explanation":"Komunikasi risiko mencakup mendengarkan dan menjelaskan tindakan serta akses pertolongan. Ketidakpastian yang relevan dinyatakan, bukan ditutupi dengan kepastian yang tidak didukung.","materialSection":"k5m1-s10","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-17"},{"id":"TF-k5-pre-18","difficulty":"medium","stem":"Dalam rencana pemulihan pascabanjir, pengelola menganggap partisipasi keluarga dan masyarakat tidak lagi diperlukan karena keputusan teknis bangunan dikerjakan tenaga ahli. Seluruh penilaian fungsi layanan dan kebutuhan warga diserahkan hanya pada daftar perbaikan fisik.","options":["Benar","Salah"],"answer":1,"explanation":"Keputusan teknis bangunan memang memerlukan tenaga berwenang, tetapi pemulihan juga menelaah fungsi, akses dan dukungan keluarga dengan partisipasi masyarakat. Daftar perbaikan fisik tidak mewakili seluruh kebutuhan tersebut.","materialSection":"k5m2-s9","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-18"},{"id":"TF-k5-pre-19","difficulty":"medium","stem":"Dalam evaluasi fisioterapi, ditemukan kebutuhan konsultasi yang melampaui lingkup layanan saat ini. Fisioterapis menghubungkan konsultasi dan menyampaikan hasil evaluasi kepada dokter perujuk untuk kelanjutan rencana, sambil mempertimbangkan tujuan fungsi pasien.","options":["Benar","Salah"],"answer":0,"explanation":"Alur fisioterapi mencakup evaluasi ulang dan komunikasi, termasuk konsultasi bila ada kontraindikasi atau kebutuhan spesialistik. Berjalannya beberapa sesi tidak menutup kebutuhan koordinasi lebih lanjut.","materialSection":"k5m2-s6","refs":["ICOPE2025","LKPPT2025"],"sourceUnit":"K5-PPT-19"},{"id":"TF-k5-pre-20","difficulty":"medium","stem":"Pasien telah menyetujui tindakan modalitas fisik, tetapi kemudian menyampaikan ketidaknyamanan di area terapi. Tim menganggap kenyamanan tidak perlu dipantau atau ditanggapi lagi karena persetujuan sudah ditandatangani sebelum sesi dimulai.","options":["Benar","Salah"],"answer":1,"explanation":"Persetujuan awal tidak menghapus pemantauan keselamatan dan kenyamanan selama tindakan. Keluhan perlu ditanggapi melalui tenaga kompeten dan prosedur yang sesuai.","materialSection":"k5m2-s15","refs":["LKPPT2025"],"sourceUnit":"K5-PPT-20"},{"id":"TF-k5-pre-21","difficulty":"medium","stem":"Pasien paliatif mengubah harapannya setelah keluhan dan kemampuan caregiver berubah. Tim meninjau kembali tujuan, kenyamanan, dukungan psikososial-spiritual serta koordinasi klinis bersama pasien.","options":["Benar","Salah"],"answer":0,"explanation":"Tujuan paliatif perlu ditinjau ketika kondisi atau preferensi berubah. Dukungan spiritual mengikuti pilihan pasien dan berjalan bersama evaluasi gejala.","materialSection":"k5m2-s7","refs":["K3","KMK6312026"],"sourceUnit":"BOOK-ENRICHMENT"},{"id":"TF-k5-pre-22","difficulty":"hard","stem":"Hasil pemeriksaan memerlukan tindak lanjut, tetapi identitas pada dokumen rujukan spesimen tidak cocok dan pasien sulit kembali. Untuk mengurangi perjalanan, tim memakai hasil itu bagi pasien yang paling mungkin dimaksud tanpa mengklarifikasi identitas atau koordinasi penerima.","options":["Benar","Salah"],"answer":1,"explanation":"Hambatan perjalanan perlu dibantu tanpa mengorbankan kesesuaian identitas dan validasi hasil. Ketidakcocokan diklarifikasi melalui laboratorium serta penerima agar tindak lanjut tetap aman dan dapat ditelusuri.","materialSection":"k5m2-s12","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-13"},{"id":"TF-k5-pre-23","difficulty":"hard","stem":"Pasien dinilai stabil oleh layanan lanjut, tetapi obat PRB berada di titik pelayanan lain dan caregiver belum memahami penggunaan di rumah. Tim mengklarifikasi akses melalui kerja sama yang berlaku, menelaah kemampuan caregiver dan menetapkan tindak lanjut yang terhubung dengan rencana klinis.","options":["Benar","Salah"],"answer":0,"explanation":"Status stabil, akses obat dan kemampuan perawatan rumah merupakan unsur berbeda. Rujuk balik perlu menghubungkan ketiganya, bukan mengandalkan surat atau diagram kerja sama saja.","materialSection":"k5m2-s11","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-11"},{"id":"TF-k5-pre-24","difficulty":"hard","stem":"Puskesmas sedang mengevaluasi pola penggunaan obat, sementara seorang pasien melaporkan keluhan baru dan tidak mampu membeli salah satu obat. Tim menunda pencatatan serta komunikasi masalah individu sampai rekap evaluasi bulanan selesai agar semua masalah digabung dalam satu laporan.","options":["Benar","Salah"],"answer":1,"explanation":"Evaluasi pola bulanan tidak menggantikan penanganan masalah individu menurut risiko. Dugaan efek samping dan hambatan akses perlu dicatat terpisah serta dikomunikasikan tanpa menunggu rekap selesai.","materialSection":"k5m2-s11","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-10"},{"id":"TF-k5-pre-25","difficulty":"hard","stem":"Daftar obat setelah rawat inap berbeda dari obat yang sebenarnya diminum di rumah; caregiver bergantian dan hanya satu yang menerima penjelasan. Tim mengklarifikasi perbedaan melalui tenaga berwenang lalu memeriksa pemahaman pengasuh yang diizinkan dan pembagian dukungan penggunaan.","options":["Benar","Salah"],"answer":0,"explanation":"Rekonsiliasi memerlukan daftar penggunaan nyata serta klarifikasi perubahan. Penjelasan perlu dapat diterapkan oleh pengasuh yang menjalankan dukungan tanpa memindahkan keputusan terapi kepada mereka.","materialSection":"k5m2-s2","refs":["LK2024","LKPPT2025","ICOPE2025"],"sourceUnit":"K5-PPT-08"},{"id":"TF-k5-pre-26","difficulty":"hard","stem":"Relawan menawarkan transportasi saat krisis dengan meminta seluruh catatan keluarga dan diagnosis pasien dipublikasikan. Pasien hanya menyetujui penyampaian kebutuhan praktis. Tim menerima syarat publikasi karena manfaat transportasi dianggap menghapus batas pembagian informasi.","options":["Benar","Salah"],"answer":1,"explanation":"Tujuan bantuan tidak menghapus perlindungan data serta pilihan pasien. Informasi dibatasi pada kebutuhan pelayanan atau bantuan yang relevan melalui jalur aman; syarat relawan perlu ditinjau kembali.","materialSection":"k5m2-s10","refs":["AIWHO2021","LK2024"],"sourceUnit":"BOOK-ENRICHMENT"},{"id":"TF-k5-pre-27","difficulty":"hard","stem":"Lansia sulit mengunyah, memerlukan tindak lanjut gigi dan bergantung pada caregiver yang bekerja siang hari. Tim membahas hambatan kunjungan, bantuan kebersihan mulut yang aman serta pemahaman caregiver, lalu menelusuri apakah dukungan dan rujukan benar-benar terlaksana.","options":["Benar","Salah"],"answer":0,"explanation":"Asuhan gigi terhubung dengan fungsi, dukungan rumah dan akses. Surat atau instruksi saja belum membuktikan tindak lanjut dapat dijalankan oleh pasien serta caregiver.","materialSection":"k5m2-s8","refs":["LK2024","LKPPT2025","ICOPE2025"],"sourceUnit":"K5-PPT-02"},{"id":"TF-k5-pre-28","difficulty":"veryhard","stem":"Di pengungsian, pasien memerlukan rujukan segera, persediaan obatnya belum diterima dan rumor membuat keluarga takut fasilitas tujuan. Tim memilih menunggu bantuan obat lengkap serta pertemuan edukasi bersama lebih dahulu sebelum mengaktifkan koordinasi rujukan, agar semua kebutuhan selesai dalam satu perjalanan.","options":["Benar","Salah"],"answer":1,"explanation":"Kebutuhan rujukan segera tidak menunggu semua dukungan logistik atau edukasi kelompok lengkap. Tim mengaktifkan penilaian dan rujukan sesuai kewenangan sambil mengoordinasikan kesinambungan obat serta komunikasi risiko yang menanggapi kekhawatiran keluarga.","materialSection":"k5m2-s9","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-17","supportSections":["k5m1-s3","k5m2-s1","k5m2-s9"]},{"id":"TF-k5-pre-29","difficulty":"veryhard","stem":"Lansia dengan keterbatasan fungsi memerlukan tindak lanjut gigi, bantuan penggunaan obat dan pendamping yang jam kerjanya berubah. Tim menyepakati satu rencana bersama pasien yang menghubungkan peran tiap layanan, kemampuan pendamping, akses dan umpan balik, lalu memeriksa kebutuhan yang belum terpenuhi.","options":["Benar","Salah"],"answer":0,"explanation":"Kebutuhan klinis, fungsi dan dukungan harus dihubungkan dengan pelaksana serta bukti tindak lanjut. Menyelesaikan satu unit tidak cukup menutup seluruh rencana pasien.","materialSection":"k5m2-s1","refs":["LK2024","LKPPT2025","ICOPE2025"],"sourceUnit":"K5-PPT-01","supportSections":["k5m2-s1","k5m2-s2","k5m2-s5","k5m2-s8"]},{"id":"TF-k5-pre-30","difficulty":"veryhard","stem":"Pasien tampak stabil setelah rawat inap, tetapi daftar obat rumah belum jelas, caregiver belum mampu menjelaskan tugas perawatan dan rumah sulit dijangkau. Demi mengurangi beban perjalanan, tim menyetujui pulang dengan menunda klarifikasi obat, pemeriksaan kemampuan caregiver dan pengaturan akses sampai satu kontrol rutin berikutnya.","options":["Benar","Salah"],"answer":1,"explanation":"Stabilitas klinis dan penghematan perjalanan belum membuktikan kesiapan pulang. Sebelum menyepakati rencana, tim perlu mengklarifikasi obat melalui tenaga berwenang, memeriksa kemampuan serta bantuan caregiver dan mengatur akses atau alternatif tindak lanjut yang dapat dijalankan.","materialSection":"k5m2-s4","refs":["LK2024","LKPPT2025","ICOPE2025","CHARTRAND2023"],"sourceUnit":"K5-PPT-15","supportSections":["k5m2-s2","k5m2-s4","k5m2-s5"]}],"mid":[{"id":"TF-k5-mid-01","difficulty":"medium","stem":"Seorang ibu dari Klaster 2 diminta ke farmasi dan laboratorium. Tim menetapkan penerima hasil kembali dan penanggung jawab tindak lanjut pada klaster terkait, sehingga berpindah unit tidak memutus asuhannya.","options":["Benar","Salah"],"answer":0,"explanation":"Lintas Klaster mendukung kelompok sasaran dari klaster lain. Hubungan permintaan, hasil dan tindak lanjut tetap perlu memiliki penanggung jawab.","materialSection":"k5m1-s1","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-01"},{"id":"TF-k5-mid-02","difficulty":"medium","stem":"Skrining sekolah menemukan anak tanpa karies. Tim membatalkan jalur pencegahan yang direncanakan tenaga gigi karena hasil negatif dianggap setara dengan selesainya seluruh kebutuhan kesehatan mulut.","options":["Benar","Salah"],"answer":1,"explanation":"Skrining negatif tidak meniadakan pencegahan. Temuan negatif dan temuan yang memerlukan perawatan memakai tindak lanjut berbeda sesuai penilaian tenaga gigi.","materialSection":"k5m1-s2","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-02"},{"id":"TF-k5-mid-03","difficulty":"medium","stem":"Seorang pasien mengalami pembengkakan mulut disertai penurunan keadaan umum. Petugas menghubungkan penilaian keselamatan dan bantuan tenaga yang sesuai tanpa menunggu antrean pemeriksaan rutin.","options":["Benar","Salah"],"answer":0,"explanation":"Gangguan keadaan umum menyertai keluhan gigi dapat memerlukan respons segera. Antrean rutin tidak menentukan prioritas keselamatan.","materialSection":"k5m1-s11","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-03"},{"id":"TF-k5-mid-04","difficulty":"medium","stem":"Pasien gawat telah siap dirujuk, sedangkan riwayat alergi belum dapat dipastikan. Petugas mengisi tidak ada alergi agar formulir lengkap karena kolom ketidakpastian dinilai dapat membingungkan penerima.","options":["Benar","Salah"],"answer":1,"explanation":"Penerima perlu mengetahui informasi mana yang belum terkonfirmasi. Mengubah ketidakpastian menjadi tidak ada alergi menghasilkan informasi yang tidak dapat dipertanggungjawabkan.","materialSection":"k5m1-s4","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-04"},{"id":"TF-k5-mid-05","difficulty":"medium","stem":"Setelah pertolongan awal, pasien tenggelam tampak membaik. Petugas mempertahankan penilaian ulang dan pemantauan berwenang serta menghindari penggunaan satu durasi observasi dari slide yang tidak jelas konteksnya sebagai aturan universal.","options":["Benar","Salah"],"answer":0,"explanation":"Penilaian klinis dan keadaan pasien menentukan tindak lanjut. Angka sumber yang tidak cukup konteks tidak langsung dijadikan protokol pulang semua pasien.","materialSection":"k5m1-s13","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-05"},{"id":"TF-k5-mid-06","difficulty":"medium","stem":"Catatan gudang dan stok fisik PKMK berbeda ketika unit meminta penambahan. Pengelola memilih memakai angka laporan yang lebih baru tanpa menelusuri penerimaan atau mutasi karena data terbaru dianggap pasti lebih akurat.","options":["Benar","Salah"],"answer":1,"explanation":"Kemutakhiran tanggal laporan tidak membuktikan ketepatan angka. Ketidaksesuaian perlu ditelusuri terhadap stok fisik, penerimaan dan mutasi sebelum rencana diputuskan.","materialSection":"k5m1-s5","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-06"},{"id":"TF-k5-mid-07","difficulty":"medium","stem":"Petugas menemukan vaksin belum kedaluwarsa tetapi indikator atau penyimpanannya meragukan. Ia menahan pemakaian untuk penilaian penanggung jawab serta menjaga catatan kondisi, tanpa menetapkan sendiri kelayakan akhir produk.","options":["Benar","Salah"],"answer":0,"explanation":"Kelayakan tidak dinilai hanya dari tanggal kedaluwarsa. Eskalasi dan ketertelusuran kondisi mendukung penilaian oleh pihak yang berwenang.","materialSection":"k5m1-s6","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-07"},{"id":"TF-k5-mid-08","difficulty":"medium","stem":"Identitas dan etiket resep benar, tetapi dua nama dagang diduga mengandung zat aktif sama. Petugas menutup pengkajian setelah memeriksa identitas karena kesamaan zat aktif baru perlu ditelaah bila pasien mengalami keluhan.","options":["Benar","Salah"],"answer":1,"explanation":"Dugaan duplikasi merupakan aspek klinis pengkajian sebelum penyerahan. Penilaian tidak menunggu pasien mengalami keluhan.","materialSection":"k5m1-s7","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-08"},{"id":"TF-k5-mid-09","difficulty":"medium","stem":"Seorang pasien dengan banyak obat mengangguk saat dijelaskan, lalu salah menerangkan cara penggunaan. Petugas mengklarifikasi instruksi dan meminta penjelasan balik kembali, bukan mencatat paham hanya dari anggukan awal.","options":["Benar","Salah"],"answer":0,"explanation":"Penjelasan balik memperlihatkan bagian yang belum dipahami. Dokumentasi pemahaman perlu sesuai informasi yang benar-benar diperiksa.","materialSection":"k5m1-s7","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-09"},{"id":"TF-k5-mid-10","difficulty":"medium","stem":"Pada telaah obat, petugas mencatat pasien tidak mampu membeli satu obat. Ia memasukkan hambatan biaya itu sebagai efek samping yang sudah terbukti tanpa memisahkan keluhan klinis dan hambatan akses.","options":["Benar","Salah"],"answer":1,"explanation":"Hambatan akses berbeda dari dugaan efek samping. Data dipilah agar kebutuhan penanganan dan koordinasi sesuai masalah.","materialSection":"k5m1-s16","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-10"},{"id":"TF-k5-mid-11","difficulty":"medium","stem":"Pasien membawa surat rujuk balik tetapi keluarga belum tahu obat yang dipakai di rumah. Tim memeriksa penggunaan nyata, kemampuan pendamping, penyimpanan dan akses, sambil menyerahkan penetapan stabil serta kelayakan program kepada tenaga berwenang.","options":["Benar","Salah"],"answer":0,"explanation":"Surat tidak menggantikan penilaian kebutuhan dukungan rumah. Pengkajian penggunaan dan dukungan tidak memindahkan kewenangan penetapan klinis kepada semua staf.","materialSection":"k5m1-s9","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-11"},{"id":"TF-k5-mid-12","difficulty":"medium","stem":"Puskesmas memiliki alat pemeriksaan baru namun tenaga dan validasi belum siap. Pengelola menganggap daftar alat cukup untuk membuktikan kapasitas semua pemeriksaan, sehingga telaah kesiapan proses dapat dilakukan setelah layanan berjalan.","options":["Benar","Salah"],"answer":1,"explanation":"Layanan memerlukan kesiapan tenaga, proses validasi dan keselamatan selain alat. Kesenjangan perlu ditelaah sebelum layanan dibuka sesuai kemampuan.","materialSection":"k5m1-s12","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-12"},{"id":"TF-k5-mid-13","difficulty":"medium","stem":"Petugas menerima sampel air dan spesimen pasien. Ia memastikan asal sampel atau identitas pasien, permintaan yang sesuai dan pihak penerima hasil masing-masing agar tindak lanjut klinis dan lingkungan dapat dibedakan.","options":["Benar","Salah"],"answer":0,"explanation":"Alur klinis dan lingkungan memiliki informasi serta penanggung jawab berbeda. Ketertelusuran tidak berhenti pada penerimaan bahan.","materialSection":"k5m1-s8","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-13"},{"id":"TF-k5-mid-14","difficulty":"medium","stem":"Laboratorium memakai bahan kontrol untuk mengendalikan proses sehari-hari. Petugas mencatat kegiatan itu sebagai PME karena kontrol telah dilakukan rutin dan dicatat dengan baik.","options":["Benar","Salah"],"answer":1,"explanation":"PMI sehari-hari berbeda dari PME melalui mekanisme penilaian eksternal. Keteraturan pencatatan tidak mengubah jenis kegiatannya.","materialSection":"k5m1-s12","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-14"},{"id":"TF-k5-mid-15","difficulty":"medium","stem":"Pasien dinilai stabil, tetapi caregiver belum memahami tugas perawatan dan rumah sulit dijangkau. Tim meninjau dukungan nyata, obat, akses kontrol serta kontak bantuan sebelum menyimpulkan kesiapan pulang.","options":["Benar","Salah"],"answer":0,"explanation":"Kesiapan pulang meliputi kemampuan menjalankan rencana dan dukungan rumah selain kondisi klinis. Kebutuhan yang belum terpenuhi tetap perlu diatur.","materialSection":"k5m1-s9","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-15"},{"id":"TF-k5-mid-16","difficulty":"medium","stem":"Banjir memutus satu jalur pelayanan dan tim sudah mengetahui lokasi keluarga rentan. Penilaian cepat ditunda sampai laporan seluruh wilayah lengkap agar tidak perlu memperbarui keputusan awal.","options":["Benar","Salah"],"answer":1,"explanation":"Penilaian cepat menelaah kebutuhan segera dan kapasitas dari informasi awal yang tersedia. Keputusan dapat diperbarui; menunggu seluruh data lengkap dapat menunda bantuan yang sudah jelas diperlukan.","materialSection":"k5m1-s10","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-16"},{"id":"TF-k5-mid-17","difficulty":"medium","stem":"Bantuan tercatat terkirim, namun obat belum diterima seorang lansia bergantung. Tim menelusuri penerimaan nyata serta sisa kebutuhan dan mendengarkan hambatan warga saat memperbarui distribusi serta komunikasi risiko.","options":["Benar","Salah"],"answer":0,"explanation":"Pengiriman, penerimaan dan kebutuhan tersisa merupakan informasi berbeda. Komunikasi risiko juga perlu memahami kekhawatiran dan akses warga.","materialSection":"k5m1-s10","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-17"},{"id":"TF-k5-mid-18","difficulty":"medium","stem":"Bangunan Puskesmas telah dibuka setelah banjir, tetapi alat bantu dan transportasi beberapa pasien belum pulih. Tim menyamakan pembukaan bangunan dengan pulihnya seluruh fungsi layanan dan akses keluarga.","options":["Benar","Salah"],"answer":1,"explanation":"Pemulihan bangunan tidak otomatis memulihkan fungsi atau akses pasien. Kebutuhan alat, transportasi dan pengasuhan tetap ditindaklanjuti.","materialSection":"k5m1-s10","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-18"},{"id":"TF-k5-mid-19","difficulty":"medium","stem":"Pasien dengan keluhan muskuloskeletal meminta alat tertentu. Petugas menghubungkannya dengan asesmen kompeten dan tujuan fungsi; pencantuman suatu kondisi pada bahan fisioterapi tidak dianggap berarti semua pasien memakai modalitas yang sama.","options":["Benar","Salah"],"answer":0,"explanation":"Pemilihan intervensi memerlukan asesmen, indikasi dan kontraindikasi. Daftar kondisi adalah contoh kebutuhan penilaian, bukan penetapan modalitas seragam.","materialSection":"k5m1-s14","refs":["ICOPE2025","LKPPT2025"],"sourceUnit":"K5-PPT-19"},{"id":"TF-k5-mid-20","difficulty":"medium","stem":"Staf menemukan label infrared TENS pada presentasi. Ia menganggap perbedaan nama tidak perlu diklarifikasi karena pengenalan kedua istilah itu sudah cukup menjadi kewenangan memilih alat dan menentukan waktu terapi.","options":["Benar","Salah"],"answer":1,"explanation":"Label tersebut tidak konsisten. Pengenalan nama tidak menggantikan klarifikasi, asesmen profesional, kompetensi atau prosedur alat.","materialSection":"k5m1-s15","refs":["LKPPT2025"],"sourceUnit":"K5-PPT-20"},{"id":"TF-k5-mid-21","difficulty":"medium","stem":"Koordinator membaca matriks Labkesmas berjenjang. Ia membedakan fungsi langsung Puskesmas dari fungsi tingkat lain dan menggunakan jejaring bila kebutuhan pemeriksaan melampaui kemampuan unitnya.","options":["Benar","Salah"],"answer":0,"explanation":"Matriks menempatkan fungsi secara berjenjang. Seluruh empat belas fungsi jejaring tidak otomatis menjadi tugas langsung Puskesmas.","materialSection":"k5m1-s12","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-12"},{"id":"TF-k5-mid-22","difficulty":"hard","stem":"Pasien sesak memburuk, alergi belum jelas dan informasi asupan terakhir belum diketahui. Tim menunggu SAMPLE lengkap sebelum meminta bantuan serta menghubungi tujuan rujukan agar penerima tidak memperoleh informasi bertahap.","options":["Benar","Salah"],"answer":1,"explanation":"SAMPLE melengkapi survei sekunder sesuai prioritas setelah ancaman segera ditangani. Bantuan, komunikasi awal dan pemantauan tidak ditunda demi satu laporan yang lengkap sekaligus.","materialSection":"k5m1-s4","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-04"},{"id":"TF-k5-mid-23","difficulty":"hard","stem":"Penggunaan PKMK meningkat, stok fisik tidak sesuai catatan dan waktu tunggu dicatat dalam minggu. Pengelola menelusuri penerimaan serta mutasi dan mengubah komponen waktu serta persentase menjadi jumlah kebutuhan yang sebanding sebelum memakai perhitungan untuk usulan baru.","options":["Benar","Salah"],"answer":0,"explanation":"Ketertelusuran stok dan kesesuaian satuan diperlukan. Persen atau minggu tidak dijumlahkan langsung dengan unit barang, dan rumus ambigu tidak diterima begitu saja.","materialSection":"k5m1-s5","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-06"},{"id":"TF-k5-mid-24","difficulty":"hard","stem":"Label spesimen cocok dengan permintaan dan pasien menunggu hasil, tetapi bahan kontrol tidak memenuhi kriteria. Petugas menganggap kecocokan identitas cukup untuk menerbitkan hasil dahulu sambil menjadwalkan koreksi proses analitik setelah layanan sepi.","options":["Benar","Salah"],"answer":1,"explanation":"Ketepatan tahap pra analitik tidak meniadakan masalah analitik. Temuan kontrol memerlukan eskalasi dan pengendalian hasil sebelum proses diteruskan secara aman.","materialSection":"k5m1-s12","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-14"},{"id":"TF-k5-mid-25","difficulty":"hard","stem":"Pasien menyampaikan keluhan baru setelah obat diubah, memakai herbal dan tidak mampu membeli obat lain. Petugas memisahkan dugaan efek samping dari hambatan akses, mencatat waktu serta penggunaan nyata dan menghubungkan evaluasi tenaga berwenang tanpa menetapkan sebab atau mengganti terapi sendiri.","options":["Benar","Salah"],"answer":0,"explanation":"Evaluasi memerlukan informasi klinis dan konteks penggunaan. Memisahkan masalah mencegah hambatan akses disamakan dengan sebab obat yang sudah terbukti.","materialSection":"k5m1-s16","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-10"},{"id":"TF-k5-mid-26","difficulty":"hard","stem":"Setelah banjir, bantuan telah masuk gudang, rumor mengurangi kunjungan dan satu keluarga kehilangan alat bantu. Tim menghitung kebutuhan obat sudah terpenuhi dari jumlah kiriman dan membatasi respons pada pengumuman umum tanpa memeriksa penerimaan pasien.","options":["Benar","Salah"],"answer":1,"explanation":"Catatan kiriman belum membuktikan akses atau kebutuhan terpenuhi. Respons perlu menelusuri penerimaan nyata, kebutuhan keluarga dan hambatan komunikasi.","materialSection":"k5m1-s10","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-17"},{"id":"TF-k5-mid-27","difficulty":"hard","stem":"Pasien pascafraktur memiliki keterbatasan fungsi, dukungan rumah terbatas dan meminta alat yang pernah dipakai tetangga. Tim mendahulukan asesmen, indikasi-kontraindikasi, tujuan fungsi serta rencana evaluasi dan komunikasi kepada perujuk sebelum menentukan asuhan.","options":["Benar","Salah"],"answer":0,"explanation":"Rencana rehabilitasi tidak ditentukan dari diagnosis atau alat pilihan pasien saja. Asesmen fungsi dan konteks rumah dihubungkan dengan keputusan tenaga kompeten serta evaluasi.","materialSection":"k5m1-s14","refs":["ICOPE2025","LKPPT2025"],"sourceUnit":"K5-PPT-19"},{"id":"TF-k5-mid-28","difficulty":"veryhard","stem":"Lansia dengan obat dari dua fasilitas memerlukan hasil laboratorium dan bantuan caregiver yang sulit membaca. Karena tiap unit sudah menyelesaikan pencatatan, tim menutup kunjungan tanpa menetapkan penerima hasil atau memastikan rencana obat dan pemahaman terhubung.","options":["Benar","Salah"],"answer":1,"explanation":"Selesainya catatan unit belum membuktikan kebutuhan pasien terpenuhi. Hasil, obat, dukungan dan pemahaman memerlukan hubungan tindak lanjut yang jelas.","materialSection":"k5m1-s1","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-01"},{"id":"TF-k5-mid-29","difficulty":"veryhard","stem":"Banjir memutus jalur rujukan, menghambat obat pasien kronis dan memisahkan lansia bergantung dari pendamping. Tim menilai kapasitas yang masih berfungsi, mengaktifkan koordinasi berwenang dan menetapkan prioritas akses, obat serta pengasuhan sambil memperbarui data yang belum lengkap.","options":["Benar","Salah"],"answer":0,"explanation":"Penilaian cepat menghubungkan dampak, kapasitas dan kebutuhan segera. Kesinambungan layanan serta keluarga rentan dimasukkan dalam koordinasi tanpa menunggu seluruh data sempurna.","materialSection":"k5m1-s10","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-16"},{"id":"TF-k5-mid-30","difficulty":"veryhard","stem":"Pasien pascaperawatan mempunyai gangguan sensasi, keterbatasan fungsi dan caregiver yang hanya hadir sore hari. Tim telah menilai tujuan serta dukungan rumah, lalu menganggap durasi ultrasound pada slide cukup untuk menetapkan dosis seragam tanpa telaah kondisi area, kontraindikasi dan prosedur alat.","options":["Benar","Salah"],"answer":1,"explanation":"Tujuan fungsi dan dukungan rumah belum melengkapi penilaian keselamatan modalitas. Kondisi area, kontraindikasi, kompetensi dan prosedur alat tetap diperlukan; durasi pada versi kerja tidak menjadi dosis seragam bagi seluruh pasien.","materialSection":"k5m1-s15","refs":["LKPPT2025"],"sourceUnit":"K5-PPT-20"}],"post":[{"id":"TF-k5-post-01","difficulty":"medium","stem":"Hasil laboratorium pasien Klaster 3 sudah tersedia, tetapi setiap unit mengira unit lain akan menghubungi keluarga. Koordinator menetapkan penerima hasil, penanggung jawab keputusan dan cara memeriksa bahwa tindak lanjut benar-benar diterima pasien.","options":["Benar","Salah"],"answer":0,"explanation":"Koordinasi menutup hubungan hasil dan tindak lanjut. Menetapkan penanggung jawab serta memeriksa penerimaan mencegah kebutuhan pasien hilang antarunit.","materialSection":"k5m2-s1","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-01"},{"id":"TF-k5-post-02","difficulty":"medium","stem":"Seorang lansia bergantung tidak hadir pada rujukan gigi dan membutuhkan bantuan kebersihan mulut. Tim menutup rujukan karena surat sudah diberikan, tanpa menilai transportasi, pendamping dan pemahaman tugas di rumah.","options":["Benar","Salah"],"answer":1,"explanation":"Surat tidak membuktikan rujukan terlaksana. Hambatan akses, bantuan dan pemahaman tugas rumah perlu dinilai lalu dihubungkan dengan dukungan yang tersedia.","materialSection":"k5m2-s8","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-02"},{"id":"TF-k5-post-03","difficulty":"medium","stem":"Pasien dengan pembengkakan mulut dan keadaan umum memburuk sudah mendapat penilaian segera. Tim tetap mengatur tindak lanjut gigi serta informasi bagi keluarga setelah ancaman awal tertangani.","options":["Benar","Salah"],"answer":0,"explanation":"Respons gawat tidak menghapus kebutuhan tindak lanjut gigi. Edukasi keluarga mendukung perawatan tanpa menggantikan tindakan profesional.","materialSection":"k5m2-s8","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-03"},{"id":"TF-k5-post-04","difficulty":"medium","stem":"Pada rujukan pasien sesak, surat dan hasil pemeriksaan sudah diunggah. Tim menganggap komunikasi rujukan selesai walaupun penerima belum dikonfirmasi dan kebutuhan pemantauan selama perjalanan belum disepakati.","options":["Benar","Salah"],"answer":1,"explanation":"Unggahan dokumen tidak menggantikan komunikasi sesuai kebutuhan. Penerima, pemantauan, transportasi dan pendamping merupakan bagian rujukan aman yang perlu dihubungkan.","materialSection":"k5m2-s1","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-04"},{"id":"TF-k5-post-05","difficulty":"medium","stem":"Pasien setelah tenggelam tampak membaik, tetapi informasi observasi dalam bahan kerja tidak cukup jelas. Tim meminta penilaian klinis dan pemantauan sesuai keadaan, tanpa menjadikan satu angka slide sebagai aturan pulang universal.","options":["Benar","Salah"],"answer":0,"explanation":"Penilaian serta pemantauan berwenang menentukan tindak lanjut. Parameter yang belum jelas konteksnya tidak otomatis menjadi protokol pemulangan.","materialSection":"k5m2-s4","refs":["LK2024","LKPPT2025","CHARTRAND2023"],"sourceUnit":"K5-PPT-05"},{"id":"TF-k5-post-06","difficulty":"medium","stem":"Gudang mempunyai selisih stok dan beberapa unit menumpuk PKMK. Pengelola mengubah angka laporan agar sesuai total yang diinginkan, lalu menganggap evaluasi distribusi selesai karena laporan sudah seimbang.","options":["Benar","Salah"],"answer":1,"explanation":"Evaluasi menelusuri penyebab ketidaksesuaian dan memperbaiki proses. Menyamakan angka tanpa bukti penerimaan, pengeluaran dan mutasi menghilangkan ketertelusuran.","materialSection":"k5m2-s13","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-06"},{"id":"TF-k5-post-07","difficulty":"medium","stem":"Pasien pulang membawa obat, sementara vaksin di unit lain mempunyai kondisi penyimpanan meragukan. Tim menahan pemakaian produk yang perlu klarifikasi dan menghubungi penanggung jawab, tanpa menyimpulkan kelayakan dari tanggal kedaluwarsa saja.","options":["Benar","Salah"],"answer":0,"explanation":"Persyaratan produk, penyimpanan, indikator dan status vial dinilai sesuai prosedur. Kelayakan akhir serta pemusnahan berada pada tenaga dan mekanisme berwenang.","materialSection":"k5m2-s2","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-07"},{"id":"TF-k5-post-08","difficulty":"medium","stem":"Dua daftar obat setelah rawat inap memuat nama dagang berbeda yang diduga mengandung zat aktif sama. Karena keluarga ingin segera pulang, staf menyepakati kedua daftar tetap dipakai tanpa klarifikasi apoteker atau pemberi resep.","options":["Benar","Salah"],"answer":1,"explanation":"Rekonsiliasi memerlukan klarifikasi dugaan duplikasi dan perubahan regimen sebelum daftar rumah disepakati. Keinginan segera pulang tidak menggantikan pengkajian berwenang.","materialSection":"k5m2-s2","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-08"},{"id":"TF-k5-post-09","difficulty":"medium","stem":"Pasien dengan regimen berubah mengangguk, tetapi caregiver menyebut obat yang dihentikan masih diminum. Tim menggali penggunaan nyata, mengklarifikasi perubahan melalui tenaga berwenang dan meminta penjelasan balik.","options":["Benar","Salah"],"answer":0,"explanation":"Anggukan dan tanda tangan tidak membuktikan pemahaman. Penggunaan nyata serta perubahan daftar perlu diperiksa dan dijelaskan kembali.","materialSection":"k5m2-s11","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-09"},{"id":"TF-k5-post-10","difficulty":"medium","stem":"Sistem pelaporan dugaan efek samping tidak dapat diakses ketika pasien melaporkan keluhan baru. Tim menunda dokumentasi dan komunikasi sampai sistem pulih karena formulir manual dianggap tidak dapat mendukung tindak lanjut.","options":["Benar","Salah"],"answer":1,"explanation":"Informasi awal dan komunikasi menurut risiko tetap diperlukan. Dokumentasi manual dapat menjaga ketertelusuran ketika akses elektronik terhambat; kanal pelaporan dikonfirmasi pada pelaksanaan.","materialSection":"k5m2-s11","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-10"},{"id":"TF-k5-post-11","difficulty":"medium","stem":"Pasien membawa surat rujuk balik, obat belum tersedia dan keluarga tidak memahami jadwal pemantauan. Tim memastikan penerimaan rencana klinis, mengklarifikasi akses obat sesuai kerja sama yang berlaku dan menyepakati tindak lanjut bersama pasien serta pendamping.","options":["Benar","Salah"],"answer":0,"explanation":"Rujuk balik klinis, akses obat dan kemampuan rumah perlu dihubungkan. Surat atau diagram kerja sama belum membuktikan obat tersedia dan rencana dipahami.","materialSection":"k5m2-s11","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-11"},{"id":"TF-k5-post-12","difficulty":"medium","stem":"Laboratorium menerima alat baru tetapi validasi dan tenaga belum siap. Koordinator menjanjikan semua pemeriksaan dapat diselesaikan di Puskesmas karena jejaring tingkat 1 dianggap wajib melakukan seluruh empat belas fungsi semua jenjang.","options":["Benar","Salah"],"answer":1,"explanation":"Fungsi Labkesmas dibagi berjenjang. Kapasitas pemeriksaan ditentukan kesiapan tenaga, proses dan sarana; jejaring digunakan bila kebutuhan melampaui kemampuan.","materialSection":"k5m2-s3","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-12"},{"id":"TF-k5-post-13","difficulty":"medium","stem":"Hasil sampel air telah dikirim ke Puskesmas tetapi petugas intervensi lingkungan belum menerimanya. Tim menetapkan penerima hasil dan tindak lanjut lingkungan, terpisah dari alur spesimen klinis pasien lain yang memerlukan rujukan.","options":["Benar","Salah"],"answer":0,"explanation":"Pengiriman hasil belum menutup alur. Pihak penerima, validasi dan tindakan klinis atau lingkungan yang relevan perlu dihubungkan.","materialSection":"k5m2-s12","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-13"},{"id":"TF-k5-post-14","difficulty":"medium","stem":"Hasil kontrol internal tidak memenuhi kriteria dan laporan pasien hampir dikirim. Tim menganggap masalah cukup ditutup dengan mencatat rencana koreksi, tanpa mengendalikan penerbitan hasil atau memeriksa hasil perbaikannya.","options":["Benar","Salah"],"answer":1,"explanation":"Temuan mutu memerlukan eskalasi, pengendalian hasil, koreksi dan verifikasi. Catatan rencana saja belum membuktikan proses aman kembali.","materialSection":"k5m2-s13","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-14"},{"id":"TF-k5-post-15","difficulty":"medium","stem":"Pasien stabil secara klinis, tetapi caregiver belum mampu mendemonstrasikan tugas perawatan dan akses kontrol sulit. Tim meninjau kesiapan pulang, bantuan nyata dan kontak serta pilihan tindak lanjut bersama pasien dan keluarga.","options":["Benar","Salah"],"answer":0,"explanation":"Kesiapan pulang mencakup kemampuan menjalankan rencana, dukungan dan akses. Demonstrasi balik sesuai tugas membantu mengidentifikasi kebutuhan bantuan.","materialSection":"k5m2-s4","refs":["LK2024","LKPPT2025","CHARTRAND2023"],"sourceUnit":"K5-PPT-15"},{"id":"TF-k5-post-16","difficulty":"medium","stem":"Banjir memutus akses Puskesmas dan lokasi keluarga rentan sudah diketahui. Tim menunggu seluruh laporan lengkap sebelum mengaktifkan koordinasi serta penilaian kebutuhan segera agar tidak perlu mengubah rencana awal.","options":["Benar","Salah"],"answer":1,"explanation":"Penilaian cepat dan koordinasi berwenang menggunakan informasi awal yang tersedia lalu diperbarui. Kebutuhan mendesak yang diketahui tidak menunggu kelengkapan seluruh laporan.","materialSection":"k5m2-s9","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-16"},{"id":"TF-k5-post-17","difficulty":"medium","stem":"Paket bantuan telah dikirim tetapi pasien bergantung belum memperoleh obat dan rumor menghambat kunjungan. Tim menelusuri penerimaan nyata, mendengarkan hambatan warga serta memperbarui distribusi dan informasi akses pertolongan.","options":["Benar","Salah"],"answer":0,"explanation":"Respons menghubungkan kebutuhan, penerimaan bantuan dan komunikasi risiko. Jumlah kiriman belum membuktikan kebutuhan individual terpenuhi.","materialSection":"k5m2-s9","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-17"},{"id":"TF-k5-post-18","difficulty":"medium","stem":"Gedung Puskesmas telah dibuka, tetapi obat dan alat bantu beberapa keluarga belum kembali tersedia. Tim menutup evaluasi pemulihan karena perbaikan bangunan dianggap sudah mewakili pulihnya semua fungsi dan akses.","options":["Benar","Salah"],"answer":1,"explanation":"Pemulihan fungsi, obat, alat serta akses keluarga harus dibedakan dari perbaikan bangunan. Kebutuhan tersisa memerlukan prioritas dan penanggung jawab.","materialSection":"k5m2-s9","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-18"},{"id":"TF-k5-post-19","difficulty":"medium","stem":"Pasien pascaperawatan meminta latihan tertentu sebelum indikasi atau kontraindikasinya dinilai. Tim menghubungkan asesmen fisioterapi berwenang, tujuan fungsi, evaluasi ulang dan komunikasi kepada perujuk serta caregiver.","options":["Benar","Salah"],"answer":0,"explanation":"Alur fisioterapi menautkan asesmen, asuhan, evaluasi dan koordinasi. Permintaan intervensi tidak menggantikan penilaian kompeten serta tujuan pasien.","materialSection":"k5m2-s6","refs":["ICOPE2025","LKPPT2025"],"sourceUnit":"K5-PPT-19"},{"id":"TF-k5-post-20","difficulty":"medium","stem":"Staf membaca label TENS yang disamakan dengan infrared pada bahan kerja. Ia menganggap label itu cukup untuk memilih alat serta menetapkan dosis karena pasien sudah menyetujui tindakan.","options":["Benar","Salah"],"answer":1,"explanation":"Persetujuan tidak menghapus kebutuhan asesmen, kompetensi dan prosedur alat. Label yang tidak konsisten harus diklarifikasi; dosis tidak ditetapkan dari sumber ambigu.","materialSection":"k5m2-s15","refs":["LKPPT2025"],"sourceUnit":"K5-PPT-20"},{"id":"TF-k5-post-21","difficulty":"medium","stem":"Pasien paliatif ingin meninjau tujuan setelah gejala dan kemampuan caregiver berubah. Tim mendengarkan preferensi serta kebutuhan psikososial-spiritual sambil mempertahankan evaluasi klinis dan penanganan keluhan.","options":["Benar","Salah"],"answer":0,"explanation":"Paliatif menghubungkan kenyamanan, gejala dan tujuan pasien. Dukungan spiritual mengikuti pilihan pasien dan tidak menggantikan evaluasi keadaan memburuk.","materialSection":"k5m2-s7","refs":["K3","KMK6312026"],"sourceUnit":"BOOK-ENRICHMENT"},{"id":"TF-k5-post-22","difficulty":"hard","stem":"Pasien membawa surat rujuk balik dan kondisi stabil telah dinilai layanan lanjut, tetapi obat belum tersedia serta caregiver belum memahami rencana. Tim menutup koordinasi karena kriteria stabil dianggap sekaligus membuktikan akses obat dan kesiapan rumah.","options":["Benar","Salah"],"answer":1,"explanation":"Penetapan stabil berbeda dari ketersediaan obat serta kemampuan rumah. Ketiganya perlu dihubungkan melalui komunikasi, akses dan tindak lanjut yang dapat diperiksa.","materialSection":"k5m2-s11","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-11"},{"id":"TF-k5-post-23","difficulty":"hard","stem":"Stok PKMK menumpuk, satu unit kosong dan laporan penerimaan tidak cocok dengan stok fisik. Tim menelusuri mutasi serta kebutuhan, menetapkan penanggung jawab perbaikan dan mengevaluasi apakah distribusi benar-benar memenuhi unit yang membutuhkan.","options":["Benar","Salah"],"answer":0,"explanation":"Perbaikan tidak berhenti pada penyusunan angka laporan. Ketertelusuran dan penilaian hasil distribusi diperlukan sebelum menyimpulkan masalah teratasi.","materialSection":"k5m2-s13","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-06"},{"id":"TF-k5-post-24","difficulty":"hard","stem":"Identitas spesimen sesuai dan pasien perlu keputusan cepat, tetapi kontrol analitik di luar kriteria. Tim menerbitkan hasil dahulu karena masalah pasca analitik sudah diperiksa, lalu merencanakan verifikasi analitik pada pertemuan mutu berikutnya.","options":["Benar","Salah"],"answer":1,"explanation":"Kecepatan dan kecocokan identitas tidak meniadakan masalah analitik. Pengendalian hasil, eskalasi dan verifikasi koreksi dilakukan sebelum proses diteruskan secara aman.","materialSection":"k5m2-s13","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-14"},{"id":"TF-k5-post-25","difficulty":"hard","stem":"Pasien membawa dua daftar obat, caregiver sulit membaca dan biaya menghambat pengambilan satu obat. Tim mengklarifikasi perbedaan melalui tenaga berwenang, memeriksa pemahaman dengan cara yang sesuai dan mengatur akses tanpa menyerahkan perubahan terapi kepada caregiver.","options":["Benar","Salah"],"answer":0,"explanation":"Rekonsiliasi, komunikasi yang dapat dipahami dan akses perlu dipadukan. Keterlibatan caregiver mendukung penggunaan aman tanpa memindahkan kewenangan terapi.","materialSection":"k5m2-s2","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-08"},{"id":"TF-k5-post-26","difficulty":"hard","stem":"Bantuan telah diterima gudang, rumor menurunkan kunjungan dan satu keluarga memerlukan alat bantu. Tim menganggap kebutuhan klinis terpenuhi dari catatan gudang, sehingga cukup menerbitkan pesan umum tanpa memeriksa hambatan penerimaan atau akses keluarga.","options":["Benar","Salah"],"answer":1,"explanation":"Penerimaan gudang berbeda dari penerimaan pasien dan pulihnya akses. Komunikasi perlu mendengarkan kebutuhan serta diikuti tindak lanjut bantuan yang nyata.","materialSection":"k5m2-s9","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-17"},{"id":"TF-k5-post-27","difficulty":"hard","stem":"Pasien pascafraktur memiliki fungsi terbatas, caregiver kelelahan dan akses rumah sulit. Tim menyepakati tujuan fungsi, menghubungkan asesmen serta asuhan profesional, menilai bantuan rumah dan mengomunikasikan evaluasi kepada perujuk untuk kelanjutan rencana.","options":["Benar","Salah"],"answer":0,"explanation":"Rehabilitasi terpadu menghubungkan fungsi, dukungan caregiver, rumah dan evaluasi profesional. Satu latihan atau alat tidak mewakili keseluruhan rencana.","materialSection":"k5m2-s6","refs":["ICOPE2025","LKPPT2025"],"sourceUnit":"K5-PPT-19"},{"id":"TF-k5-post-28","difficulty":"veryhard","stem":"Lansia dengan dua daftar obat mempunyai hasil laboratorium yang perlu ditindaklanjuti dan caregiver sulit memahami instruksi. Karena semua unit sudah memasukkan catatan, koordinator menutup alur tanpa memastikan penerima hasil, klarifikasi daftar obat dan pemahaman rencana rumah.","options":["Benar","Salah"],"answer":1,"explanation":"Catatan unit tidak sama dengan terpenuhinya kebutuhan pasien. Koordinasi menutup hubungan hasil, obat, pemahaman dan tanggung jawab tindak lanjut secara terpadu.","materialSection":"k5m2-s1","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-01"},{"id":"TF-k5-post-29","difficulty":"veryhard","stem":"Setelah banjir, gedung berfungsi kembali tetapi obat pasien kronis, alat bantu dan dukungan caregiver belum pulih. Tim membedakan kerusakan bangunan dari gangguan fungsi serta akses, menetapkan penanggung jawab kebutuhan tersisa dan mengevaluasi penerimaan bantuan bersama keluarga.","options":["Benar","Salah"],"answer":0,"explanation":"Pemulihan menghubungkan fungsi layanan dan kebutuhan keluarga, bukan hanya bangunan. Bukti penerimaan serta evaluasi kebutuhan tersisa diperlukan untuk menilai kemajuan.","materialSection":"k5m2-s9","refs":["LK2024","LKPPT2025"],"sourceUnit":"K5-PPT-18"},{"id":"TF-k5-post-30","difficulty":"veryhard","stem":"Pasien pascarawat memerlukan tindak lanjut hasil yang ditandai segera, evaluasi fungsi belum kembali ke perujuk dan caregiver kelelahan. Agar keluarga cukup datang sekali, koordinator menutup transisi dari bukti surat serta obat yang sudah diserahkan dan menggabungkan penelaahan hasil segera, umpan balik rehabilitasi serta dukungan caregiver pada kontrol rutin berikutnya.","options":["Benar","Salah"],"answer":1,"explanation":"Penutupan transisi harus membedakan urgensi klinis dari pengaturan kunjungan. Hasil yang memerlukan tindakan segera dieskalasi melalui jalur yang sesuai; umpan balik rehabilitasi dan kapasitas serta bantuan caregiver juga ditelusuri sebelum rencana dianggap tersambung. Surat dan obat yang diserahkan belum membuktikan ketiga kebutuhan itu selesai.","materialSection":"k5m2-s1","refs":["LK2024","LKPPT2025","ICOPE2025","CHARTRAND2023"],"sourceUnit":"K5-PPT-01","supportSections":["k5m2-s1","k5m2-s3","k5m2-s5","k5m2-s6"]}]},"bookMapping":[{"bookChapter":"Bab 10","addition":"Menghubungkan gigi, triase, farmasi, laboratorium, rawat inap, dan krisis dengan keselamatan serta tanggung jawab tindak lanjut.","sectionIds":["k5m1-s1","k5m1-s2","k5m1-s3","k5m1-s4","k5m1-s5","k5m1-s6","k5m1-s7","k5m1-s8","k5m1-s9","k5m1-s10"],"sourceKeys":["LK2024","ILP2023"]},{"bookChapter":"Bab 11","addition":"Membedakan koordinasi, discharge planning, dan transitional care; menilai kesiapan caregiver, dukungan rumah, tujuan paliatif, dan umpan balik rujukan.","sectionIds":["k5m2-s1","k5m2-s2","k5m2-s3","k5m2-s4","k5m2-s5","k5m2-s7","k5m2-s8","k5m2-s9"],"sourceKeys":["LK2024","CHARTRAND2023","ICOPE2025"]},{"bookChapter":"Bab 3 sampai Bab 5 dan Bab 12","addition":"Menerapkan kebutuhan fungsi dan sosial sesuai persetujuan, menjaga data sensitif, serta memeriksa keluaran digital dan AI.","sectionIds":["k5m2-s5","k5m2-s6","k5m2-s10"],"sourceKeys":["ICOPE2025","AIWHO2021","LK2024"]},{"bookChapter":"Bab 10 bagian 10.6 dan Bab 11 bagian 11.6 serta Lampiran F","addition":"Memperjelas lima tahap pencegahan, rehabilitasi, kompetensi transisi dan paliatif menurut jenjang, serta batas penafsiran kriteria tujuh hari.","sectionIds":["k5m2-s14"],"sourceKeys":["KMK6312026","ILP2023"]}],"sourceCoverage":[{"unitId":"LK-01","topic":"Promosi dan pencegahan kesehatan gigi dan mulut","pageStart":5,"pageEnd":8,"sectionIds":["k5m1-s2"],"limitation":""},{"unitId":"LK-02","topic":"Skrining gigi/mulut menurut siklus hidup dan rujukan","pageStart":9,"pageEnd":24,"sectionIds":["k5m1-s2"],"limitation":""},{"unitId":"LK-03","topic":"Pelayanan, peralatan, pelaporan dan kegawatdaruratan gigi","pageStart":25,"pageEnd":31,"sectionIds":["k5m1-s11"],"limitation":""},{"unitId":"LK-04","topic":"Kegawatdaruratan dan alur triase","pageStart":32,"pageEnd":37,"sectionIds":["k5m1-s3"],"limitation":""},{"unitId":"LK-05","topic":"Survei primer/sekunder, resusitasi dan pelayanan definitif","pageStart":38,"pageEnd":44,"sectionIds":["k5m1-s13"],"limitation":""},{"unitId":"LK-06","topic":"Kegawatdaruratan khusus","pageStart":45,"pageEnd":53,"sectionIds":["k5m1-s13"],"limitation":""},{"unitId":"LK-07","topic":"Tata laksana rujukan gawat darurat","pageStart":54,"pageEnd":55,"sectionIds":["k5m1-s4"],"limitation":""},{"unitId":"LK-08","topic":"Organisasi dan ruang lingkup kefarmasian","pageStart":56,"pageEnd":61,"sectionIds":["k5m1-s1"],"limitation":""},{"unitId":"LK-09","topic":"Pemilihan, perencanaan, pengadaan dan penerimaan obat/BMHP","pageStart":62,"pageEnd":67,"sectionIds":["k5m1-s5"],"limitation":""},{"unitId":"LK-10","topic":"Penyimpanan, rantai dingin dan distribusi obat/vaksin","pageStart":68,"pageEnd":75,"sectionIds":["k5m1-s6"],"limitation":""},{"unitId":"LK-11","topic":"Penarikan/pemusnahan, pengendalian, pencatatan dan evaluasi farmasi","pageStart":76,"pageEnd":82,"sectionIds":["k5m2-s13"],"limitation":""},{"unitId":"LK-12","topic":"Pengkajian dan pelayanan resep","pageStart":83,"pageEnd":88,"sectionIds":["k5m1-s7"],"limitation":""},{"unitId":"LK-13","topic":"Pelayanan informasi obat dan konseling","pa  cakupan sangat ringkas, satuan, atau rincian klinis yang perlu ditelaah.","action":"Tambahkan catatan verifikasi dan batas tindakan; jangan memindahkan dosis, ambang, manfaat pasti atau algoritme sebagai kunci ujian secara otomatis."},{"source":"K5","locator":"Slide 66–67, 86, 93, 189–190","finding":"Terdapat duplikasi isi: 66–67, 86–93, dan 189–190.","action":"Inventori tetap mencakup semuanya; penambahan materi tidak dihitung ganda."},{"source":"K5","locator":"Slide 2, 7–9, 27, 46, 53–54, 70, 77–78, 80, 83–84, 87, 92, 95–96, 100, 104, 106, 113–116, 118–120, 144, 157–160, 183, 206–209","finding":"Nomor catatan pembicara tidak otomatis sama dengan nomor slide. Catatan pada slide 27, 158 dan 206–209 memuat nomor lama, rujukan atau instruksi editorial; pemetaan harus mengikuti relationship setiap slide.","action":"Catatan yang berisi instruksi perubahan tidak diperlakukan sebagai kebijakan atau prosedur yang sudah disetujui."},{"source":"K5","locator":"Slide 23","finding":"Rumusan lesi prakanker pada slide 23 tidak konsisten secara tata bahasa.","action":"Klarifikasi rumusan dari sumber primer. Ajarkan kebutuhan penilaian dan rujukan atas dugaan lesi tanpa membuat definisi diagnosis baru."},{"source":"K5","locator":"Slide 54","finding":"Prioritas 0 dibedakan antara konteks korban bencana dan pasien yang telah meninggal saat tiba; waktu tunggu tercantum tanpa konteks yang cukup untuk digeneralisasi.","action":"Pertahankan konteks triase dan verifikasi algoritme setempat. Jangan menerapkan satu waktu tunggu kepada semua pasien."},{"source":"K5","locator":"Slide 56","finding":"Diagram resusitasi mengulang label bernapas normal dan ada denyut pada dua cabang yang memberikan tindakan berbeda.","action":"Jangan menyalin diagram sebagai algoritme klinis atau kunci ujian sebelum klarifikasi dan telaah acuan resusitasi primer."},{"source":"K5","locator":"Slide 60–61","finding":"Beberapa kondisi gawat dan terapi diringkas dalam satu bagian sehingga rincian indikasi dan batas penggunaannya belum cukup.","action":"Batasi materi staf umum pada pengenalan dan eskalasi; telaah protokol profesional sebelum mengadopsi pilihan obat atau tindakan."},{"source":"K5","locator":"Slide 69","finding":"Istilah, angka dan satuan pada rincian cairan serta obat luka bakar memerlukan penelaahan klinis.","action":"Tahan dosis, rumus, ambang dan instruksi tindakan sampai diverifikasi oleh penelaah klinis dengan acuan primer."},{"source":"K5","locator":"Slide 70","finding":"Slide memuat rincian antivenom dan tes alergi yang belum dikonfirmasi kesesuaian protokolnya.","action":"Verifikasi pedoman penanganan gigitan berbisa dan produk yang berlaku; jangan menjadikannya instruksi staf umum atau kunci soal."},{"source":"K5","locator":"Slide 71","finding":"Angka observasi 8 jam dan 24 jam tampil tanpa konteks keputusan pulang yang cukup.","action":"Gunakan penilaian klinis dan pedoman tenggelam yang telah ditelaah; jangan memilih satu durasi sebagai aturan universal."},{"source":"K5","locator":"Slide 83","finding":"Rumus kebutuhan obat menempatkan stok pengaman dalam persen dan waktu tunggu dalam minggu, sedangkan komponen lain berupa jumlah kebutuhan.","action":"Samakan satuan menjadi jumlah kebutuhan melalui contoh yang ditelaah; jangan menjumlahkan persen atau minggu secara langsung dengan unit obat."},{"source":"K5","locator":"Slide 89–91","finding":"Batas suhu, pemakaian vial terbuka dan penataan refrigerator bergantung pada produk serta tipe alat.","action":"Cocokkan dengan pedoman imunisasi, informasi produk dan alat yang berlaku sebelum membuat aturan atau kunci universal."},{"source":"K5","locator":"Slide 114–116, 118","finding":"Slide 114 menumpuk teks salinan dan memuat rumusan polifarmasi yang tidak selaras dengan uraian banyak obat pada slide 118.","action":"Gunakan uraian terstruktur slide 115–116 setelah ditelaah; jangan mengajarkan rumusan polifarmasi yang tidak konsisten sebagai definisi tunggal."},{"source":"K5","locator":"Slide 122","finding":"Alamat dan mekanisme sistem pelaporan efek samping pada sumber belum membuktikan akses layanan atau penerimaan laporan pada pelaksanaan.","action":"Konfirmasi kanal pelaporan, sediakan dokumentasi manual bila perlu, dan jangan menyamakan pembukaan laman dengan laporan yang diterima."},{"source":"K5","locator":"Slide 129","finding":"Daftar obat geriatrik dan ambang seleksi pasien dalam sumber memerlukan penelaahan kemutakhiran.","action":"Jangan memakai daftar tersebut sebagai larangan universal atau kunci ujian sebelum konfirmasi acuan primer."},{"source":"K5","locator":"Slide 131–136","finding":"Daftar penyakit, syarat stabil dan model kerja sama PRB merupakan rincian program yang perlu diselaraskan dengan ketentuan yang berlaku.","action":"Verifikasi ketentuan program dan tanggung jawab fasilitas; jangan menganggap diagram sebagai kontrak lokal atau bukti obat tersedia."},{"source":"K5","locator":"Slide 144","finding":"Angka jumlah fasilitas pada diagram merupakan data dalam bahan sumber dan tidak otomatis menjadi statistik nasional terkini.","action":"Sebut konteks waktu sumber dan gunakan data mutakhir yang terverifikasi bila membuat klaim kondisi nasional."},{"source":"K5","locator":"Slide 147–150","finding":"Angka tenaga, luas ruangan dan jumlah alat merujuk standar dalam bahan yang belum dibuktikan status mutakhirnya oleh audit ini.","action":"Telusuri regulasi dan lampirannya sebelum menyatakannya sebagai persyaratan wajib; bedakan kesiapan layanan dari daftar pengadaan."},{"source":"K5","locator":"Slide 158","finding":"Catatan pembicara meminta penambahan kotak tindak lanjut setelah hasil rujukan; permintaan editorial tidak sama dengan isi diagram yang sudah disetujui.","action":"Tandai status catatan. Pertahankan koordinasi hasil dan tindak lanjut berdasarkan sumber yang sah tanpa mengklaim kotak tersebut sudah ada pada gambar."},{"source":"K5","locator":"Slide 159–160","finding":"Kategori A/B, nomor UN, dry ice dan pengemasan bahan infeksius memerlukan kesesuaian dengan persyaratan pengiriman yang berlaku.","action":"Gunakan petugas kompeten dan prosedur pengiriman yang telah diverifikasi; daftar periksa pembelajaran tidak menggantikan pelatihan pengemasan bahan berbahaya."},{"source":"K5","locator":"Slide 203","finding":"Daftar dokter, fisioterapis dan tenaga kesehatan dengan pelatihan khusus bukan bukti izin otomatis seluruh tindakan bagi setiap staf.","action":"Tetapkan peran sesuai kompetensi, kewenangan dan prosedur; kuis tidak memberikan kewenangan pengoperasian modalitas."},{"source":"K5","locator":"Slide 204","finding":"Istilah aktualisasi rendah serta penomoran cabang dalam alur fisioterapi belum cukup jelas untuk diterjemahkan menjadi algoritme teknis.","action":"Minta klarifikasi klinis dan redaksional sebelum membuat algoritme atau kunci ujian; pertahankan alur asesmen, evaluasi ulang dan koordinasi berwenang."},{"source":"K5","locator":"Slide 206–209","finding":"Bagian modalitas memakai judul Layanan Fisiologis dan memuat daftar manfaat serta rumusan efek samping yang luas tanpa dukungan penelitian yang memadai pada slide.","action":"Telaah nomenklatur, indikasi, kontraindikasi dan bukti manfaat; jangan membuat klaim efektivitas pasti atau protokol universal."},{"source":"K5","locator":"Slide 207","finding":"TENS disebut sebagai terapi infrared dan istilah infrared terulang di dalam prosedurnya.","action":"Klarifikasi nama modalitas dan prosedur dengan penelaah fisioterapi sebelum dipakai mengarahkan pemilihan alat atau soal."},{"source":"K5","locator":"Slide 209","finding":"Durasi ultrasound 7–10 menit dicantumkan tanpa dasar untuk menerapkannya pada semua pasien dan alat.","action":"Penetapan waktu, dosis dan teknik mengikuti asesmen profesional serta prosedur alat yang terverifikasi; jangan membuat aturan universal."}],"rule":"Parameter ambigu, label tidak konsisten, catatan editorial dan klaim kewajiban dalam versi kerja tidak digunakan sebagai protokol universal atau kunci klinis.","professionalRevie
