n"},{"page":161,"title":"1. Tujuan rujukan laboratorium 2. Alur rujukan laboratorium 3. Tatacara pengepakan Spesimen Rujukan Mekanisme Rujukan"},{"page":162,"title":"Tujuan Mekanisme Rujukan dan Pembinaan"},{"page":163,"title":"Alur mekanisme rujukan Spesimen melalui kurir ekspedisi"},{"page":164,"title":"Tatacara Pengepakan Spesimen Rujukan Jarak Dekat"},{"page":165,"title":"Tatacara Pengepakan Spesimen Rujukan Jarak Jauh"},{"page":166,"title":"Tatacara Pengepakan Spesimen Rujukan dengan Paket"}],"limitation":""},{"id":"LK-21","cluster":"LK","start":167,"end":176,"topic":"Pemantapan mutu laboratorium dan kalibrasi","part":2,"lessons":["II-32"],"headings":[{"page":167,"title":"Mekanisme Rujukan dan Pembinaan"},{"page":168,"title":"1. Tujuan Pemantauan mutu 2. Mekanisme rujukan dan pembinaan 3. Mekanisme pemantauan mutu Pemantauan Mutu dan Pembinaan"},{"page":169,"title":"Tujuan Pemantauan Mutu dan Pembinaan Demi menjamin tercapainya dan"},{"page":170,"title":"Mekanisme Pemantauan Mutu dan Pembinaan 2. Pemantapan Mutu Eksternal (PME/External Pemantapan mutu (quality assurance)"},{"page":171,"title":"Mekanisme Pemantauan Mutu"},{"page":172,"title":"Mekanisme Pemantauan Mutu Internal Tujuan: Manfaat Pemantapan Mutu Internal"},{"page":173,"title":"Mekanisme Pemantauan Mutu Internal Beberapa kegiatan pemantapan mutu internal yang dibahas :"},{"page":174,"title":"Kalibrasi Alat: 1. Inkubator 2. Lemari Es"},{"page":175,"title":"Mekanisme Pemantauan Mutu Eksternal Pemantapan Mutu Eksternal adalah kegiatan yang diselenggarakan secara periodik oleh pihak lain"},{"page":176,"title":"Mekanisme Pemantauan Mutu Eksternal"}],"limitation":""},{"id":"LK-22","cluster":"LK","start":177,"end":182,"topic":"Analisis data, pencatatan dan pelaporan laboratorium","part":2,"lessons":["II-32"],"headings":[{"page":177,"title":"Mekanisme Pencatatan, Pelaporan dan Analisis Data berbasis Laboratorium"},{"page":178,"title":"Tujuan Mekanisme Pencatatan dan Pelaporan"},{"page":179,"title":"Pengelolaan, Analisis, dan Penyajian Data"},{"page":180,"title":"Komunikasi dengan Pemangku Kepentingan"},{"page":181,"title":"Pencatatan dan Pelaporan"},{"page":182,"title":"Pengelolaan, Analisis dan Penyajian Data"}],"limitation":""},{"id":"LK-23","cluster":"LK","start":183,"end":187,"topic":"Pelayanan rawat inap","part":2,"lessons":["I-14","II-32"],"headings":[{"page":183,"title":"Pelayanan Rawat Inap BAB Y RAWAT INAP Alur Pelayanan Rawat Inap"},{"page":184,"title":"Pelayanan Rawat Inap"},{"page":185,"title":"Tujuan Pelayanan rawat inap"},{"page":186,"title":"Alur Pelayanan Rawat Inap"},{"page":187,"title":"Alur Rawat Inap Pasien Gawat Darurat"}],"limitation":""},{"id":"LK-24","cluster":"LK","start":188,"end":193,"topic":"Penanggulangan krisis kesehatan","part":2,"lessons":["I-14","II-32","II-33"],"headings":[{"page":188,"title":"BAB Z Upaya Penanggulangan PENANGGULANGAN Krisis Kesehatan KRISIS KESEHATAN"},{"page":189,"title":"Penanggulangan Krisis Kesehatan Krisis kesehatan adalah peristiwa atau rangkaian peristiwa yang"},{"page":190,"title":"Upaya Penanggulangan Krisis Kesehatan Assesment"},{"page":191,"title":"Pengkajian Risiko Krisis Kesehatan"},{"page":192,"title":"Penyediaan Sumber Daya"},{"page":193,"title":"Daftar Pustaka • Undang-Undang Republik Indonesia Nomor 17 Tahun 2023 Tentang Kesehatan"}],"limitation":""},{"id":"LK-25","cluster":"LK","start":4,"end":4,"topic":"Layanan fisioterapi: Bab ZA hanya tercantum pada daftar isi","part":2,"lessons":["II-34"],"headings":[{"page":4,"title":"DAFTAR ISI Bab U Pelayanan Gigi dan Mulut"}],"limitation":"Judul fisioterapi tercantum pada daftar isi, tetapi uraian babnya belum ditemukan dalam berkas. Tidak ada prosedur pengganti yang dibuat."}],"sourcePages":[{"page":1,"text":"1"},{"page":2,"text":"Kata Pengantar 2\nMenteri Kesehatan\n\nIndonesia Emas 2045 adalah visi besar yang menekankan pada pembangunan berkelanjutan, kesejahteraan\nmasyarakat, dan kualitas hidup yang lebih baik. Dalam konteks kesehatan, fokus utama adalah memastikan akses\nlayanan kesehatan berkualitas bagi seluruh Masyarakat. Dalam rangka mendukung visi Indonesia Emas 2045,\nKementerian Kesehatan mempersembahkan Pedoman Kerja Puskesmas.\n\nTransformasi Pelayanan Kesehatan Primer saat ini menjadi bagian penting dan paling dekat di masyarakat dimana fokus\nkita adalah menjaga orang tetap sehat, bukan mengobati orang yang sakit. Dengan Kesehatan yang terjaga, maka\nmasyarakat akan memiliki kualitas hidup yang lebih baik dan produktif.\n\nPeran puskesmas menjadi sangat penting dalam mencegah permasalahan kesehatan dengan tanggung jawab untuk\nmenggerakkan masyarakat dalam menjaga dan mempertahankan kesehatan mereka, serta melakukan pencegahan\npenyakit melalui skrining dini dan cakupan imunisasi yang lebih baik. Dengan demikian, Puskesmas menjadi garda\nterdepan dalam mencegah dan mengurangi beban penyakit di tengah masyarakat.\n\nPada bulan Agustus 2023, Kementerian Kesehatan secara resmi meluncurkan program Integrasi Pelayanan Kesehatan\nPrimer (ILP). Progam ini menyasar bahwa transformasi kesehatan dapat dilaksanakan dengan lebih cepat dan efektif.\nMelalui integrasi ini, seluruh Puskesmas diharapkan mampu meningkatkan layanan kesehatan yang lebih terkoordinasi,\nkomprehensif, dan berfokus pada kebutuhan masyarakat.\n\nPedoman ini disusun sebagai acuan praktis bagi seluruh petugas kesehatan di Puskesmas, Pustu, dan Posyandu. Dengan\nadanya pedoman ini, diharapkan semua pihak dapat melaksanakan tugasnya dengan lebih terarah dan efisien dalam\nmengedepankan pelayanan yang berkualitas, terintegrasi, dan responsif terhadap kebutuhan masyarakat.\n\nSaya berharap buku ini dapat menjadi penyemangat bagi semua petugas di Puskesmas, Pustu, dan Posyandu di semua\nwilayah baik desa, kota, perbatasan, maupun pegunungan.\n\nSebagai penutup, mari kita ingat bahwa setiap halaman dalam buku pedoman ini merupakan langkah kita bersama\ndalam mewujudkan pelayanan kesehatan yang lebih baik.\n\nTerima kasih atas dedikasi dan kerja keras semua pihak. Mari kita wujudkan pelayanan kesehatan yang lebih baik demi\nIndonesia yang lebih sehat.\n\nJakarta, Oktober 2024\n\nMenteri Kesehatan Republik Indonesia\n\nBudi Gunadi Sadikin\n\nBudi Gunadi Sadikin\nMenteri Kesehatan Republik Indonesia"},{"page":3,"text":"3Kata Pengantar\nDirektur Jenderal Kesehatan Masyarakat\n\nPuji syukur kehadirat Tuhan Yang Maha Kuasa, yang telah memberikan rahmat dan karunia-Nya sehingga\nPedoman Kerja Puskesmas dapat terselesaikan. Pedoman ini digunakan sebagai panduan bagi Puskesmas\ndalam mengimplementasikan Integrasi Pelayanan Kesehatan Primer.\n\nIntegrasi Pelayanan Kesehatan Primer (ILP) merupakan upaya untuk menata dan mengoordinasikan berbagai\npelayanan kesehatan primer dengan fokus pada pemenuhan kebutuhan pelayanan kesehatan berdasarkan\nsiklus hidup bagi perseorangan, keluarga dan masyarakat. ILP bertujuan untuk mendekatkan akses dan\npelayanan kesehatan yang bersifat promotif, preventif, kuratif, rehabilitatif, dan/atau paliatif pada setiap fase\nkehidupan secara komprehensif dan berkualitas bagi Masyarakat.\n\nPedoman Kerja ini diharapkan dapat mempermudah Puskesmas melaksanakan tugas dan fungsinya\nmemberikan pelayanan kesehatan yang berkualitas kepada masyarakat. Pedoman ini terdiri dari lima buku\nberdasarkan Tata kelola Pelayanan Kesehatan primer di Puskesmas yang diselenggarakan secara terintegrasi\nmelalui sistem klaster, yaitu:\n\n1. Buku 1: Manajemen Puskesmas;\n\n2. Buku 2: Pelayanan Kesehatan Ibu dan Anak;\n\n3. Buku 3: Pelayanan Kesehatan Usia Dewasa dan Lansia;\n\n4. Buku 4: Penanggulangan Penyakit Menular dan Kesehatan Lingkungan;\n\n5. Buku 5: Lintas Klaster.\n\nAkhir kata, ucapan terima kasih kami sampaikan kepada semua pihak yang telah berkontribusi dalam\npenyusunan pedoman ini dan dapat diterapkan sesuai tujuan penyusunannya.\n\nJakarta, Oktober 2024\n\nDirektur Jenderal Kesehatan Masyarakat\n\ndr. Maria Endang Sumiwi, MPH\n\ndr. Maria Endang Sumiwi, MPH\nDirektur Jenderal Kesehatan Masyarakat"},{"page":4,"text":"4\nDAFTAR\nISI\nBab U Pelayanan Gigi dan Mulut\n\nBab V Kegawatdaruratan\n\nBab W Farmasi\n\nBab X Laboratorium\n\nBab Y Rawat Inap\n\nBab Z Penanggulangan Krisis Kesehatan\n\nBab ZA Layanan Fisioterapi Puskesmas"},{"page":5,"text":"5\n\nPromotif dan preventif\nBAB U\nSkrining Kesehatan gigiKESEHATAN dan Mulut\nGIGI DAN MULUT\nPelayanan Kesehatan\ngigi dan Mulut"},{"page":6,"text":"6\n\nPromotif dan preventif"},{"page":7,"text":"7\nKesehatan Gigi dan Mulut\n\nKesehatan gigi dan mulut adalah Tanda dan Gejala Penyakit Gigi\nkeadaan sehat dari jaringan keras dan Mulut, beberapa gejala\ndan jaringan lunak gigi serta umum antara lain:\nunsur-unsur yang berhubungan • Nyeri\ndengan rongga mulut, yang • Sensitivitas terhadap panas\nmemungkinkan individu makan, atau dingin\nberbicara dan berinteraksi sosial • Pembengkakan gusi\ntanpa disfungsi, gangguan estetik, • Rasa pahit atau berbau\ndan ketidaknyamanan karena • Nyeri saat mengigit atau\nadanya penyakit, penyimpangan mengunyah\noklusi dan kehilangan gigi • Pendarahan Gusi\nsehingga mampu hidup produktif • Pus disekitar gigi\nsecara sosial dan ekonomi. • gigi yag goyang atau longgar"},{"page":8,"text":"8\n\nSikat gigi secara baik dan benar 2 kali sehari,\na sesudah makan pagi dan sebelum tidur malam\n\nGunakan pasta gigi yang mengandung flourideKonseling b\ndan Edukasi\nc Tidak Merokok\nKesehatan\nGigi dan d Batasi Makanan Manis dan asam, diet gizi seimbang\nMulut e Banyak mengkonsumsi air putih\n\nRajin melakukan Pemeriksaan secara berkala, f\nminimal 1 tahun sekali"},{"page":9,"text":"9\n\nSkrining Kesehatan gigi dan Mulut"},{"page":10,"text":"10\nTujuan Skrining Kesehatan gigi dan mulut\n\nTujuan Skrining Sasaran Skrining\n• Menemukan secara dini faktor Semua Usia Sesuai siklus hidup\nrisiko penyakit gigi dan mulut.\n• Menemukan secara dini\nAlat Bantu penyakit gigi dan mulut (karies,\n• Format skrining Kesehatan gigi\npenyakit periodontal, dan mulut\nkehilangan gigi, dan kanker • Alat dan bahan habis pakai\nmulut) skrining Kesehatan gigi dan\n• Menemukan tanda penyakit mulut\nsistemik tertentu melalui rongga\nmulut."},{"page":11,"text":"11\n\n●Skrining kesehatan gigi dan mulut dapat\ndilakukan bersama dengan deteksi dini PTM\nlainnya, bisa dilakukan di Posbindu\nPTM/Posyandu/ Pos UKK, Komunitas, Sekolah,\nSkrining Kampus, Instansi/ tempat kerja dan Fasilitas\nKesehatan\nPelayanan Kesehatan serta tempat-tempat\nGigi dan\numum lainnya.\nMulut\n●Kegiatan deteksi dini Kesehatan gigi dan mulut\ndengan menggunakan Instrumen dan\npemeriksaan odontogram.\n●Deteksi Dini kesehatan gigi dan mulut dilakukan\nminimal 1 kali dalam 1 tahun"},{"page":12,"text":"12\nAlur Skrining Kesehatan Gigi dan Mulut"},{"page":13,"text":"13\nAlgoritma Deteksi Dini Penyakit Gigi dan Mulut\npada ibu hamil"},{"page":14,"text":"14\nSkrining Masalah Kesehatan Gigi dan Mulut Ibu\nHamil ANC di K1\n\n1. Pada ibu hamil penekanan pada perubahan hormonal, kondisi di rongga mulut harus dapat\ndiperhatikan dengan seksama.\n2. Gingivitis pregnancy sering dijumpai pada proses kehamilan apabila ibu hamil tidak menjaga\nkebersihan rongga mulutnya maka akan mudah terjadi gingivitis dimasa kehamilan.\n3. Periksa jaringan mukosa mulut dengan mencermati adanya perubahan warna jaringan dari warna\npink mengarah warna merah maka dapat diketahui terjadi peradangan bahkan telah terkontaminasi\nsehingga menjadi infeksi.\n4. Tatalaksana hasil skrining yang dilaksanakan baik di posyandu, pustu, atau polindes segera ditindak\nlanjuti untuk mendapatkan perawatan lebih lanjut di FKTP sehingga perawatan menjadi tuntas dan\nmenjaga Kesehatan gigi lebih optimal sampai pada saat ibu hamil partus untuk melaksanakan\nperawatan jangka panjang selanjutnya.\n5. Skrining penemuan dini kanker mulut dilakukan bersamaan pada pemeriksaan gigi dan jaringan\nmulut\n6. Jika tidak ditemukan tanda-tanda lesi prakanker mulut ( ditemukan lesi putih pad jaringan lunak)\nmaka dapat dilakukan konseling.\n7. Konseling Kesehatan gigi dan mulut untuk mendapat pemahaman pada ibu hamil untuk menghindari\nterjadinya karies dan penyakit mulut lainnya seperti gingivitis pregnancy"},{"page":15,"text":"15\nAlgoritma Deteksi Dini Penyakit Gigi dan Mulut pada\nBayi dan balita"},{"page":16,"text":"16\nSkrining Masalah Kesehatan Gigi dan Mulut pada\nbayi dan balita\n\n1. Kondisi mulut pada fase bayi dan balita merupakan fase tumbuh kembang yang harus mendapatkan perhatian dengan\nseksama baik pertumbuhan dan perkembangan fisik dari rongga mulut itu sendiri serta pertumbuhan gigi.\n2. Periksa langit-langit dan bibir untuk melihat pertumbuhan dan perkembangannya. Dengan mempersiapkan kondisi rongga\nmulut dalam pemeliharaan kebersihan dan Kesehatannya untuk pertumbuhan gigi susu.\n3. Pada bayi dan balita yang sering mengalami penyakit gig dan mulut, keluarga/ pendamping harus diberikan konseling\nbagaimana cara merawat dan membersihkan rongga mulut dan lidah agar terhindar dari penyakit mulut .\n4. Konseling Kesehatan berupa komunikasi Informasi dan Edukasi mengenai Kesehatan gigi dan mulut yaitu dengan\nmengajarkan cara menjaga kebersihan rongga mulut bayi sebelum tumbuh gigi hingga gigi sulung tumbuh lengkap serta\npembiasaan menggosok gigi dengan rutin dan benar ( sesudah makan pagi dan sebelum tidur malam).\n5. Skrining Gigi dan mulut dilakukan adalah dengan pemeriksaan status gigi dengan menggunakan odontogram, penemuan\ndini karies, kondisi jaringan periodontal dan penemuan dini penyakit mulut.\n6. Apabila ditemukan kelainan dan penyakit gigi dan mulut segera dilakukan tata laksana dengan benar dan tepat\n7. Kondisi yang tidak dapat tertangani di FKTP untuk kasus sulit segera dilakukan rujukan ke FKRTL. Dan Apabila masih\nmembutuhkan perawatan lebih lanjut yang dapat dilakukan di FKTP maka dapat dilakukan perawatan rujuk balik.\n8. Jika tidak ditemukan tanda-tanda lesi prakanker mulut maka dapat dilakukan konseling, jika ditemukan tanda-tanda lesi\nprakanker pada mulut segera lakukan rujukan ke FKRTL untuk mendapatkan tata laksana secara benar dan tepat.\n9. Tata laksana untuk kanker mulut dapat dilakukan secara berkelanjutan dan bila dibutuhkan untuk perawatan rujuk balik\ndapat dilakukan di FKTP kembali"},{"page":17,"text":"17\nAlur Deteksi dini Penyakit gigi dan mulut dan intervensi\ntopikal fluoride pada anak usia sekolah"},{"page":18,"text":"18\nSkrining Masalah Kesehatan Gigi dan Mulut pada\nanak usia sekolah\n\n1. Skrining Kesehatan gigi dan mulut pada anak sekolah membutuhkan kecermatan dan pemeriksaan yang lebih\nteliti karena pada fase ini merupakan kombinasi antara gigi sulung dan gigi dewasa.\n2. Pelaksanaan skrining Kesehatan gigi dan mulut dilakukan secara berkala pada penjaringan Kesehatan anak\nsekolah baik di sekolah umum maupun di pesantren serta pelayanan Kesehatan gigi dan mulut secara\nberkelanjutan\n3. Pada pemeriksaan gigi dan mulut yang di lakukan adalah penemuan karies, penyakit dan kelainan jaringan\nperiodontal, penyakit mulut lainnya\n4. Dari hasil skrining apabila ditemukan kasus maka dilakukan perawatan secara tepat dan tuntas, sehingga\nmembutuh kan penanganan kasus untuk di lakukan rujjukan ke FKRL segera buatkan rujukan untuk perawatan lebih\nlanjut\n5. Kondisi yang tidak dapat tertangani di FKTP untuk kasus sulit segera dilakukan rujukan ke FKRTL. Dan Apabila masih\nmembutuhkan perawatan lebih lanjut yang dapat dilakukan di FKTP maka dapat dilakukan perawatan rujuk balik.\n6. Apabila tidak mendapatkan perawatan maka pasien dikonseling untuk tetap menjaga kebersihan dan Kesehatan\nmulutnya setiap hari.\n7. Jika tidak ditemukan tanda-tanda lesi prakanker mulut maka dapat dilakukan konseling , apabila ditemukan\ntanda-tanda lesi prakanker pada mulut segera lakukan rujukan ke FKRTL untuk mendapatkan tata laksana secara\nbenar dan tepat.\n8. Tata laksana untuk kanker mulut dapat dilakukan secara berkelanjutan dan bila dibutuhkan untuk perawatan rujuk\nbalik dapat dilakukan di FKTP kembali"},{"page":19,"text":"19\nAlgoritma Deteksi Dini Penyakit Gigi dan Mulut pada\nusia Dewasa"},{"page":20,"text":"20\nSkrining Masalah Kesehatan Gigi dan Mulut pada\nusia Dewasa\n\n1. Pelaksanaan skrining dapat dilakukan pada saat dilaksanakan di posyandu, pustu, polindes dan juga di puskesmas\n2. Faktor risiko terkait dengan Kesehatan pada umumnya untuk usia produktif sangat tergantung dengan pola kehidupan\nsehari-harinya.\n3. Faktor risiko yang mempengaruhi Kesehatan gigi dan mulutnya adalah kebiasaan merokok, minum makanan yang\nmengandung pemanis yang berlebihan, kurang makan sayur dan buah serta kurang aktivitas fisik yang dapat\nmempengaruhi perkembangan dan pertumbuhan gigi dan mulut.\n4. Pada usia produktif banyak dijumpai yang telah mempunyai risiko terhadap penyakit tidak menular(PTM) dan bahkan\nsudah sebagai penyandang PTM (stroke, hipertensi, DM, PPOK, Kanker dan lainnya.). Hal ini menjadi perhatian khusus\nkarena sangat berpengaruh terhadap kondisi yang terdapat di dalam rongga mulut dan status giginya\n5. Setelah dilakukan pendataan status pasien maka mulai dengan melakukan pemeriksaan setiap aspek gigi dengan\nmenggunakan odontogram untuk menjelaskan lebih rinci semua kondisi gigi yang akan menjadi catatan dalam\nmenentukan proses perawatan lebih lanjut, apabila ditemukan kasus untuk perawatan yang dibutuhkan nantinya.\n6. Setelah dilakukan pendataan status maka mulai melakukan pemeriksaan setiap aspek gigi dengan menggunakan\nodontogram untuk menjelaskan lebih rinci semua kondisi gigi yang akan menjadi catatan dalam menentukan proses\nperawatan lebih lanjut apabila ditemukan kasus untuk perawatan yang dibutuhkan nantinya\n7. Pada saat dilakukan pendataan pasien dapat dilakukan proses konseling mengenai Kesehatan Gigi dan Mulut agar waktu\nlebih efektif kepada pasien."},{"page":21,"text":"21\nSkrining Masalah Kesehatan Gigi dan Mulut pada\nusia Dewasa\n\n8. Apabila ditemukan kasus penyakit gigi maupun penyakit mulut maka segera ditindak lanjuti dengan melakukan\nperawatan yang tepat dan tuntas, namun apabila tidak dapat ditangani di Puskesmas dan membutuhkan rujukan ke\nFKRTL maka segera buat\n9. Kondisi yang tidak dapat tertangani di FKTP untuk kasus sulit maka segera dilakukan rujukan ke FKRTL, dan apabila masih\nmembutuhkan perawatan lebih lanjut yang dapat dilakukan di FKTP maka dapat dilakukan perawatan rujuk balik.\n10. Jika tidak ditemukan tanda-tanda lesi prakanker mulut maka dapat dilakukan konseling.\n11. Apabila ditemukan tanda-tanda lesi prakanker pada mulut segera lakukan rujukan ke FKRTL untuk mendapatkan tata\nlaksana secara benar dan tepat.\n12. Tata laksana untuk kanker mulut dapat dilakukan secara berkelanjutan dan bila dibutuhkan untuk perawatan rujuk balik\ndapat dilakukan di FKTP kembali."},{"page":22,"text":"22\nAlgoritma Deteksi dini Penyakit Gigi dan Mulut pada\nlansia"},{"page":23,"text":"23\nSkrining Masalah Kesehatan Gigi dan Mulut pada\nLansia\n\n1. Pelaksanaan kegiatan skrining Kesehatan gigi dan mulut pada lansia dilaksanakan baik di kegiatan posyandu maupun di\nFKTP.\n2. Faktor risiko terkait dengan Kesehatan pada umumnya untuk lansia sangat tergantung dengan pola kehidupan sehari-\nharinya.\n3. Faktor risiko yang mempengaruhi Kesehatan gigi dan mulutnya adalah kebiasaan merokok, minum makanan yang\nmengandung pemanis yang berlebihan, kurang makan sayur dan buah serta kurang aktivitas fisik yang dapat\nmempengaruhi status kesehatan gigi dan mulut.\n4. Untuk lansia biasanya juga ditemukan tanpa ada keluhan dan lebih sering adanya gangguan dalam proses\npengunyahan.\n5. Lansia lebih dianjurkan dilakukan pemeriksaan Kesehatan gigi nya pada saat kunjungan rutin oleh kader ataupun tenaga\nKesehatan yang berkunjung ke rumah atau ada pertemuan rutin di FKTP untuk mengecek dan memeriksa gigi dan\nmulutnya dan pemeriksaan kesehatan rutin mereka.\n6. Setelah dilakukan pendataan status maka mulai melakukan pemeriksaan setiap aspek gigi dengan menggunakan\nodontogram untuk menjelaskan lebih rinci semua kondisi gigi yang akan menjadi catatan dalam menentukan proses\nperawatan lebih lanjut, apabila ditemukan kasus untuk perawatan yang dibutuhkan nantinya.\n7. Pada saat dilakukan pendataan pasien dapat dilakukan proses konseling mengenai kesehatan gigi dan mulut agar waktu\nlebih efektif kepada pasien\n8. Apabila ditemukan kasus penyakit gigi dan mulut maka segera ditindak lanjuti dengan melakukan perawatan yang tepat\ndan tuntas, namun apabila tidak dapat ditangani di Puskesmas dan membutuhkan rujukan ke FKRTL maka segera buat\nrujukan nya."},{"page":24,"text":"24\nSkrining Masalah Kesehatan Gigi dan Mulut pada\nLansia\n\n9. Kondisi yang tidak dapat tertangani di FKTP untuk kasus sulit segera dilakukan rujukan ke FKRTL., dan apabila masih\nmembutuhkan perawatan lebih lanjut yang dapat dilakukan di FKTP maka dapat dilakukan perawatan rujuk balik.\n10. Jika tidak ditemukan tanda-tanda lesi prakanker mulut dapat dilakukan konseling kesehatan gigi dan mulut dan apabila\nditemukan tanda-tanda lesi prakanker pada mulut segera lakukan rujukan ke FKRTL untuk mendapatkan tata laksana\nsecara benar dan tepat.\n11. Tata laksana untuk kanker mulut dapat dilakukan secara berkelanjutan dan bila dibutuhkan untuk perawatan rujuk balik\ndapat dilakukan di FKTP kembali."},{"page":25,"text":"25\n\nPelayanan Kesehatan gigi dan mulut"},{"page":26,"text":"26\nSarana dan Prasarana\n\nDalam Gedung Luar Gedung\n1. Ruang periksa yang dilengkapi dengan 1. BMHP untuk mendeteksi Masalah\nsarana pendukung seperti air yang Kesehatan gigi dan mulut :\nmengalir,tempat pembuangan limbah, a. kaca mulut, sonde, sarung tangan,\ndan listrik yang memadai. tampon, gelas kumur.\n2. Dental unit dan alat diagnostik set b. Disclosing solution\n3. BMHP untuk mendeteksi karies, penyakit c. Flouride Topikal esensial\ngigi dan mulut yang mempunyai risiko 2. Format skrining masalah Kesehatan gigi\ntinggi. dan mulut\n4. BMHP perawatan hasil skrining sebagai\ntindak lanjut hasil temuan kasus.\n5. BMHP topikal flourides dan penunjang\nlainnya."},{"page":27,"text":"27\nProsedur Pemeriksaan Skrining Masalah Kesehatan\nGigi dan Mulut\n\n1 3 2\nAnamnesis Pemeriksaan Pemeriksaan\nPenunjang Fisik\n\nSkrining dilakukan pada • Pemeriksaan visual gigi • Darah lengkap\nsemua usia produktif, dan mulut meliputi: • Radiologi\nanamnesa meilputi perubahan warna dan\n• Kebiasaan merokok bentuk\naktif • Penggunaan hand\n• Kebiasaan makanan instrument untuk\nyang manis memastikan adanya\n• Kebiasaan sikat gigi perubahan jaringan\nsesudah makan dan keras gigi.\nsebelum tidur • Penggunaan\n• Adakah riwayat odontogram untuk\nkeluarga penderita pencatatan hasil\nKanker pemeriksaan\n• menderita penyakit\ntidak menular\n(hypertensi, DM, PTM\nlainnya)."},{"page":28,"text":"28\nProsedur Pemeriksaan Skrining Masalah Kesehatan\nGigi dan Mulut\n\n4 5 6\nTatalaksana Tindak Lanjut Pencatatan\n& Pelaporan\n\n• Apabila ditemukan kasus penyakit gigi maupun penyakit Pemeriksaan secara Pencatatan dan\nmulut maka segera ditindak lanjuti dengan melakukan berkala dilakukan pelaporan dilaksanakan\nminimal 1 tahun sekali untuk seluruh kegiatan perawatan yang tepat dan tuntas, namun apabila tidak\npemeriksaan baik di dapat ditangani di Puskesmas dan membutuhkan rujukan dalam dan luar gedung,\nke FKRTL maka segera buat rujukan nya. menggunakan sistem\n• Kondisi yang tidak dapat tertangani di FKTP untuk kasus sulit informasi yang telah\nsegera dilakukan rujukan ke FKRTL ditentukan.\n• Jika tidak ditemukan tanda-tanda lesi prakanker mulut\ndapat dilakukan konseling DHE (Dental Health Education).\n• Apabila ditemukan tanda-tanda lesi prakanker pada mulut\nsegera lakukan rujukan ke FKRTL untuk mendapatkan tata\nlaksana secara benar dan tepat, bila dibutuhkan untuk\nperawatan rujuk balik dapat dilakukan di FKTP kembali"},{"page":29,"text":"29\nPENCATATAN DAN PELAPORAN\n\nPencatatan dan pelaporan dilaksanakan untuk seluruh kegiatan\npemeriksaan baik di dalam dan luar gedung, menggunakan sistem informasi\nyang telah ditentukan yaitu Aplikasi Satu Sehat ."},{"page":30,"text":"30\n\nKEGAWAT DARURATAN MASALAH\nKESEHATAN GIGI DAN MULUT"},{"page":31,"text":"31\nKegawatdaruratan gigi dan mulut\n\nKegawatdaruratan dibidang gigi dan Kondisi kegawatdaruratan yang sering\ndijumpai;\nmulut adalah kondisi yang berpeluang\n1. syok anaphylaksis\nmengancam jiwa dan diperlukan 2. Vasovagal Syncophe\ntindakan perawatan yang segera untuk 3. Perdarahan\n4. Dry Socket\nmenghentikan perdarahan yang sedang 5. Abses\nberlangsung, mengurangi rasa sakit dan 6. Avulsi\n7. Dislokasi temporomandibular joint\njuga perdarahan yang tidak terkontrol, (TMJ)\nselulitis atau infeksi bakteri jaringan 8. Pulpitis Akut\n9. Periodontitis Akut\nsehingga menyebabkan bengkak\nSegera ditangani sesuai dengan SOPdidalam mulut atau daerah mulut dan\nyang telah dicantumkan sesuai dengan\ntrauma pada tulang daerah wajah. kaidah – kaidah yang Benar."},{"page":32,"text":"32\n\nTujuan dan Definisi\n\nAlur umum\nKegawatdaruratan\nBAB V Tatalaksana\nkegawatdaruratanUNIT\nKEGAWATDARURATAN khusus\nTatalaksana Rujukan"},{"page":33,"text":"33\n\nTujuan dan definisi"},{"page":34,"text":"34\nTujuan Tatalaksana Kegawatdaruratan\nPenyelamatan nyawa dan pencegahan dari\nresiko kecacatan yang disesuikan dengan\nstandar pelayanan yang berlaku\n\nDefinisi Kegawatdaruratan\nKegawatdaruratan Pelayanan Kegawatdaruratan adalah\ntindakan medis yang dibutuhkan oleh pasien\ngawat darurat\ndalam waktu segera untuk menyelamatkan\nnyawa dan pencegahan kecacatan"},{"page":35,"text":"35\n\nAlur umum Kegawatdaruratan"},{"page":36,"text":"36\nAlur Umum Triase\n\nAlur registrasi dan Infom concent/ pasien Triase pencatatan dan pelaporan IGD\n\nPrioritas Prioritas Prioritas Prioritas\n0 I II III\n\nMeninggal Tatalaksana sesuai\nPemulasaran Jenazah Survei Primer Survei sekunder klaster\n\nPenanganan awal Dapat Tatalaksana definitif ditangani\nya\n\nTidak\n\nTatalaksana Rujuk"},{"page":37,"text":"37\nAlur Umum Triase\n\nPrioritas 0 Prioritas I Prioritas II Prioritas III\n(Konteks korban bencana) • Pasien membutuhkan • Pasien dengan kondisi • Pasien yang\nKondisi pasien sangat kritis penanganan medis masih stabil sehingga membutuhkan\nnamun sulit untuk secepat mungkin, karena masih dapat ditunda penanganan namun\ndiselamatkan nyawanya. pasien berada dalam beberapa saat masih dapat ditunda\nWalaupun mendapatkan kondisi yang kritis dan penanganannya, masih bahkan hingga 30 menit.\npenanganan secepat dapat mengancam perlu mendapatkan • Pasien yang\nmungkin, pasien akan tetap nyawa pasien. penanganan medis yang penanganannya setelah\nmeninggal dunia. • Pasien memiliki cepat. tenaga medis selesai\n(Konteks Gawat darurat) kemungkinan besar • Kondisi pasien dapat menangani pasien yang\nPasien kondisi sudah meninggal dunia bila tidak memburuk dengan cepat lebih darurat (pasien\nmeninggal pada saat masuk diberikan penanganan serta berpotensi dengan triase merah dan\ndalam ruang IGD yang cepat. menimbulkan kecacatan kuning).\natau kerusakan organ. • Pasien yang mengalami\nContoh: Contoh : cedera, namun masih\nPasien yang meninggal pasien yang terkena Contoh: sadar dan dapat berjalan\npada saat tiba di IGD serangan jantung, kesulitan Pasien dengan luka seperti biasanya.\nbernapas, mengalami bakar derajat tinggi, pasien\ntrauma kepala serius karena patah tulang di beberapa Contoh:\nkecelakaan ataupun tempat karena jatuh dari Pasien yang mengalami luka\nmengalami pendarahan ketinggian ataupun trauma bakar derajat ringan, patah\nyang luar yang serius. kepala ringan. tulang ringan ataupun luka\nringan."},{"page":38,"text":"38\n\nA : Airway, dengan kontrol servikal. Yang pertama harus\ndinilai adalah kelancaran jalan nafas. Ini meliputi\npemeriksaan adanya obstruksi jalan nafas oleh adanya\nbenda asing atau fraktus di bagian wajah.\nSURVEI B : Breathing. Setelah mengamankan airway maka\nPRIMER selanjutnya kita harus menjamin ventilasi yang baik.\nVentilasi yang baik meliputi fungsi dari paru paru yang\nbaik, dinding dada dan diafragma\nC : Circulation. Ketika mengevaluasi sirkulasi maka yang\nharus diperhatikan di sini adalah volume darah,\npendarahan, dan cardiac output."},{"page":39,"text":"39\nSURVEI PRIMER (Resusitasi)"},{"page":40,"text":"40\nSURVEI PRIMER\n\nMembuka jalan napas (airways) Bantuan napas (breathing)\n\n• Membuka jalan napas dengan • Setelah jalan napas terbuka dengan\nmekanisme head-tilt dan chin-lift head-tilt, chin-lift maneuver, tutup cuping\nmaneuver. hidung dan mulai pernapasan mulut ke\n• Taruh telapak tangan pada dahi pasien mulut, pastikan tidak ada aliran napas\nselanjutnya dorong perlahan yang keluar.\n• Tangan penolong yang lain akan • Berikan 2 kali napas dan pastikan napas\ndigunakan untuk mengangkat dagu bantuan masuk ke rongga dada dengan\npasien, ini akan membuka jalan napas. adanya Gerakan dada yang\nmengembung."},{"page":41,"text":"41\nSURVEI PRIMER\n\nKompresi dada (circulation)\n• Titik tumpu 1/2 bagian bawah\nsternum\n• Rasio kompresi dan ventilasi 30:2\n• Kecepatan 100-120x/mnt\n• Kedalaman 5-6 cm\n• Recoil dinding thorak yang\nsempurna\n\nPosisi penolong tegak lurus diatas\ndada pasien dengan siku lengan\nlurus menekan Tengah – Tengah\ntulang dada"},{"page":42,"text":"42\n\nSURVEI\nSEKUNDER"},{"page":43,"text":"Terapi definitif dalam Pemberian antibiotik jika ada 43\nkegawatdaruratan di Puskesmas tanda infeksi bakteri, serta\nbertujuan untuk menangani kondisi terapi suportif.\ndarurat secara cepat dan efektif. 3. Trauma:\nBerikut adalah beberapa contoh • Luka Terbuka: Pembersihan\nterapi definitif berdasarkan kondisi luka, penjahitan jika perlu, dan\nyang sering dijumpai: pemberian vaksin tetanus.\n• Fraktur: Immobilisasi dengan\n1. Kardiovaskular: splint dan rujukan ke rumah\nTERAPI • Nyeri Dada: Pemberian sakit untuk penanganan lebih\nnitroglyserin atau aspirin untuk lanjut.DEFINITIF\nmengurangi agregasi platelet. 4. Gastrointestinal:\n• Rujukan ke rumah sakit jika • Muntah/Mulas: Rehidrasi oral\ndicurigai infark miokard. atau intravena jika\n2. Respirasi: diperlukan.Pemberian\n• Asma Akut: Pemberian antiemetik jika ada mual yang\nbronkodilator (misalnya, signifikan.\nsalbutamol) melalui nebulizer. • Diare: Rehidrasi dengan larutan\nKortikosteroid oral jika oral, pemantauan kondisi, dan\ndiperlukan. rujukan jika berat.\n• Infeksi Saluran Pernapasan:"},{"page":44,"text":"44\n\n5. Infeksi:\n• Demam Berdarah atau Sepsis:\nPemberian cairan intravena dan\nantibiotik sesuai indikasi.Monitoring Pendekatan Umum:\ntanda vital dan status hidrasi. • Rujukan: Jika kondisi memerlukan\n6. Neurologis: penanganan lebih lanjut atau\n• Kejang: Pemberian benzodiazepin tidak bisa ditangani di Puskesmas.\n• Monitoring: Pemantauan intensifTERAPI (misalnya, diazepam) untuk\nmenghentikan kejang. terhadap tanda vital dan respons\nDEFINITIF • Stroke: Rujukan segera ke rumah pasien terhadap terapi.\nsakit untuk penanganan lebih\nlanjut.\n7. Obat dan Vaksin:\n• Anaphylaxis: Pemberian epinefrin\nintramuskular, oksigen, dan\nrujukan ke rumah sakit.\n• Vaksinasi: Pemberian vaksin untuk\npenyakit tertentu sesuai dengan\nkondisi pasien."},{"page":45,"text":"45\n\nTatalaksana kegawatdaruratan\nkhusus"},{"page":46,"text":"Tatalaksana kegawatdaruratan medis khusus 46\n\nPenilaian Luka Bakar Definisi luka bakar\n\nRule of nine Rule of nine Luka bakar adalah cedera pada kulit atau\nDewasa Anak-anak jaringan tubuh yang disebabkan oleh\npanas, bahan kimia, listrik, radiasi, atau\ngesekan. Luka bakar dapat\nmempengaruhi lapisan kulit yang\nberbeda, dan tingkat keparahannya\nbiasanya dikategorikan menjadi\nbeberapa derajat\n\nKedalaman warna bula Cap refil Sensasi Kesembuhan\nEpidermal Merah - Ada Ada Ya\nSuperficial dermal Merah muda pucat Kecil Ada Nyeri Ya\nMid dermal Merah muda gelap Ada Lambat +/- Biasanya\nDeep dermal Bercak merah tua +/- Tidak Tidak Tidak\nFull thickness Putih Tidak Tidak Tidak Tidak"},{"page":47,"text":"Tatalaksana kegawatdaruratan medis khusus 47\n\nSengatan Listrik\n\nVoltase Kulit Jaringan dalam Aritmia kardiak\nRendah Luka masuk dan Jarang Cardiac arredst\n(<1000V) Listrik keluar local mungkin\nRumah tangga\nTinggi (>1000V) Luka bakar Kerusakan pada otot Aliran translokal\nkabel tegangan masuk dan dengan menyebabkan\ntinggi keluar full rhabdomiolisis kerusakan\nthickness miokardium dan\nSindrom delayed arritmia\nkompartment\nPetir Luka bakar Perforasi membrana Henti napas,\nsuperficial atau timpani memerlukan\ndermal. Luka resusitasi\nkeluar pada kaki Kerusakan kornea kardiopulmonal"},{"page":48,"text":"48\nTatalaksana kegawatdaruratan medis khusus\n\nLuka Bakar\nBreathing\nAirway\n• Look: paparkan dada, lihat penurunan usaha\nnapas, sianosis, tracheal tug, penggunaan otot• Look: Nilai tanda klinis trauma inhalasi\notot aksesoris bantu napas, gangguan pada dengan luka bakar pada wajah, alis dan bulu\nnapas, kesimetrisan dan kedalaman napas, hidung terbakar, edema mukosa bibir dan\ndan lihat saturasi oksigen, lihat tanda intra oral, lidah bengkak, jika ragu lakukan\nkeracunan CO(pasien berwarna merah cherry, laringoskop lihat edema laring\ndan tidak bernapas), dan nilai eskar melingkar• Listen: suara napas berubah (hoarseness),\ndada untuk dilakukan escarotomi wheezing, gargling\n• Listen: sesak napas, tidak dapat berbicara,• Feel: penurunan atay tidaknya aliran udara\nsuara napas tambahan (hoarseness, stridor,• Tindakan: patensi jalan napas, jika ada 3\nwheezing) tanda terakhir pada pemeriksaan look maka\n• Feel: simetris pergerakan dan pengembangan lakukan definitive airway (intubasi). Jaga\ndinding dada, deviasi thrakea, krepitasi, dan Gerakan tulang servikal (gunakan collar\ndistensi abdominal neck)\n• Tindakan:\n• hati hati bila napas<10x/menit atau\n>30x/menit\n• Berikan high flow oksigen (12-15L/mnt)\nmenggunakan non rebreathing mask, nilai\nindikasi untuk dilakukan intubasi"},{"page":49,"text":"49\nTatalaksana kegawatdaruratan medis khusus\n\nLuka Bakar\n\nCirculation Disability\n• Look: Periksa tekanan darah, capillary refill time< 2detik • Menilai GCS\n(normal), lihat tanda hipovolemis atau eskar melingkar • Menilai derajat kesadaran dengan\ndari ekstremitas untuk dilakukan eskarotomi • Alert (sadar, waspada)\n• Feel: raba pulsasi nadi perifer, dan sentral (kuat atau • Vocal (respon rangsang suara)\nlemah) • Pain respon rangsang nyeri\n• Pasang IV 2 jalur diameter besar (Abocath no. 16) • Unresponsive (tidak memberi respon)\npada vena dalam (femoralis dan antebrachia) • Lihat respon pupil terhadap Cahaya pada kedua mata\nditempat Dimana tidak ada terbakar bila ada. Jika\ntidak memungkinkan lakukan vena seksi dengan\nmengambil vena yang besar\n• Ambil darah untuk pemeriksaan darah perifer Exposure\nlengkap, elektrolit, AGD dan laktat • Lepas semua aksesori, perhiasan, dan pakaian yang\n• Masukkan bolus cairan kristaloid (ringer laktat) untuk menutupi pasien\nmempertahankan denyut arteri radialis atau arteri • Miringkan posisi pasien untuk melihat sisi posterior tubuh\nulnaris • Jaga agar pasien tetap hangat\n• Mencari perdarahan dari system organ lain (toraks, • Menghitung luas luka bakar dengan metode rule of\nabdomen, pelvis dan femur) nine\n• Indikasi resusitasi cairan pada pasien dewasa >20%\nluas luka bakar dan pasien anak anak >10% luas luka\nbakar"},{"page":50,"text":"50\nTatalaksana kegawatdaruratan medis khusus\n\nLuka Bakar\nPemeriksaan Radiologis\nCairan, analgesia, penilaian dan tubes • Tulang belakang servical\nResusitasi cairan • Toraks\n• Panggul • Cairan inisial diberikan dengan menggunakan rumus\n• Pencitraan lain sesuai indikasi klinis Parkland yang dimodifikasi:\n• pada dewasa: 3-4mL kristaloid/kg berat badan/%\nluas luka bakar\n• Pada anak anak: 3-4mL kristaloid/kg berat badan/% Analgesia\nluas luka bakar ditambah maintenance dengan 5% • Nyeri : berikan morgin iv 0,05-0,1 mg/kg\nglokosa + 20 mmol KCl dalam larutan salin 0,45% • Titrasi untuk memperoleh efek\n•100ml/kg untuk 10 kg pertama\n•+50 ml/kg untuk 10 kg kedua\n•+20 ml/kg untuk 10 kg berikutnya\n• Kristaloid (larutan Hartmann atau ringer lactose) Pipa\nadalah cairan yang direkomendasikan • Pemasangan pipa nasogastric\n• Separuh cairan berdasarkan perhitungan diberikan • Insersi pipa nasogastric pada luka bakar luas (>10%\ndelapan jam pertama, sesanya diberikan selama pada anak anak, 20% pada dewasa), bila dijumpai\nenam belas jam berikutnya cedera penyerta, atau untuk melakukan dekompresi\n• Saat terjadinya trauma ditetapkan sebagai awal saluran cerna. Gastropararesis merupakan hal umum\nresusitasi cairan terjadi\n• Monitor keberhasilan resusitasi dengan : • Volley catheter untuk memantau urine output\n• Ukur produksi urin melalui catheter setiap jamnya.\nTarget urine output 0,5 – 1 ml/kgBB\n• EKG, pulsasi, tekanan darah, frekuesi pernapasan,\npulse oximetry, dan Analisa gas darah\n• Sesuaikan (titrasi) cairan resusitasi sesuai indikasi"},{"page":51,"text":"51\nTatalaksana kegawatdaruratan medis khusus\n\nGigitan hewan berbisa\n\nPenatalaksanaan Fase Lokal\nPertolongan awal yang direkomendasikan adalah dengan melakukan imobilisasi atau membuat\nbagian tubuh yang kena gigitan tidak bergerak karena Setiap gerakan atau kontraksi otot akan\nmeningkatkan penyerapan atau penyebaran venom\n\nJika fase sistemik maka penggunaan antivenom diperlukan dengan beberapa antivenom yang ada di\nIndonesia.\n1. Biosave Terbuat dari 3 jenis spesies yaitu Caloselesma rhodostoma/ular tanah, Bungarus\nfasciatus/welang, Naja spurtatix/kobra jawa. Dosis inisial 2 vial dicampurkan dalam Hartman solusion\natau cairan fisiologis seperti NaCl, RL, Asering tetesan 40 sampai 80 tetes atau habis 5 sampai 6 jam\ndan diulang setiap 6 jam sekali, tidak hipoalergi jadi butuh tes alergi sebelum diberikan dan saat\nalergi diberikan obat obat antihistamin dan corticosteroid serta adrenalin kalau ada anafilaksis,\ndisimpan dalam suhu 4 sampai 8 derajat celcius dan berupa liquid (vandemicum biofarma). Masa\nexp 2 tahun."},{"page":52,"text":"52\nTatalaksana kegawatdaruratan medis khusus\n\nTenggelam\n\nya Lakukan resusitasi Ada tanda henti jantung (Lihat langkah resusitasi pada survey primer)\n\ntidak\n\nRespirasi tidak adekuat\nTanda hipoksia sekalipun terdapat tanda\nya peningkatan konsentrasi oksigen Beri bantuan dukungan pernapasan\nTerlihat tanda peningkatan usaha bernapas (Rujuk bila perlu)\nVentilasi spontan yang inadekuat\nKeadaan kesadaran yagn abnormal\n\ntidak\n\nTanda dispnea ya Pantau untuk observasi lanjutan Usaha bernapas yang meningkat\nPertahankan Sp02 >95% Bunyi auskultasi pernapasan abnormal\nSpO2 <95%\n\ntidak\n\nPantau selama 8 jam setelah tenggelam\nJangan keluarkan pasien dengan cepat (24 jam)"},{"page":53,"text":"53\nTatalaksana kegawatdaruratan medis khusus\n\nPatah/Fraktur tulang\n\nBeberapa hal yang harus diperhatikan dalam penanganan fraktur yang tepat adalah\n1. Survey primer yang meliputi Airway, Breathing, Circulation,\n2. meminimalisir rasa nyeri\n3. mencegah cedera iskemia-reperfusi,\n4. menghilangkan dan mencegah sumber- sumber potensial kontaminasi.\n\nImobilisasi Fraktur\nTujuan Imobilisasi fraktur adalah meluruskan ekstrimitas yang cedera dalam posisi seanatomis\nmungkin dan mencegah gerakan yang berlebihan pada daerah fraktur. hal ini akan tercapai\ndengan melakukan traksi untuk meluruskan ekstrimitas dan dipertahankan dengan alat\nimobilisasi. pemakaian bidai yang benar akan membantu menghentikan pendarahan,\nmengurangi nyeri, dan mencegah kerusakan jaringan lunak lebih lanjut. Imobilisasi harus\nmencakup sendi diatas dan di bawah fraktur."},{"page":54,"text":"54\n\nTatalaksana Rujukan"},{"page":55,"text":"55\nTatalaksana Rujukan Pasien\n\n• Pasien dengan kondisi Stabil\n• Alat penunjang hidup terpasang\n• Selama proses rujukan didampingi oleh\npetugas medis terlatih\n• Form rujukan dan hasil pemeriksnaan\npenunjang lainnya\n\nPrioritas I\n\nPROSES RUJUKAN FASKES RUJUKAN\n\n• Petugas medis atau petugas\nKesehatan harus memperhatikan\nPrioritas tanda vital\nII • Jika ditemukan penurunan tanda\nvital, petugas harus segera\n• Pasien dengan kondisi Stabil melakukan evaluasi dan jika perlu\n• Alat penunjang hidup terpasang (Jika melakukan Resusitasi Jantung\nperlu secara klinis) Pulmonal (RJP)\n• Selama proses rujukan didampingi oleh\npetugas Kesehatan\n• Form rujukan dan hasil pemeriksnaan\npenunjang lainnya"},{"page":56,"text":"56\n\nManajemen /\nPengelolaan sediaan\nfarmasi dan BMHPBAB W\nFARMALKES Pelayanan Farmasi Klinis"},{"page":57,"text":"57\nPendahuluan\n\nPelayanan Kefarmasian di Puskesmas Pelayanan Kefarmasian merupakan\nmerupakan satu kesatuan yang tidak kegiatan yang terpadu dengan tujuan\nterpisahkan dari pelaksanaan upaya untuk mengidentifikasi, mencegah dan\nkesehatan, yang berperan penting dalam menyelesaikan masalah Obat dan\nmeningkatkan mutu pelayanan kesehatan masalah yang berhubungan dengan\nbagi masyarakat. Pelayanan Kefarmasian kesehatan. Tuntutan pasien dan\ndi Puskesmas harus mendukung tiga fungsi masyarakat akan peningkatan mutu\npokok Puskesmas, yaitu sebagai pusat Pelayanan Kefarmasian, mengharuskan\npenggerak pembangunan berwawasan adanya perluasan dari paradigma lama\nkesehatan, pusat pemberdayaan yang berorientasi kepada produk (drug\nmasyarakat, dan pusat pelayanan oriented) menjadi paradigma baru yang\nkesehatan strata pertama yang meliputi berorientasi pada pasien (patient\npelayanan kesehatan perorangan dan oriented) dengan filosofi Pelayanan\npelayanan kesehatan masyarakat. Kefarmasian (pharmaceutical care)."},{"page":58,"text":"58\n\nManajemen / Pengelolaan sediaan\nfarmasi dan BMHP"},{"page":59,"text":"59\n\n1. Tujuan pengelolaan dan sediaan Farmasi\n2. Alur siklus pengelolaan sediaan farmasi dan BMHP\n3. Seleksi dan Perencanaan\n4. Pengadaan dan permintaan\n5. Penerimaan\n6. PenyimpananPengelolaan\na.Penyimpanan khusus (penyimpanan vaksin)sediaan farmasi\n7. Pendistribusiandan BMHP\n8. Pemusnahan dan penarikan\n9. Pengendalian\n10.Pencaatan dan pelaporan\n11.Pemantauan dan evaluasi\na. Pemantauan dan evaluasi Khusus (VVM)"},{"page":60,"text":"60\n\n1. Meningkatkan aksesibilitas,\nketerjangkauan, ketersediaan Sediaan\nFarmasi, Alat Kesehatan, dan PKMK yang\naman, bermutu dan\nTujuan berkhasiat/bermanfaat secara efektif\nPengelolaan dan efisien;\nSediaan Farmasi\n2. Memberikan pelindungan kepadadan BMHP\nmasyarakat dalam memperoleh\nSediaan Farmasi, Alat Kesehatan, dan\nPKMK dengan menjamin keamanan,\nkhasiat/manfaat, dan mutu."},{"page":61,"text":"61\nPendahuluan\n\nPENGENDALIAN\n• Pengendalian ketersediaan melalui Sistem Informasi Kesehatan\nyang terintegrasi dengan Sistem Informasi Kesehatan Nasional\n• Pemerintah Pusat berwenang mengatur dan mengendalikan PEMILIHAN/SELEKSI\nharga Perbekalan Kesehatan, terutama Obat dan Alat\n• Mengacu pada Formularium, Daftar Alkes Kesehatan\nEsensial yang ditetapkan oleh Menteri\ndalam rangka pengendalian mutu dan\nbiaya pelayanan Kesehatan\nPELAYANAN KEFARMASIAN\n• Instalasi farmasi Rumah Sakit, instalasi farmasi\nPuskesmas, instalasi farmasi klinik, apotek PERENCANAAN\n• Dilaksanakan oleh Pusat dan Daerah\nPENDISTRIBUSIAN Berdasarkan Rencana Induk Bidang Kesehatan yang menggunakan\nSistem Informasi Kesehatan • Dilakukan oleh fasilitas pengelolaan\nkefarmasian, produsen, atau distributor\nPerbekalan Kesehatan secara berjenjang PENYEDIAAN\ndengan tetap menjamin mutu, jenis, jumlah,\ndan ketepatan waktu • Sesuai dengan kebutuhan pelayanan\nkesehatan yang dilakukan melalui\nPENYIMPANAN pengadaan, hibah, atau cara lain sesuai\ndengan ketentuan peraturan perundang-\nDIN (Digital Inventory National) • Sesuai dengan persyaratan dan spesifikasi undangan\nproduk untuk menjamin keamanan, mutu,\ndan khasiat"},{"page":62,"text":"62\nSeleksi dan Perencanaan\n\nSeleksi Sediaan Farmasi dan BMHP berdasarkan:\n• Formularium nasional, formularium fitofarmaka, dan\ndaftar alat kesehatan esensial\n• Standar pengobatan/pedoman diagnosa dan Diatur dalam bab VIII perbekalan\nterapi/panduan praktik klinik dan/atau PKMK; 2 Kesehatan, UU no 17 tahun 2023\n• Pola penyakit;\n• Pengobatan berbasis bukti;\n• Mutu;\n• Harga; dan/atau\n• Ketersediaan di pasaran 2 1 pencatatan dan\npelaporan rutin\nprogram penyakit\nLaporan Konsumsi 3\nRutin farmasi Pengisian Laporan Laporan Pemakaian dan\nPemakaian dan Lembar Lembar Permintaan Obat 3 Data mutasi Permintaan Obat (LPLPO). (LPLPO).\nsediaan farmasi\n\nRencana\nPengembangan\nfarmasi\n\nBentuk laporan permintaan dan\npemakaian, contoh: 1\nLaporan pemakaian obat TB dari SITB,\nlaporan penggunaan ART SIHA, dll"},{"page":63,"text":"63\nSeleksi dan Perencanaan\n\nContoh perhitungan dengan Metode Konsumsi untuk\nkebutuhan 1 (satu) tahun:\n\nSelama tahun 2023 (Januari – Desember) pemakaian parasetamol\ntablet sebanyak 25.000 tablet untuk pemakaian selama 10 (sepuluh)\nbulan. Pernah terjadi kekosongan selama 2 (dua) bulan. Sisa stok per\n31 Desember 2023 adalah 100 tablet.\n1. Pemakaian rata-rata Parasetamol tablet perbulan tahun 2023\nadalah 25.000 tablet : 10 ═ 2.500 tablet. Rumus : A= (B + C+ D)- E 2. Pemakaian Parasetamol tahun 2023 (12 bulan) = 2.500 tablet x 12\n= 30.000 tablet.\nA = Rencana kebutuhan 3. Pada umumnya stok pengaman berkisar antara 10% - 20%\nB = Pemakaian rata-rata x 12 bulan (termasuk untuk mengantisipasi kemungkinan kenaikan\nC = Stok pengaman 10 % – 20 % kunjungan). Misalkan berdasarkan evaluasi data diperkirakan\nD = Waktu tunggu (3 – 4 minggu) 20% = 20% x 30.000 tablet = 6.000 tablet.\nE = Sisa stok 4. Pada umumnya waktu tunggu berkisar antara 3 (tiga) s/d 4\n(empat) minggu. Pemakaian rata-rata Parasetamol tablet\nperminggu adalah 2.500 tablet : 4 = 625 tablet. Misalkan\nleadtime diperkirakan 3 minggu = 3 x 625 tablet = 1.875 tablet.\n5. Kebutuhan Parasetamol tahun 2023 adalah = b + c + d, yaitu :\n30.000 tablet + 6.000 tablet + 1.875 tablet = 37.875 tablet.\n6. Rencana kebutuhan Parasetamol untuk tahun 2024 adalah: hasil\nperhitungan kebutuhan (e) – sisa stok = 37.875 tablet – 100 tablet\n= 37.775 tablet ~ 378 box @ 100 tablet."},{"page":64,"text":"64\nPengadaan dan permintaan\n\nPersyaratan\n1. Laporan Penggunaan dan Lembar\nPermintaan Obat (LPLPO) rangkap 3\n(tiga)\nLPLPO lolos 2. Soft copy LPLPO di email ke akun dinas\nLaporan Pemakaian dan verifikasi/ ya Rekapitulasi kota/kab Lembar Permintaan Obat kebutuhan obat permintaan\n(LPLPO). terpenuhi Kabupaten\nSistem, Mekanisme dan Prosedur:\n1. Pemohon memberikan LPLPO ke\npetugas pengelola kefamasian\ntidak 2. Petugas pengelola kefarmasian\nmenerima dan memeriksa berkas LPLPO\ndari pemohon\n3. Pengelola kefarmasian mengisi jumlah Pengadaan Mandiri\nobat yang akan diberikan sesuai (Untuk Puskesmas BLUD)\ndengan stok obat yang ada di Instalasi menyesuaikan kondisi\nPuskesmas Farmasi Kabupaten\n4. Petugas memberikan LPLPO kepada\nkepala seksi kefarmasian untuk disetujui\n5. Petugas mememberikan LPLPO kepada\nInstalasi Farmasi agar permintaan\nPuskesmas dapat dilayani\nPengaturan perencanaan dan pengadaan obat berdasarkan Katalog\nElektronik bertujuan untuk menjamin transparansi, efektifitas, dan efisiensi 2 (dua) hari (Waktu Penyelesaian\ndari diterimanya LPLPO sampai proses perencanaan dan pengadaan obat melalui E-purchasing\nditeruskan ke Instalasi Farmasi\nberdasarkan Katalog Elektronik yang dilaksanakan oleh institusi Kabupaten)\npemerintah dan institusi swasta."},{"page":65,"text":"65\nPengadaan dan permintaan\n\nPengadaan Mandiri\nPengadaan obat secara mandiri oleh Puskesmas dilaksanakan sesuai ketentuan\nperaturan perundang-undangan. Puskesmas dapat melakukan pembelian obat ke\ndistributor. Dalam hal terjadi kekosongan persediaan dan kelangkaan di fasilitas\ndistribusi, Puskesmas dapat melakukan pembelian obat ke apotek. Pembelian dapat\ndilakukan dengan dua mekanisme :\n\nJika letak puskesmas jauh dari\napotek, puskesmas dapat Puskesmas dapat membeli obat menggunakan SP (Surat hanya untuk memenuhi Pemesanan), dimana obat yang kebutuhan obat yang diresepkan tidak tersedia di fasilitas distribusi dokter. dapat dibeli sebelumnya, sesuai\ndengan stok yang dibutuhkan."},{"page":66,"text":"66\nPenerimaan\n\nbesaran jumlah, ya Laporan tersedia cukup ya\nruangan Logistik farmasi kualitas barang penerimaan Alur Penyimpanan\npenyimpanan sesuai? barang\nlogistik?\n\ntidak tidak Penerimaan sediaan farmasi\ndan BMHP dari Instalasi Farmasi\nBuat laporan untuk Koordinasi dengan dinas Kabupaten/Kota (IFK) dan\nkonfirmasi/ untuk penyimpanan\npengembalian barang sementara sumber lainnya merupakan\nsalah satu kegiatan yang\ndilakukan oleh apoteker atau\ntenaga teknis kefarmasian (TTK)\nAlur pengembalian penanggungjawab ruang\nbarang farmasi di puskesmas.\nApoteker dan TTK\npenanggungjawab ruang\nfarmasi bertanggungjawab Pencatatan dan pelaporan Logistik farmasi\nuntuk memeriksa kesesuaian\njenis, jumlah dan mutu obat\npada dokumen penerimaan.\nPemeriksaan mutu meliputi\npemeriksaan label, kemasan\nPetugas penerima obat wajib melakukan pengecekan terhadap obat yang dan jika diperlukan bentuk fisik\ndiserahterimakan sesuai dengan isi dokumen dan ditandatangani oleh obat.\npetugas penerima serta diketahui oleh Kepala Puskesmas. Petugas penerima Setiap obat yang diterima harus\ndapat menolak apabila terdapat kekurangan dan kerusakan obat. Setiap dicatat jenis, jumlah dan\npenambahan obat dicatat dan dibukukan pada buku penerimaan obat dan tanggal kadaluarsanya dalam\nkartu stok. buku penerimaan dan kartu\nstok obat."},{"page":67,"text":"67\nPenerimaan\n\nPemeriksaan fisik obat pada saat Salep :\npenerimaan meliputi: • kemasan dan label\n• homogenitas\nTablet : • warna, konsistensi\n• kemasan dan label/bentuk fisik\ntablet (warna, keutuhan tablet, Injeksi :\nbasah, lengket) • kemasan dan label\n• kejernihan untuk larutan injeksi\nTablet salut : • homogenitas untuk serbuk injeksi\n• kemasan dan label • warna\n• bentuk fisik (warna, keutuhan tablet\nsalut, basah, lengket) Sirup kering :\n• kemasan dan label\nCairan : • warna, bau, penggumpalan\n• kemasan dan label\n• kejernihan, homogenitas Suppositoria :\n• warna, bau, bentuk • kemasan dan label\n• konsistensi\n• warna"},{"page":68,"text":"68\nPenyimpanan\n\nPencatatan dan Tujuan\npelaporan logistik Untuk memastikan obat dan/atau\nbahan obat di gudang disimpan\nsesuai dengan persyaratan yang\ntempat ya Butuh tempat ya Penyimpanan ditentukan oleh Principal dan penyimpanan Alur Penerimaan penyimpanan sesuai standard\nkhusus? berjalan baik? FEFO peraturan Pemerintah serta terjaga\n1 kualitasnya\n\ntidak tidak\nRuang Lingkup\nProses penyimpanan yang dilakukan\ntempat Pertimbangkan tidak untuk Laporan permintaan di gudang dan kontrol terhadap obat penyimpanan kordinasi penyimpanan perbaikan\ncukup? di gudang farmasi dinas penyimpanan dan/atau bahan obat yang\nkhusus disimpan, fasilitas infrastruktur untuk\npenyimpanan seperti bangunan\nya gudang, suhu/kelembaban, material\nhandling equipment, kartu obat\ndan/atau bahan obat dan stock\nopname\n1\nSistem penyimpanan dan penempatan obat dan/atau bahan obat hendaknya\nharus memperhatikan kemudahan dalam memonitor :\na. FEFO (First Expiry First Out) : obat dan/atau bahan obat yang baru diterima Tanggung Jawab\ndengan masa kadaluarsa yang lebih panjang ditempatkan di belakang obat Apoteker penanggung jawab\ndan/atau bahan obat yang kadaluarsanya lebih pendek bertanggung jawab terhadap\nb. FIFO (First In First Out) : obat dan/atau bahan obat yang baru diterima, pengelolaan obat di area\npenyimpanan. ditempatkan di belakang stock lama"},{"page":69,"text":"69\nPenyimpanan\n\nPenyimpanan dan pengelompokan obat dan/atau bahan obat di Gudang\nberdasarkan kategori,\n\nKategori Produk Penyimpanan\nSuhu +2oC s/d +8oC (suhu Produk yang tertulis Disimpan di Cold\ndingin) pada kemasan harus Storage atau Chiller\ndisimpan +2oC s/d +8\noC.\nProduk Injeksi, produk Disimpan pada ruang Suhu +15 oC s/d +25 oC\n(suhu kamar terkendali) jenis antibiotik, produk yang menggunakan Air\nyang bersalut gula, Condition (AC) dan\nproduk yang berbentuk harus di atas pallet.\nointment atau cream\ndengan kemasan tube.\nSuhu +26 oC Produk yang dapat Disimpan pada ruangan\ns/d +30 oC (suhu kamar) disimpan pada suhu dan harus di atas pallet.\nnormal.\nObat dan/atau bahan Produk recall, rusak dan Dikumpulkan dan\nobat Recall, Obat kadaluarsa yang tidak dipisahkan dari produk\ndan/atau bahan obat layak jual / pakai. komersil lainnya atau\nRusak dan Kadaluarsa disebut Karantina"},{"page":70,"text":"70\nPenyimpanan\n\nAspek khusus yang perlu diperhatikan\n\nObat High Obat Narkotika, Psikotropika Obat kegawatdaruratan\nAlert dan Prekursor medis\n\n• Obat High Alert adalah obat yang • Narkotika, Psikotropika, dan • Penyimpanan obat\nperlu diwaspadai karena dapat Prekursor Farmasi harus disimpan kegawatdaruratan medis harus\nmenyebabkan terjadinya kesalahan / dalam lemari khusus dan menjadi diperhatikan dari sisi kemudahan,\nkesalahan serius (sentinel event), dan tanggungjawab apoteker ketepatan dan kecepatan reaksi\nberisiko tinggi menyebabkan dampak penanggung jawab. bila terjadi kegawatdaruratan.\nyang tidak diinginkan (adverse • Lemari khusus tempat • Penetapan jenis obat\noutcome) penyimpanan narkotika, kegawatdaruratan medis termasuk\n1. Obat risiko tinggi, yaitu obat yang psikotropika dan prekusor farmasi antidot harus disepakati bersama\nbila terjadi kesalahan (error) dapat memiliki 2 (dua) buah kunci yang antara apoteker / tenaga farmasi,\nmengakibatkan kematian atau berbeda, satu kunci dipegang dokter dan perawat\nkecacatan seperti insulin, atau oleh apoteker penanggung\nobat antidiabetik oral. jawab, satu kunci lainnya\n2. Obat dengan nama, kemasan, dipegang oleh tenaga teknis\nlabel, penggunaan klinik kefarmasian/tenaga kesehatan\ntampak/kelihatan sama (look alike) lain yang dikuasakan.\ndan bunyi ucapan sama (sound\nalike) biasa disebut LASA, atau\ndisebut juga Nama Obat dan Rupa\nUcapan Mirip (NORUM).Contohnya\ntetrasiklin dan tetrakain.\n3. Elektrolit konsentrat seperti natrium\nklorida dengan konsentrasi lebih\ndari 0,9% dan magnesium sulfat\ndengan konsentrasi 20%, 40% atau\nlebih."},{"page":71,"text":"71\nPenyimpanan Khusus\n\nPenyimpanan Vaksin\n\n1. Vaksin merupakan bahan biologis yang mudah rusak\nsehingga harus disimpan pada suhu tertentu (pada\nsuhu 2oC - 8oC) pada cold room atau Vaccine\nRefrigerator.\n2. Suhu vaksin harus selalu dipantau dan dicatat pada\nkartu suhu yang letaknya berdekatan dengan tempat\npenyimpanan vaksin.\n3. Harus diambil langkah-langkah untuk memastikan rotasi\nstok sesuai dengan Vaccine Vial Monitor (VVM) dan\ntanggal kedaluwarsa vaksin (First Expired First Out /\nFEFO).\nMasa pemakaian vaksin sisa\n\nMasa Jenis Vaksin Keterangan Pemakaian\nPolio (OPV) 2 Minggu\nIPV 4 Minggu Cantumkan tanggal\nDT 4 Minggu pertama kali vaksin\ndigunakan Td 4 Minggu\nDPT-HB-Hib 4 Minggu\nBCG 3 Jam Cantumkan tanggal\nCampak, MR 6 Jam vaksin dilarutkan"},{"page":72,"text":"72\nPenyimpanan Khusus\n\nPenempatan lemari es Penyimpanan vaksin di lemari es ILR (Ice Lining\n- Jarak minimal antara Lemari es Refrigerator)\ndengan dinding belakang adalah ± - Suhu dalam antara 2 oC - 8 oC - Bagian\n10-15 cm atau sampai pintu lemari es bawah Lemari es tidak untuk menyimpan\ndapat dibuka vaksin.\n- Jarak minimal antara lemari es - Bagian bawah lemari es diletakkan cool\ndengan lemari es lainnya adalah ± 15 pack sebagai penahan dingin dan\ncm kestabilan suhu.\n- Lemari es tidak terkena sinar - Peletakan dus vaksin mempunyai jarak\nmatahari langsung. antara minimal 1-2 cm atau satu jari tangan.\n- Ruangan mempunyai sirkulasi udara - Vaksin Heat Sensitive (OPV, BCG, Campak,\nyang cukup (dapat menggunakan MR) diletakkan pada dekat atau menempel\nexhaust). pada dinding lemari es.\n- Setiap 1unit lemari es/freezer - Vaksin Freeze Sensitive (TT, DT, Hep B, DPTHB,\nmenggunakan hanya 1 stop kontak DPT-HB-Hib, Td, IPV) jangan menempel\nlistrik. dinding lemari es.\n\nPenyimpanan vaksin di freezer\n- Suhu freezer antara -150C s/d -250C\n- Bagian bawah lemari es diletakkan cold pack sebagai penahan dingin dan kestabilan suhu.\n- Peletakan dus vaksin mempunyai jarak antara minimal 1- 2 cm atau satu jari tangan.\n- Vaksin Polio disimpan dalam freezer."},{"page":73,"text":"73\nPenyimpanan Khusus\n\nAda dua bentuk pintu vaccine refrigerator Penyimpanan vaksin refrigerator bukaan\nyaitu bentuk pintu buka atas (top opening) depan\ndan buka dari depan (front opening) dan\nseperti pada gambar di bawah.\n\nPenyimpanan vaksin refrigerator bukaan atas"},{"page":74,"text":"74\nPendistribusian\n\nDiatur dalam bab VIII\nPencatatan dan perbekalan Kesehatan, UU\npelaporan logistik\nno 17 tahun 2023\n\nTersedia sarana ya Lengkapi surat\nGudang farmasi keluar dan transportasi\npuskesmas logistik yang barang logistik?\ndidistribusi 1. Pendistribusian Perbekalan\nKesehatan dilakukan oleh\ntidak fasilitas pengelolaan\nPengiriman kefarmasian, produsen, atau\nmenggunakan distributor Perbekalan\nrekanan Tempat ya Penyimpanan Kesehatan sesuai dengan\ntransportasi penyimpanan sesuai standard berjalan baik? ketentuan peraturan FEFO\nperundang-undangan.\n2. Pendistribusian Perbekalan\nKesehatan harus dilakukan\ntidak sesuai dengan cara distribusi\nyang baik.\n3. Fasilitas pengelolaan\nkefarmasian, produsen, atau\ndistributor Perbekalan\nPertimbangkan Laporan permintaan Kesehatan harus untuk kordinasi\nperbaikan penyimpanan di menyampaikan laporan\npenyimpanan\ngudang farmasi kegiatan pendistribusian sesuai khusus\ndinas dengan ketentuan peraturan\nperundang-undangan."},{"page":75,"text":"75\nPendistribusian\n\nLangkah-langkah distribusi obat :\n\n1. Menentukan frekuensi distribusi dengan mempertimbangkan :\na.Jarak distribusi.\nb.Biaya distribusi yang tersedia.\n2. Menentukan jumlah dan jenis obat yang diberikan dengan mempertimbangkan:\na.Pemakaian rata-rata per periode untuk setiap jenis obat.\nb.Sisa stok.\nc.Pola penyakit.\nd.Jumlah kunjungan di masing-masing jaringan pelayanan puskesmas.\n3. Melaksanakan penyerahan obat ke jaringan pelayanan puskesmas. Obat diserahkan\nbersama-sama dengan form LPLPO jaringan pelayanan puskesmas yang\nditandatangani oleh penanggungjawab jaringan pelayanan puskesmas dan pengelola\nobat puskesmas induk sebagai penanggungjawab pemberi obat."},{"page":76,"text":"76\nPemusnahan dan penarikan\n\nPencatatan dan Terdapat ya ya incinerator ya Gudang farmasi memerlukan pelaporan jumlah\nlogistic bekerja dengan puskesmas incenerator? barang yang di\nkedaluwarsa? baik? musnahkan\n\ntidak tidak tidak\n\nMonitoring rutin Pencatatan dan Barang ditarik dan di\nlogistic farmasi pelaporan jumlah rujuk kepada unit Laporan permintaan perbaikan\nbarang yang di yang tersedia penyimpanan khusus\nmusnahkan incinerator aktif\n\nTahapan pemusnahan Sediaan Farmasi dan Bahan Medis Habis Pakai terdiri dari:\n1. membuat daftar Sediaan Farmasi dan Bahan Medis Habis Pakai yang akan dimusnahkan;\n2. menyiapkan Berita Acara Pemusnahan;\n3. mengoordinasikan jadwal, metode dan tempat pemusnahan kepada pihak terkait;\n4. menyiapkan tempat pemusnahan; dan\n5. melakukan pemusnahan disesuaikan dengan jenis dan bentuksediaan serta peraturan yang berlaku."},{"page":77,"text":"77\nPemusnahan dan penarikan\n\nPemusnahan dilakukan untuk Sediaan Farmasi\ndan Bahan Medis Habis Pakai bila:\n\n• Produk tidak memenuhi persyaratan mutu;\n• Telah kadaluwarsa;\n• Tidak memenuhi syarat untuk dipergunakan dalam\npelayanan kesehatan atau kepentingan ilmu\npengetahuan; dan/atau\n• Dicabut izin edarnya"},{"page":78,"text":"78\nPengendalian\n\nTujuannya adalah agar tidak\nterjadi kelebihan dan\nlogistic ya Alur Pemantauan\nPencatatan dan Kesehatan dan evaluasi pelaporan logistik kekosongan Obat di unit tercukupi? Pengelolaan\npelayanan kesehatan dasar.\ntidak\ntidak\n\nPengendalian Sediaan\n\nPencatatan ya laporan kehilangan, Farmasi terdiri dari: pelaporan rusak atau\nberjalan baik kedaluwarsa terjadi\n1. Pengendalian persediaan;\n2. Pengendalian\ntidak ya\npenggunaan; dan\n3. Penanganan Sediaan\nPeningkatan Perbaikan\nkapasitas petugas Pencatatan dan Farmasi hilang, rusak, dan\nfarmasi pelaporan logistik\nkadaluwarsa."},{"page":79,"text":"79\nPencatatan dan pelaporan\n\nTujuan pencatatan dan\n\nya\npencatatan dan pencatatan berbasis sistem validasi ya pelaporan adalah:\npelaporan rutin elektronik/aplikasi? data berjalan\nbaik? 1. Bukti bahwa 1\npengelolaan Sediaan\ntidak tidak\nFarmasi dan Bahan\n\nDokumen Medis Habis Pakai telah\nlogistic Kendala dengan tidak Alur Pemantauan\ntercatat dan infrastruktur dan pengelolaan tersimpan layanan? dilakukan; ya\nbaik?\n2. Sumber data untuk\n1 tidak ya\nSistem pencatatan melakukan pengaturan\npada kartu\ngudang dilakukan dan pengendalian; dan\nPelatian dan\noleh Petugas peningkatan Mekanisme\nLogistik/Gudang kapasitas manajemen 3. Sumber data untuk perbaikan\ndengan manajemen logistic infrastruktur\nmemperhatikan : petugas farmasi pembuatan laporan.\na. Nama obat\ndan/atau 4. Pencatatan stok\nbahan obat\nb. Tanggal dilakukan pada saat\nc. Nomor\nobat diterima/disimpan dokumen\nd. Kuantitas dan pada saat obate. Nomor bets\ndan Expired diambil/disalurkan Date"},{"page":80,"text":"80\nPemantauan dan evaluasian pengelolaan\n\nPemantauan dan evaluasi\npengelolaan Sediaan Farmasi dan\nBahan Medis Habis Pakai dilakukan\nsecara periodik dengan tujuan\nada untuk: ya ada kendala ya\nAlur pencatatan dan kendala infrastruktur Alur permintaan\npelaporan logistik manajemen fasmasi? perbaikan infrastruktur 1. Mengendalikan dan\nfarmasi?\nmenghindari terjadinya\nkesalahan dalam pengelolaan\ntidak tidak\nSediaan Farmasi dan Bahan\nEvaluasi dan\nmonitoring rutin Medis Habis Pakai sehingga\nprogram kesehatan\ndapat menjaga kualitas\nmaupun pemerataan\nRencana\npeningkatan pelayanan;\nkapasitas rutin\npetugas farmasi 2. Memperbaiki secara terus-\nmenerus pengelolaan Sediaan\nFarmasi dan Bahan Medis Habis\nPakai; dan\n3. Memberikan penilaian\nterhadap capaian kinerja\npengelolaan."},{"page":81,"text":"81\nPemantauan dan evaluasian pengelolaan\n\n1. Kepala Logistik/Gudang harus memperhatikan\nbangunan/ruangan untuk penyimpanan (gudang),\nmeliputi : kondisi penyimpanan yang baik, bersih,\nbebas dari banjir, bebas dari sampah, debu, unggas,\nserangga, hama, kebocoran atau pecahan,\nmikrorganisme dan kontaminasi silang, memiliki\nsirkulasi udara yang baik serta penerangan cukup.\n2. Pemeliharaan secara berkala dilakukan untuk\nmenjamin fasilitas penyimpanan selalu dalam kondisi\nyang baik. Program pemeliharaan area dan fasilitas\npenyimpanan dibuat secara tertulis yang merinci\nfrekuensi pembersihan dan metode yang dipakai.\n3. Area penyimpanan dilengkapi dengan alat\nmonitoring suhu dan kelembaban yang telah\ndikalibrasi.\n4. Suhu area penyimpanan diperiksa serta dimonitor\ntiga kali sehari oleh Petugas Logistik/Gudang dan\ndicatat pada kartu monitor suhu sesuai dengan SOP\nPemetaan Dan Pemantauan Suhu Area\nPenyimpanan untuk menjaga semua bagian dari\narea penyimpanan tetap dalam suhu yang\nditentukan"},{"page":82,"text":"82\nPemantauan dan evaluasian pengelolaan khusus\n\nVaccine Vial Monitor (VVM)\nDalam pelaksanaan pelayanan imunisasi, vaksin rentan terpapar suhu yang berlebihan. Untuk itu,\nsejak tahun 1979 WHO bekerja sama dengan beberapa lembaga mulai mengembangkan VVM\n(Vaccine Vial Monitor) sebagai indikator rantai dingin vaksin.\n\nKeterangan gambar (cara Membaca VVM):\nA. Segi empat lebih terang dari lingkaran. Vaksin dapat digunakan\nbila belum kedaluwarsa.\nB. Segi empat berubah gelap tapi lebih terangdari lingkaran.\nGunakan vaksin SEGERA bila belum kedaluwarsa.\nC. Batas untuk tidak digunakan lagi: Segi empat berwarna sama\ndengan lingkaran. JANGAN GUNAKAN VAKSIN.\nD. Melewati Batas Buang: Segi empat lebih gelap dari lingkaran.\nJANGAN GUNAKAN VAKSIN."},{"page":83,"text":"83\n\nPelayanan Farmasi Klinis"},{"page":84,"text":"84\n\n1. Pelayanan dan pengelolaan farmasi\nberjalan dengan baik\n2. Memberikan mekanisme peningkatan\nkapasitas penanggung jawab faskes\nTujuan dalam persiapan menghadapi pra krisis\n3. Mekanisme edukasi dan promosiPelayanan\nFarmasi Klinis Kesehatan tentang penggunaan obat\nyang baik dan benar untuk Masyarakat\n4. Memantau kualitas obat yang beredar\ndi Masyarakat yang dikelola oleh faskes\nmaupun swasta"},{"page":85,"text":"85\nKegiatan Pelayanan Farmasi Klinis\n\nPengkajian dan pelayanan\nresep merupakan suatu Dispensing Sediaan Farmasi, Pelayanan Informasi Obat (PIO) merupakan kegiatan\nrangkaian kegiatan yang Alat Kesehatan, dan PKMK penyediaan dan pemberian informasi dan rekomendasi obat Pelayanan yang dilakukan oleh apoteker kepada dokter, perawat, profesimeliputi penerimaan, disertai pemberian informasi\nInformasi kesehatan lainnya serta pasien dan pihak lain di luar Puskesmas.pemeriksaan ketersediaan,\npengkajian resep, penyiapan Obat\ntermasuk peracikan obat, dan\npenyerahan disertai pemberian\ninformasi. Pengkajian dan Pengkajian resep, Konseling obat merupakan salah satu metodepelayanan resep dilakukan penyerahan Obat, edukasi pengobatan secara tatap muka atauuntuk semua resep yang masuk dan pemberian wawancara dengan pasien dan/atau keluarganya\ntanpa kriteria khusus pasien informasi Obat Konseling yang bertujuan untuk meningkatkan pengetahuan\ndan pemahaman pasien yang membuat terjadi\nperubahan perilaku dalam penggunaan obat.\nMerupakan kegiatan untuk\nmengevaluasi penggunaan\nobat untuk menjamin obat Farmakovigilans Pemantauan Terapi\nyang digunakan sesuai indikasi, Obat (PTO)\nefektif, aman dan terjangkau\n(rasional).\nHome Pharmacy\nCare (Pelayanan Pemantauan danPelayanan dilakukan oleh apoteker yg\nKefarmasian di pelaporan efek sampingkompeten, memberikan pelayanan\nuntuk meningkatkan kesembuhan dan Rumah) Obat\nkesehatan serta pencegahan\nkomplikasi, bersifat rahasia dan Visite (khusus Puskesmaspersetujuan pasien, melakukan telaah rawat inap)atas penata laksanaan terapi,\nmemelihara hubungan dengan tim Visite merupakan kegiatan kunjungan ke pasien rawat inap yang dilakukan apoteker secara mandiri atau bersama\nkesehatan tim tenaga kesehatan untuk mengamati kondisi klinis pasien secara langsung dan mengkaji masalah terkait obat,\nmemantau terapi obat dan reaksi obat yang tidak dikehendaki (ROTD)."},{"page":86,"text":"86\nPengkajian dan Pelayanan Resep\n\nTujuan\nPelaksana Kegiatan pengkajian dan\nPengkajian dan pelayanan pelayanan
