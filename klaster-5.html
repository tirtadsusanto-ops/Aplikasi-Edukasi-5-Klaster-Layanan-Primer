T2025"],"enrichmentUnit":"K5-PPT-09","sourceLocator":"Slide 113–120"},{"text":"Catatan sumber dan keselamatan: Slide 114 menumpuk salinan teks dan nomor halaman sumber; gunakan uraian yang lebih terstruktur pada slide 115–116. Definisi polifarmasi pada slide 114 tidak konsisten dengan rumusan banyak obat pada slide 118; jangan mengajarkannya sebagai definisi tunggal.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-09","sourceLocator":"Slide 113–120"},{"text":"Farmakovigilans, PTO dan evaluasi penggunaan obat. Tim membedakan dugaan efek samping obat dari masalah efektivitas, ketidaktersediaan, ketidakmampuan membeli, atau hambatan penggunaan. Petugas mencatat obat dan waktu penggunaan, keluhan atau perubahan keadaan, serta informasi yang diperlukan untuk evaluasi, kemudian segera mengomunikasikan masalah kepada tenaga penanggung jawab sesuai risiko.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-10","sourceLocator":"Slide 121–127"},{"text":"Farmakovigilans, PTO dan evaluasi penggunaan obat. Sumber menjelaskan dokumentasi farmakovigilans melalui jalur elektronik atau formulir manual bila akses terhambat, sementara PTO menilai kebutuhan individual dan rekomendasi penyelesaian masalah. Evaluasi penggunaan obat menilai pola berdasarkan kriteria prioritas serta standar pembanding untuk perbaikan layanan; ketiga kegiatan tidak disamakan dengan menghitung jumlah resep.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-10","sourceLocator":"Slide 121–127"},{"text":"Kasus penerapan: Pasien mengalami keluhan baru setelah perubahan obat, tidak dapat membeli salah satu obat, dan Puskesmas belum dapat mengakses sistem pelaporan elektronik. Respons yang diharapkan: Menilai kebutuhan penanganan segera dan mengomunikasikan dugaan masalah obat. Menyiapkan dokumentasi manual yang dapat ditindaklanjuti serta memisahkan hambatan akses dari dugaan efek samping.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-10","sourceLocator":"Slide 121–127"},{"text":"Batas profesi: Petugas tidak menghentikan atau mengganti terapi di luar kewenangan; keputusan keselamatan segera mengikuti penilaian klinis.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-10","sourceLocator":"Slide 121–127"},{"text":"Catatan sumber dan keselamatan: Alamat dan mekanisme sistem pelaporan pada slide 122 perlu dikonfirmasi pada pelaksanaan; jangan menganggap pembukaan laman berarti laporan diterima.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-10","sourceLocator":"Slide 121–127"},{"text":"Home pharmacy care dan program rujuk balik. Pelayanan kefarmasian di rumah menilai penggunaan obat nyata, pemahaman pasien, kemampuan pendamping, penyimpanan, akses dan masalah yang memerlukan komunikasi kepada tim. Tim membuat rencana tindak lanjut yang sesuai tujuan pasien; pendamping tidak diasumsikan mampu hanya karena berada di rumah yang sama.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-11","sourceLocator":"Slide 128–136"},{"text":"Home pharmacy care dan program rujuk balik. Rujuk balik memerlukan kondisi yang dinilai stabil oleh penanggung jawab layanan lanjut serta kemampuan FKTP penerima untuk meneruskan asuhan. Dokumen, rencana obat, pemantauan, serta respons bila kondisi memburuk perlu diterima dan ditindaklanjuti. Sumber menjelaskan beberapa model kerja sama obat PRB; pengelola membedakan tanggung jawab apotek, depo, serta fasilitas yang menjadi penghubung agar ketersediaan dan mutasi obat dapat ditelusuri.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-11","sourceLocator":"Slide 128–136"},{"text":"Home pharmacy care dan program rujuk balik. Dalam model kerja sama langsung, apotek mengelola obat PRB termasuk perencanaan, pengadaan, penyimpanan, pencatatan dan penyiapan. Model depo menempatkan persediaan di FKTP: apotek merencanakan serta menyediakan obat, sedangkan FKTP menjaga stok depo, menyiapkan dan menyerahkan obat serta melaporkan mutasi sesuai kerja sama. Model hub-and-spoke menempatkan fasilitas BLUD sebagai penghubung penyediaan untuk fasilitas lain; pengelola menelaah kesiapan pembiayaan, tanggung jawab dan ketertelusuran sebelum memilih model.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-11","sourceLocator":"Slide 128–136"},{"text":"Kasus penerapan: Pasien kembali dari rumah sakit dengan surat rujuk balik, tetapi obat tidak tersedia pada titik pelayanan dan keluarga tidak memahami jadwal pemantauan. Respons yang diharapkan: Memastikan penerimaan rencana klinis, mengklarifikasi akses obat melalui model kerja sama yang berlaku, serta menyepakati tindak lanjut. Mempertahankan hubungan dengan fasilitas perujuk dan bantuan caregiver.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-11","sourceLocator":"Slide 128–136"},{"text":"Batas profesi: Penetapan stabil, regimen dan kelayakan PRB dilakukan oleh tenaga/fasilitas berwenang; model bisnis dalam slide tidak otomatis menjadi kontrak atau ketentuan pembiayaan lokal.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-11","sourceLocator":"Slide 128–136"},{"text":"Catatan sumber dan keselamatan: Daftar obat geriatrik dan ambang pada slide 129 perlu penelaahan sumber terkini sebelum dipakai sebagai daftar larangan atau kunci ujian. Daftar penyakit, syarat stabil dan model kerja sama pada slide 131–136 perlu dicocokkan dengan ketentuan program yang berlaku.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-11","sourceLocator":"Slide 128–136"}]},{"id":"k5m2-s12","title":"Pemeriksaan khusus dan rujukan spesimen","paragraphs":[{"text":"Pedoman memuat pemeriksaan malaria, HIV, pemeriksaan molekuler, serta pengambilan berbagai spesimen seperti dahak, darah, tinja, dan usap. Petugas hanya melakukan tindakan sesuai kompetensi dan mengikuti prosedur pemeriksaan yang tepat; langkah teknis satu jenis spesimen tidak diterapkan otomatis kepada semua pemeriksaan.","refs":["LK2024"]},{"text":"Pada rujukan, petugas memastikan kesesuaian permintaan, identitas, persyaratan penyimpanan, lapisan pengemasan, dokumen, serta koordinasi penerima. Petugas menindaklanjuti penolakan atau ketidaksesuaian spesimen melalui komunikasi yang jelas agar pasien tidak hilang dari alur pelayanan.","refs":["LK2024"]},{"text":"Alur spesimen klinis, sampel lingkungan dan rujukan aman. Pada alur klinis, permintaan pemeriksaan dari tenaga berwenang terhubung dengan identitas pasien, pengambilan spesimen, pemeriksaan, validasi dan penyampaian hasil untuk keputusan tindak lanjut. Pada alur sampel lingkungan, sanitarian menyiapkan informasi pengambilan dan jenis sampel serta berkoordinasi dengan laboratorium dan pihak yang menindaklanjuti hasil. Pencatatan manual yang diperlukan saat sistem elektronik tidak tersedia tetap menjaga ketertelusuran.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-13","sourceLocator":"Slide 152–160"},{"text":"Alur spesimen klinis, sampel lingkungan dan rujukan aman. Rujukan dapat menggunakan jejaring horizontal atau vertikal sesuai kemampuan pemeriksaan. Pengirim memastikan kategori bahan, identitas, persyaratan spesimen, pengemasan, dokumen dan koordinasi kurir-penerima. Tenaga yang menerima hasil memastikan hasil telah divalidasi dan menyampaikan tindak lanjut kepada klaster terkait; pengiriman paket atau hasil bukan akhir seluruh pelayanan.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-13","sourceLocator":"Slide 152–160"},{"text":"Alur spesimen klinis, sampel lingkungan dan rujukan aman. Pada penelusuran pengemasan, peserta memeriksa adanya wadah primer yang aman, bahan penyerap dan pelindung yang sesuai, wadah sekunder yang tertutup, serta wadah luar yang kokoh dengan dokumen dan penandaan yang benar. Pengecekan mengikuti kategori bahan dan prosedur yang ditetapkan oleh tenaga kompeten; daftar periksa pembelajaran tidak menggantikan pelatihan pengemasan atau ketentuan transportasi bahan infeksius.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-13","sourceLocator":"Slide 152–160"},{"text":"Kasus penerapan: Hasil sampel air sudah dikirim ke Puskesmas, tetapi penanggung jawab intervensi lingkungan tidak menerima informasi; spesimen pasien lain memerlukan rujukan. Respons yang diharapkan: Memisahkan jalur klinis dan lingkungan serta menetapkan penerima hasil dan tindak lanjut. Memastikan kesiapan rujukan dan ketertelusuran dokumen serta sampel.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-13","sourceLocator":"Slide 152–160"},{"text":"Batas profesi: Pengambilan, pengemasan bahan infeksius dan penetapan kategori pengiriman memerlukan tenaga yang kompeten; kerangka tidak melatih pengiriman bahan berbahaya hanya melalui kuis.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-13","sourceLocator":"Slide 152–160"},{"text":"Catatan sumber dan keselamatan: Catatan pembicara slide 158 merupakan instruksi editorial untuk menambah kotak tindak lanjut; catatan tersebut tidak dianggap sudah tercetak sebagai ketentuan pada gambar. Detail klasifikasi kategori A/B, nomor UN dan dry ice pada slide 159–160 harus mengikuti persyaratan pengiriman yang berlaku.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-13","sourceLocator":"Slide 152–160"}]},{"id":"k5m2-s13","title":"Evaluasi farmasi dan pemulihan mutu pelayanan","paragraphs":[{"text":"Pengelola menelusuri penarikan atau pemusnahan sediaan melalui prosedur dan dokumentasi yang dapat diaudit. Evaluasi persediaan, kedaluwarsa, ketidaksesuaian, penggunaan, serta distribusi menjadi dasar perbaikan dukungan farmasi.","refs":["LK2024"]},{"text":"Pengelola meninjau temuan mutu laboratorium dan memperbaiki penyebab ketidaksesuaian sebelum mempertahankan proses yang tidak aman. Tim menggunakan data untuk mengubah tindakan dan menilai kembali hasil perbaikan, bukan hanya untuk memenuhi jumlah laporan.","refs":["LK2024"]},{"text":"Siklus sediaan farmasi, BMHP dan PKMK. Pengelolaan sumber baru mencakup sediaan farmasi, BMHP, serta pangan olahan untuk keperluan medis khusus atau PKMK. Pengelola menautkan pemilihan dan perencanaan dengan kebutuhan pelayanan, penggunaan, stok yang tersedia, waktu tunggu, serta usulan unit. Penerimaan memeriksa kesesuaian jenis, jumlah, mutu, dokumen dan kedaluwarsa; ketidaksesuaian dicatat serta ditindaklanjuti.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-06","sourceLocator":"Slide 77–88, 93–103"},{"text":"Siklus sediaan farmasi, BMHP dan PKMK. Petugas menjaga ketertelusuran penerimaan, pengeluaran, mutasi, dan kondisi stok. Penyimpanan mengikuti persyaratan produk dengan rotasi stok yang sesuai, pemisahan barang tidak layak, serta pengendalian risiko obat tertentu. Evaluasi berkala menggunakan temuan selisih, kekosongan, kerusakan dan kedaluwarsa untuk perbaikan; penarikan dan pemusnahan mengikuti mekanisme yang berlaku.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-06","sourceLocator":"Slide 77–88, 93–103"},{"text":"Kasus penerapan: Stok PKMK dan obat tertentu menumpuk, beberapa unit mengalami kekosongan, sedangkan catatan penerimaan tidak cocok dengan stok fisik. Respons yang diharapkan: Mengklarifikasi kebutuhan serta mutasi dan ketidaksesuaian stok sebelum rencana baru. Menetapkan penanggung jawab pengendalian, pelaporan dan tindak lanjut.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-06","sourceLocator":"Slide 77–88, 93–103"},{"text":"Batas profesi: Pengkajian atau substitusi terapi melibatkan tenaga berwenang; staf logistik tidak mengganti regimen pasien.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-06","sourceLocator":"Slide 77–88, 93–103"},{"text":"Catatan sumber dan keselamatan: Rumus slide 83 menuliskan stok pengaman sebagai persen dan waktu tunggu sebagai minggu; contoh hitung harus terlebih dahulu menyamakan satuan menjadi jumlah kebutuhan, bukan menjumlahkan persen/minggu langsung dengan unit obat. Slide 102–103 tersembunyi; pengendalian tetap dicatat sebagai isi berkas, bukan otomatis kebijakan final.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-06","sourceLocator":"Slide 77–88, 93–103"},{"text":"Mutu laboratorium pada tahap pra analitik, analitik dan pasca analitik. Pengendalian mutu internal mencakup ketepatan identifikasi dan permintaan, pengambilan serta penanganan spesimen, kesiapan alat dan bahan kontrol, sampai penyalinan, identitas penerima, keterbacaan dan ketepatan penyampaian hasil. Temuan mutu harus dihubungkan dengan tindakan koreksi dan penilaian apakah hasil perbaikan sudah memadai.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-14","sourceLocator":"Slide 162–168"},{"text":"Mutu laboratorium pada tahap pra analitik, analitik dan pasca analitik. Pemantapan mutu eksternal menilai kinerja melalui mekanisme seperti uji profisiensi, uji banding atau uji silang dan menghasilkan tindak lanjut perbaikan. Peserta membedakan kegiatan tersebut dari pemeriksaan bahan kontrol dan pengendalian proses sehari-hari di dalam laboratorium. Kerangka memisahkan prinsip mutu yang dapat dipelajari dari pernyataan kewajiban dalam rancangan regulasi pada sumber; angka frekuensi tidak dianggap sah hanya karena tampil pada slide.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-14","sourceLocator":"Slide 162–168"},{"text":"Kasus penerapan: Hasil kontrol laboratorium berada di luar batas yang dapat diterima, sementara laporan sudah hampir dikirim kepada pasien. Respons yang diharapkan: Mengeskalasi temuan kepada penanggung jawab dan mengikuti prosedur pengendalian hasil. Menelusuri sebab serta mencatat koreksi dan verifikasi sebelum proses diteruskan secara aman.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-14","sourceLocator":"Slide 162–168"},{"text":"Batas profesi: Keputusan menerima hasil pemeriksaan, mengulang analisis dan mengeluarkan hasil mengikuti penanggung jawab serta prosedur laboratorium.","refs":["LK2024","LKPPT2025"],"enrichmentUnit":"K5-PPT-14","sourceLocator":"Slide 162–168"},{"text":"Catatan sumber dan keselamatan: Slide 167–168 tersembunyi dan secara eksplisit bertajuk RPMK; verifikasi status aturan sebelum menggunakan kata wajib atau angka dua kali setahun sebagai ketentuan nasional.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-14","sourceLocator":"Slide 162–168"}]},{"id":"k5m2-s14","title":"Standar profesi dan lima tahap pencegahan","paragraphs":[{"text":"Standar kompetensi KKLP tahun 2026 menjelaskan pelayanan transisi dan paliatif menurut jenjang, serta menghubungkan rehabilitasi dengan fungsi, dukungan keluarga, dan layanan komunitas. Materi ini membedakan kompetensi dokter tersebut dari keputusan pembelajaran staf; kelulusan kuis tidak memberikan kewenangan tindakan atau jenjang spesialis baru.","refs":["KMK6312026"]},{"text":"Lima tahap pencegahan meliputi promosi kesehatan, perlindungan khusus, diagnosis dini dan pengobatan tepat, pembatasan kecacatan, serta rehabilitasi. Tim dapat menghubungkan beberapa tahap dalam satu pasien; kelima tahap tersebut bukan padanan satu per satu bagi aplikasi Klaster 1 sampai Klaster 5.","refs":["KMK6312026","ILP2023"]},{"text":"Standar memuat asesmen keluarga dasar pada jenjang spesialis, sedangkan uraian FOMC memperdalam beban pengasuhan dan pertemuan keluarga. Staf mengidentifikasi kebutuhan, mendokumentasikan hambatan yang relevan, dan mengoordinasikan penilaian lebih lanjut sesuai penugasan serta kewenangannya.","refs":["KMK6312026"]},{"text":"Kriteria tindak lanjut dalam tujuh hari pada halaman 69 berlaku dalam konteks pasien rawat inap yang kembali ke FKTP pada standar kinerja dokter yang bersangkutan. Materi ini tidak mengubah kriteria tersebut menjadi jadwal seragam bagi semua pasien, indikator wajib baru seluruh staf, atau nilai kelulusan aplikasi.","refs":["KMK6312026"]}]},{"id":"k5m2-s15","title":"Koordinasi dan keselamatan pelayanan modalitas fisik","paragraphs":[{"text":"Pengenalan modalitas fisik dan keselamatan terapi. Sumber baru memperkenalkan infrared, stimulasi listrik TENS, serta ultrasound sebagai modalitas yang dibahas dalam bagian fisioterapi. Dalam pembelajaran staf umum, materi menekankan penilaian oleh tenaga kompeten, penjelasan tujuan dan persetujuan, pemeriksaan area serta kontraindikasi, pemantauan kenyamanan, pelaporan keluhan saat tindakan, dan evaluasi setelah terapi.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-20","sourceLocator":"Slide 206–209"},{"text":"Pengenalan modalitas fisik dan keselamatan terapi. Kerangka tidak menyalin seluruh daftar indikasi, frekuensi, intensitas atau waktu menjadi protokol universal. Penanggung jawab terlebih dahulu memeriksa kesesuaian sumber dan prosedur alat. Label yang tidak konsisten pada slide 207 dibedakan dari nama modalitasnya; daftar luas manfaat pada slide 206–208 tidak diperlakukan sebagai bukti bahwa semua keluhan akan membaik dengan modalitas yang sama.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-20","sourceLocator":"Slide 206–209"},{"text":"Kasus penerapan: Staf membaca label Infrared TENS lalu hendak memilih alat, menetapkan dosis dan mengerjakan tindakan hanya berdasarkan slide. Respons yang diharapkan: Mengidentifikasi ketidakkonsistenan label dan meminta klarifikasi tenaga berwenang. Mengarahkan peserta pada asesmen serta SOP terverifikasi, bukan menetapkan terapi sendiri.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-20","sourceLocator":"Slide 206–209"},{"text":"Batas profesi: Pengoperasian alat, pemilihan modalitas, indikasi dan dosis memerlukan kompetensi serta prosedur yang sesuai; materi ini menilai pengenalan dan eskalasi.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-20","sourceLocator":"Slide 206–209"},{"text":"Catatan sumber dan keselamatan: Slide 207 menyebut TENS sebagai terapi infrared dan mengulang istilah infrared dalam prosedur. Slide 206–209 memakai judul Layanan Fisiologis; nomenklatur dan rincian klinis perlu penelaahan. Slide 208 menyatakan manfaat serta efek samping dengan rumusan umum tanpa rujukan penelitian yang cukup pada slide; jangan membuat klaim efektivitas pasti. Slide 209 menyebut waktu 7–10 menit; jangan menerapkannya kepada seluruh pasien atau alat tanpa penetapan profesional.","refs":["LKPPT2025"],"enrichmentUnit":"K5-PPT-20","sourceLocator":"Slide 206–209"}]}],"legacy":[{"id":"pedoman-II-27","title":"Gigi dan mulut di sepanjang siklus hidup","body":"<p>Pelayanan gigi dan mulut menggabungkan konseling, pencegahan, skrining, pemeriksaan, penanganan, rujukan, serta pencatatan. Pedoman membedakan kebutuhan ibu hamil, bayi/balita, anak sekolah, dewasa, dan lansia. Kebutuhan rongga mulut dapat memengaruhi makan, komunikasi, dan fungsi sehari-hari.<\/p>\n<p>Petugas menggunakan anamnesis, pemeriksaan visual/instrumen, dan odontogram sesuai kewenangan. Hasil yang dapat ditangani dilayani; kebutuhan di luar kemampuan dirujuk dan dipantau melalui rujuk balik. Temuan yang memerlukan penanganan segera tidak menunggu jadwal skrining rutin.<\/p>\n<p>Edukasi mencakup kebersihan gigi, penggunaan pasta gigi berfluorida, perilaku makan, tidak merokok, dan pemeriksaan berkala menurut pedoman. Pencatatan meliputi kegiatan di dalam maupun luar gedung. Pelayanan gigi terhubung dengan klaster siklus hidup dan tidak menghapus kebutuhan skrining lainnya.<\/p>\n<p><b>Penerapan:<\/b> pasien datang untuk keluhan gigi. Tim menangani kebutuhan giginya dan mengatur pemeriksaan lain yang sesuai usia dan kondisi, pada kunjungan yang sama atau waktu yang disepakati. Tim tidak menganggap pasien hanya boleh memperoleh satu jenis layanan.<\/p>","refs":["LK2024"]},{"id":"pedoman-II-28","title":"Triase, survei awal, dan rujukan aman","body":"<p>Triase menentukan prioritas penanganan berdasarkan kondisi pasien. Prioritas I membutuhkan penanganan segera karena kondisi kritis dapat mengancam nyawa. Petugas melanjutkan survei primer, penanganan awal, penilaian lanjutan, dan keputusan pelayanan definitif atau rujukan sesuai keadaan.<\/p>\n<p>Pedoman menjelaskan survei jalan napas, pernapasan, dan sirkulasi, serta survei sekunder dan kondisi gawat darurat khusus. Langkah tersebut dijalankan oleh tenaga berkompeten. Ringkasan pembelajaran tidak menggantikan keterampilan resusitasi atau protokol tindakan.<\/p>\n<p>Rujukan merupakan proses: tim memberikan penanganan awal sesuai kemampuan, menyiapkan informasi klinis dan kebutuhan perjalanan, mengomunikasikan rujukan, serta mengatur transportasi/petugas sesuai kebutuhan. Mengirim pasien tanpa pengaturan dan komunikasi bukan koordinasi rujukan yang lengkap.<\/p>\n<p><b>Penerapan:<\/b> pasien sesak berat datang saat loket ramai. Tim segera mengutamakan triase dan penanganan klinis, kemudian mengatur kebutuhan rujukan. Petugas tidak menunda pertolongan sampai seluruh formulir selesai.<\/p>","refs":["LK2024"]},{"id":"pedoman-II-29","title":"Siklus pengelolaan obat dan BMHP","body":"<p>Pelayanan farmasi memerlukan pemilihan serta perencanaan kebutuhan, pengadaan/penerimaan, penyimpanan, distribusi, pengendalian, pencatatan, evaluasi, dan penarikan/pemusnahan sesuai ketentuan. Pengelola memeriksa kesesuaian barang yang diterima, kondisi, serta kebutuhan stok.<\/p>\n<p>Penyimpanan mengikuti karakteristik dan label produk. Pedoman memisahkan kebutuhan suhu serta pengelompokan obat. Produk rusak, kedaluwarsa, atau ditarik dipisahkan dari stok layak pakai; pencatatan membantu keterlacakan. Rantai dingin memerlukan pengelolaan dan pemantauan, bukan hanya memiliki lemari pendingin.<\/p>\n<p>Distribusi harus mendukung kebutuhan unit layanan dan jejaring. Tim menggunakan informasi stok dan penggunaan untuk mencegah kekosongan atau penumpukan. Barang yang tersedia secara administratif belum tentu siap dipakai bila mutu atau kondisinya bermasalah.<\/p>\n<p><b>Penerapan:<\/b> ditemukan produk kedaluwarsa bercampur dengan stok aktif. Pengelola memisahkan produk tersebut, mencatat, dan mengikuti proses pengendalian/penanganan yang sesuai. Tim tidak membagikannya hanya karena jumlah stok di laporan masih cukup.<\/p>","refs":["LK2024"]},{"id":"pedoman-II-30","title":"Farmasi klinis: resep, konseling, pemantauan dan rujuk balik","body":"<p>Apoteker mengkaji resep untuk menemukan masalah terkait obat dan mencegah medication error. Tenaga teknis kefarmasian membantu sesuai batas kewenangan. Pemeriksaan administrasi dan farmasetik tidak menggantikan pengkajian klinis yang diperlukan.<\/p>\n<p>Pelayanan informasi obat dan konseling membantu pasien/keluarga memahami penggunaan, kebutuhan perhatian, serta tindak lanjut. Tim memastikan kebutuhan informasi terjawab, bukan sekadar menyerahkan kemasan. Visite, pemantauan terapi obat, evaluasi penggunaan obat, dan pemantauan efek samping mendukung kesinambungan.<\/p>\n<p>Home pharmacy care dan dukungan program rujuk balik menghubungkan obat dengan keadaan pasien di rumah serta tim pelayanan. Masalah penggunaan obat ditindaklanjuti bersama tenaga terkait. Pedoman merinci kebutuhan dokumentasi dan pemantauan; aplikasi tidak menambahkan aturan dosis baru.<\/p>\n<p><b>Penerapan:<\/b> peserta rawat jalan mempunyai resep yang belum jelas. Apoteker melakukan pengkajian dan berkoordinasi sebelum penyerahan. Setelah obat diserahkan, pasien memperoleh informasi serta tindak lanjut sesuai kebutuhan, bukan hanya diminta membaca label sendiri.<\/p>","refs":["LK2024"]},{"id":"pedoman-II-31","title":"Laboratorium: identitas, spesimen, pengiriman dan hasil","body":"<p>Laboratorium mendukung pelayanan pasien dan kegiatan wilayah. Pengelola menyiapkan tenaga, sarana, jenis pemeriksaan, jejaring, serta alur. Petugas mengenali kemampuan fasilitas dan pemeriksaan yang perlu dirujuk.<\/p>\n<p>Mutu dimulai dari permintaan pemeriksaan dan identitas, persiapan pasien, pengambilan spesimen, wadah, penyimpanan, serta pengiriman. Contoh dalam pedoman: identitas pasien dan spesimen dahak ditulis pada dinding pot, bukan tutup. Petugas juga menilai kualitas sampel dan tempat pengumpulan agar memenuhi kebutuhan pemeriksaan.<\/p>\n<p>Pemeriksaan malaria, HIV, dan tes cepat molekuler mempunyai prosedur masing-masing. Rujukan spesimen memerlukan pengemasan, dokumen, kondisi transportasi, serta koordinasi dengan penerima sesuai jenis bahan. Hasil dikembalikan ke pemeriksa untuk ditafsirkan bersama keadaan pasien.<\/p>\n<p><b>Penerapan:<\/b> hasil pemeriksaan tidak dapat ditelusuri karena identitas pot dan formulir tidak sesuai. Tim menelusuri serta menyelesaikan masalah sesuai prosedur sebelum menggunakan hasil untuk keputusan pasien. Memperbaiki label berdasarkan tebakan bukan pemulihan keterlacakan.<\/p>","refs":["LK2024"]},{"id":"pedoman-II-32","title":"Mutu laboratorium, rawat inap, dan krisis kesehatan","body":"<p>Pemantapan mutu laboratorium mencakup pengendalian internal, penilaian eksternal, pembinaan, dan kalibrasi yang diperlukan. Tim menindaklanjuti masalah mutu dan mendokumentasikan tindakan. Pemeriksaan yang selesai secara teknis belum berarti hasil siap digunakan bila mutu belum dipastikan.<\/p>\n<p>Rawat inap dilaksanakan menurut kemampuan, standar fasilitas, tenaga, dan kebutuhan pasien. Tim mengatur pelayanan, pemantauan, koordinasi, serta kebutuhan rujukan. Penunjang dan farmasi tetap terhubung dengan pelayanan pasien.<\/p>\n<p>Pada prakrisis, tim menilai risiko, menyiapkan rencana dan sumber daya. Pada darurat krisis, tim menjalankan Rapid Health Assessment (RHA), pelayanan darurat, pelaporan, koordinasi/komando, dan kesinambungan layanan esensial. Pascakrisis mencakup penilaian kebutuhan, pemulihan, serta evaluasi. Sasaran ibu, anak, lansia, dan pasien kronis tetap membutuhkan pengaturan pelayanan.<\/p>\n<p><b>Penerapan:<\/b> bencana mengganggu obat, air, dan akses. Tim memadukan respons darurat dengan ketersediaan layanan esensial, logistik, rujukan, dan koordinasi wilayah. Tim menilai hasil dan memperbaiki rencana sesudah kejadian.<\/p>","refs":["LK2024"]},{"id":"pedoman-II-33","title":"Kasus terpadu: tutup celah layanan sampai tindak lanjut","body":"<p>Masalah lapangan sering melintasi lebih dari satu klaster. Tim tidak cukup memilih nomor klaster; tim perlu menyambungkan tindakan pasien, kebutuhan keluarga, data wilayah, lingkungan, dan sumber daya. Koordinasi mengikuti peran serta kompetensi masing-masing.<\/p>\n<p>Klaster 1 mengonsolidasikan data dan mengatur dukungan manajemen. Klaster 2 dan 3 menangani sasaran siklus hidup, melengkapi skrining, serta tindak lanjut. Klaster 4 menjalankan surveilans dan kesehatan lingkungan. Lintas Klaster menyediakan pelayanan penunjang yang dibutuhkan. Pustu serta kader menjangkau sasaran dan mengembalikan hasil tindak lanjut.<\/p>\n<p><b>Contoh latihan:<\/b> banjir menyebabkan beberapa warga diare, ibu hamil belum melengkapi pemeriksaan, dan lansia membutuhkan perawatan. Tim lebih dahulu menilai kebutuhan segera, mengatur layanan ibu/lansia, menindaklanjuti sinyal penyakit serta risiko air/sanitasi, menjaga obat/laboratorium/rujukan, dan memperbaiki rencana berbasis PWS. Semua kegiatan mempunyai pelaksana serta catatan hasil. Kegiatan hanya poster, hanya laporan, atau hanya satu klaster meninggalkan kebutuhan yang belum selesai.<\/p>\n<p>Penilaian hasil memeriksa apakah sasaran memperoleh layanan yang diperlukan dan tindak lanjut sudah terjadi. Jumlah pertemuan atau kunjungan bukan satu-satunya bukti bahwa pelayanan sudah terpadu.<\/p>","refs":["K1","K2","K3","K4","LK2024"]},{"id":"pedoman-II-34","title":"Cara membaca sumber dan batas materi yang tersedia","body":"<p>Setiap unit pendalaman menyediakan teks halaman PDF yang benar-benar diterima, nomor halaman berkas, dan akses ke PDF asli dalam paket. Teks ekstraksi membantu pencarian, tetapi susunan kolom, hubungan panah, dan gambar harus diperiksa pada halaman PDF. Nomor halaman berkas dapat berbeda dari nomor yang dicetak di halaman.<\/p>\n<p>Keterangan fisioterapi yang belum tersedia merujuk pada PDF lama. Materi pengayaan aplikasi kini memuat tujuan, alur, koordinasi, dan batas profesi rehabilitasi dasar dari presentasi Lintas Klaster V25 slide 200–209. Rincian modalitas yang belum jelas tetap memerlukan verifikasi sebelum digunakan dalam pelayanan. Materi atau video eksternal yang dirujuk buku tidak dianggap sudah ikut tersedia hanya karena tautannya tercantum.<\/p>\n<p>Bagian SARC-CalF mempunyai catatan ketidakkonsistenan internal sebagaimana dijelaskan pada pelajaran ADL. Bagian ini tidak dipakai sebagai aturan otomatis atau kunci ujian. Angka, tabel, dan rujukan mengikuti berkas sumber yang diberikan; aplikasi ini tidak menyatakan telah memperbarui seluruh kebijakan atau pedoman klinis di luar berkas tersebut.<\/p>\n<p><b>Makna kelulusan:<\/b> tiga tes berisi contoh kasus dari cakupan materi, bukan pemeriksaan setiap rincian dari lima buku. Kelulusan tes pengetahuan tidak menyatakan semua keterampilan klinis peserta telah diamati atau disahkan.<\/p>","refs":["LK2024","K3","K2","LKPPT2025"]}],"figures":[{"title":"Lintas Klaster halaman PDF 36","data":"data:image/webp;base64,UklGRhScAABXRUJQVlA4TAecAAAvzwdaAVUTg7aNJCUT/qhn79MRiIgJwPc52paKd2fBWL47uPG/EJdx2eWwH6h3cOMlblBhFDef15UyMMMMeiHgkucuRFABVEFRHHcVFFMxVEDxUMFREAVBEFDl4QA6qnObqkUBRJU3Z7gdoMCN2+Wr3A0uuHMJFHD6ng8ATRf8f8s2t40YzcxsyyuyamZmFisWGcRmWyyZmW0xMzMzMzPTGiQza2VZsPH4ee/n/7+f67ru67ru+3luP2V8x2fWNCQ12hm5zMwN3OVWpiNPQ0dlg3Yako5LO9aM6hm2J7QOlrkyzZDk4hFzuyqjIZxNGTzzBrZjebztWhm5sO2EOdEYNZM1MxyV3nI4MQXPPDkut0G5zHzIjE6PAmdlUJg5eY7KDFJNM2EuM21ntB5r293OrM7KDAG5YaajzhiPwpwyMzMFPWtN14WrzFwZDwJ6DoLqWWZUUi0FDDuzcpn5TPJQSG+g3PpYh2V8C0fMZgozM5yVHEY5055xGCWFNc/MpqovAAAL27ZtK8u2bdu2v6Zt27Zt27ZtG2utVs1IVaUqKTOqCiwBAGRIshWRkYzIzK7GcDFajLXe4Xp3jIeT3+m9///R9s0n49m2bdu2bfXfAm3tYds279spFJ/MpSgdN7GgD8AP0ACs2P+//pcy7u7u7u7u7u7u7u7u7u5+3d3d3d3d3b6fz/fzk+/n+534aqOfOLoCv2kcl06cikZPmrR6vZHqmiZiiRXABlgAa3BIU3FoHBYyHUtf1uAbYAe+C6KTILKEC5UFTPydczN0klZ24O4enS3MZF8CZzILmIzFG/8bmHPedxFD9zQLwD35P80SsMQeODfdjlbOzZAtefs3vNkqSA5b4HbOnCMBAACCaVy3bdv2s23btm3btm3b9mwb2ZIEASAYZ2r3/+fYdrK2bdu2+y8HkiRJirwl4J4u7d6gmV6Jbv1/qyZl3d3d3d3dFXd3d3d3d3d3d3d3d3d3VrL7PPd578x97j33HTl3pY2NNqMGGiD2aLYGaiB2jTfCCWkBOtiYAiwjkgp+FWwbSLYRZyrAM6rQGjykJA+nBRxij91lQjrYLpAipgBq2HCyPQd7G0BroICtAQ3JNpxDpE1wNiSmBmIaeFpAMiL3CiiJDqwGGiGEGwsAwerdZYH0Sa8J0tmpza1t89soFAAAQPz///////////9//YfERpIiybm8B6V7cQ4cSXzY/383Nbv0POfOOZyccw5Pfp6Tw5N8cs4555xzzjnnnHPOOedwP/ncxyfnnHM+c/1+39/3/78uxjM3cwmakxOiOglNgStOsKjcsAk20VhT4IoGUYxOcjVUbPAmRHNXdoFmgyvuTTS
