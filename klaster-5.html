s\n\n1. Nama, umur, jenis 1. Bentuk dan kekuatan 1. Ketepatan indikasi,\nkelamin dan berat sediaan. dosis dan waktu\nbadan pasien. 2. Dosis dan jumlah penggunaan Obat.\n2. Nama, dan paraf Obat. 2. Duplikasi\ndokter. 3. Stabilitas dan pengobatan.\n3. Tanggal resep. ketersediaan. 3. Alergi, interaksi dan\n4. Ruangan/unit asal 4. Aturan dan cara efek samping Obat.\nresep. penggunaan. 4. Kontra indikasi.\n5. Inkompatibilitas 5. Efek adiktif\n(ketidakcampuran\nObat).\n\nLuaran Pengkajian dan Pelayanan Resep adalah:\n1. Pasien memperoleh Obat sesuai dengan kebutuhan klinis/pengobatan.\n2. Pasien memahami tujuan pengobatan dan mematuhi intruksi pengobatan"},{"page":89,"text":"89\nPelayanan Informasi Obat\n\nTujuan Manfaat\n• Menyediakan informasi mengenai • Peningkatan kesehatan masyarakat\nobat kepada pasien dan tenaga (promotif), contoh GeMa CerMat\nkesehatan di lingkungan (Gerakan Masyarakat Cerdas\nPuskesmas dan pihak lain di luar Menggunakan Obat).\nPuskesmas. • Pencegahan penyakit (preventif),\n• Menyediakan informasi untuk contoh penyuluhan tentang manfaat\nmembuat kebijakan yang imunisasi.\nberhubungan dengan • Penyembuhan penyakit (kuratif)\nobat/sediaan farmasi, alat contoh keterlibatan dalam program\nkesehatan, dan bahan medis eliminasi malaria dan TBC.\nhabis pakai. • Pemulihan kesehatan (rehabilitatif)\n• Meningkatkan penggunaan obat contoh kepatuhan pada pasien\nyang rasional. pasca stroke..\n\nPelaksana\nPemberian Informasi Obat (PIO)\ndilakukan oleh apoteker. ."},{"page":90,"text":"90\nPelayanan Informasi Obat\n\nPenyediaan Informasi Pembuatan kebijakan Kegiatan penunjang\n\nTerkait permintaan dan Kegiatan penyuluhan pada Penyediaan Informasi selama\nketersediaan obat, serta pasien rawat jalan atau kegiatan tatap muka\npenyimpanan rawat inap dengan pasien\n\nPenyediaan informasi dalam Bentuk media informasi dan Memastikan kapasitas\nbentuk tatap muka denanga promosi kesehatan petugas farmasi melalui\npelatuihan atau Pendidikan petugas Kesehatan lainnya\nkhusus\n\nPenyediaan Media informasi\ndalam bentuk media audio- Koordinasi penelitian obat\nvisual di lingkungan dan kegiatan pelayanan\npuskesmas kefarmasian"},{"page":91,"text":"91\nKonseling\n\nManfaat\nTujuan • Meningkatkan hubungan\nPemberian konseling obat kepercayaan antara apoteker\nbertujuan untuk dan pasien;\nmengoptimalkan hasil terapi, • Meningkatkan kepatuhan pasien\nmeminimalkan risiko Reaksi Obat dalam menjalani pengobatan;\nyang Tidak Dikehendaki (ROTD), • Mencegah atau meminimalkan\ndan meningkatkan cost- masalah terkait obat;\neffectiveness yang pada • Membimbing dan mendidik pasien\nakhirnya meningkatkan dalam penggunaan obat\nkeamanan penggunaan obat sehingga dapat mencapai tujuan\nbagi pasien (patient safety). pengobatan dan meningkatkan\nmutu pengobatan pasien\n\nPelaksana\ndilakukan oleh apoteker"},{"page":92,"text":"92\nKonseling\n\nIdentifikasi masalah Alat dan bahan serta Strategi konseling klinis kefarmasian mekanisme konseling\n\nTeknik komunikasi antara Identifikasi rutin gejala yag Meningkatkan kepercayaan petugas farmasi dengna pasien muncul setelah penggunaan hubungan petugas farmasi yang sedang dalam obat dari layanan kesehatan dengna pasien pengobatan\n\nTeknik komunikasi antara Meningkatkan kepatuhan Identifikasi gejala yang timbul petugas farmasi dengan pasien dalam mengkonsumsi selama pemakaian obat di keluarga pasien yang sedang obat secara tepat dan rumah dalam pengobatan kesinambungan\n\nPenyediaan Media informasi Memperhatikan terkait\ndalam bentuk media audio- Alat dan bahan konseling kemungkinan efek samping\nvisual di lingkungan puskesmas obat yang muncul"},{"page":93,"text":"93\nKonseling\n\nMasukan bagi petugas\nPersiapkan lembar ada kendala ya pasien mau ya medis dalam melakukan\nPasien dalam konseling, pengobatan mendapat pergantian atau\npengobatan Persiapkan media promosi pasien? konseling? perubahan regimen\nKesehatan\n1 pengobatan\n\ntidak tidak\n• Melakukan 1 • Edukasi pasien Faktor yang perlu diperhatikan:\nkonseling dengan terkait\nkeluarga pasien\npenggunaan dan 1. Kriteria pasien: dalam mengawasi tatacara menelan Media promosi pasien dalam a. Pasien rujukan dokter. obat\nKesehatan menelan obat b. Pasien dengan penyakit • Edukasi pasien Audio visual • Kordinasi dengan kronis. dan keluarga\npetugas Kesehatan pasien untuk c. Pasien dengan Obat yang untuk pemantauan\npemantauan berindeks terapetik sempit menelan obat pengobatan pasien dan poli farmasi.\nd. Pasien geriatrik.\ne. Pasien pediatrik.\nf. Pasien pulang sesuai dengan\nkriteria di atas.\n\n2. Sarana dan prasarana:\na. Ruangan khusus.\nb. Kartu pasien/catatan\nkonseling"},{"page":94,"text":"94\nVisite\n\nTujuan Manfaat\n• Meningkatkan • Meningkatkan komunikasi\npemahaman mengenai apoteker, dokter, perawat dan\nriwayat pengobatan tenaga kesehatan lain.\npasien, perkembangan • Pasien mendapatkan obat\nkondisi klinik dan rencana sesuai rejimen (bentuk sediaan,\nterapi obat. dosis, rute, frekuensi) dan\n• Memberikan rekomendasi indikasi\nobat kepada dokter atau • Pasien mendapatkan terapi\ntenaga kesehatan yang obat yang efektif dengan risiko\nmenangani pasien dalam minimal\nhal pemilihan terapi obat.\n• Memberikan rekomendasi\npenyelesaian masalah\nterkait penggunaan obat\nPelaksana akibat keputusan klinik\ndilakukan oleh apoteker. . yang sudah ditetapkan\nsebelumnya."},{"page":95,"text":"95\nVisite\n\nKoordinasi dengan dokter\nada efek samping ada kendala ya ya perawat terkait efek samping Pasien dalam dari pengobatan? pengobatan yang timbul bangsal rawat inap\npasien? Kordinasi untuk perubahan atau\npergantian obat\n\ntidak tidak\n\nBersama petugas\n• Edukasi pasien dan Kesehatan memantau\nkeluarga pasien perkembangan\nuntuk pemantauan pengobatan dan klinis\npengobatan pasien\n• Kordinasi dengan\npetugas Kesehatan\nuntuk pemantauan\nefek samping yang\nmungkin timbul\n\nHal-hal yang perlu diperhatikan:\n1. Memahami cara berkomunikasi yang efektif.\n2. Memiliki kemampuan untuk berinteraksi dengan pasien dan tim.\n3. Memahami teknik edukasi.\n4. Mencatat perkembangan pasien"},{"page":96,"text":"96\nVisite\n\nKegiatan visite bersama tim: Beberapa hal yang perlu dilakukan sebelum\n1. Melakukan persiapan yang dibutuhkan pelaksanaan. Melakukan persiapan:\n1. Melakukan seleksi pasien berdasarkan seperti memeriksacatatan pegobatan\nkriteria yang sudah ditetapkan.\npasien dan menyiapkan pustaka\n2. Mengumpulkan informasi penggunaan\npenunjang.\nobat dari catatan penggunaan obat,\n2. Mengamati dan mencatat komunikasi monitoring pengobatan dan wawancara\ndokter dengan pasien dan/atau dengan pasien/keluarga\nkeluarga pasien terutama tentang Obat. 3. Mengumpulkan data berupa keluhan\n3. Menjawab pertanyaan dokter tentang pasien, hasil pemeriksaan fisik,\nlaboratorium, diagnostik, penilaian dokter Obat.\nmelalui rekam medik atau\n4. Mencatat semua instruksi atau\n4. Catatan pengobatan di ruang rawat\nperubahan instruksi pengobatan,seperti\n5. Mengkaji penggunaan obat meliputi\nObat yang dihentikan, Obat baru, ketepatan indikasi, dosis, rute, interaksi, efek\nperubahan dosis dan lain- lain. samping obat dan biaya."},{"page":97,"text":"97\nPemantauan Terapi Obat (PTO)\n\nPasien dalam\nada kendala ya yabangsal rawat inap ada efek samping dari Laporan efek samping pengobatan atau pasien pengobatan? pengobatan pasien?perawatan di rumah\n\ntidak tidak Tujuan:\n• Konseling • Konseling 1. Mendeteksi\npengobatan pengobatan masalah yang • Edukasi pasien dan Pemantauan rutin •\nefek samping keluarga pasien terkait dengan pengobatan untuk pemantauan\npengobatan Obat.\n• Kordinasi dengan 2. Memberikan petugas Kesehatan\nuntuk pemantauan\nefek samping yang rekomendasi\nmungkin timbul penyelesaian\nmasalah yang\nterkait dengan\nKriteria pasien: Obat.\n1. Anak-anak dan lanjut usia, ibu hamil dan menyusui.\n2. Menerima Obat lebih dari 5 (lima) jenis.\n3. Adanya multidiagnosis.\n4. Pasien dengan gangguan fungsi ginjal atau hati.\n5. Menerima Obat dengan indeks terapi sempit.\n6. Menerima Obat yang sering diketahui menyebabkan reaksi Obat yang\nmerugikan"},{"page":98,"text":"98\nPemantauan Terapi Obat (PTO)\n\nPersiapan Masalah terkait\n1. Seleksi Pasien Seleksi dapat dilakukan berdasarkan: obat dapat dikategorikan sebagai berikut:\na. Kondisi Pasien: 1. Ada indikasi tetapi tidak diterapi\n• Pasien dengan multi diagnosa. 2. Pemberian obat tanpa indikasi\n• Pasien dengan resep polifarmasi. 3. Pasien mendapatkan obat yang tidak diperlukan.\n• Pasien yang menerima obat dengan indeks 4. Pemilihan obat yang tidak tepat.\nterapi sempit. 5. Pasien mendapatkan obat yang bukan pilihan\n• Pasien dengan gangguan fungsi organ terbaikuntuk kondisinya (bukan merupakan\nterutama hati dan ginjal. pilihan pertama, obat yang tidak cost effective\n• Pasien geriatri dan pediatri. dan kontra indikasi).\n• Pasien hamil dan menyusui. 6. Dosis terlalu tinggi\nb. Obat Jenis Obat dengan risiko tinggi seperti: 7. Dosis terlalu rendah\n• Obat dengan indeks terapi sempit (contoh: 8. Reaksi Obat yang Tidak Dikehendaki (ROTD)\ndigoksin, fenitoin) 9. Interaksi obat\n• Obat yang bersifat nefrotoksik (contoh: 10. Pasien tidak menggunakan obat karena suatu\nantiretroviral) dan hepatotoksik (contoh: sebab (tidak mampu membeli obat, obat tidak\nObat Anti Tuberkolosis/OAT) tersedia, ketidakpatuhan pasien atau karena\n• Obat yang sering menimbulkan ROTD kelalaian petugas)\n(contoh: metoklopramid, AINS) 11. Apoteker perlu membuat prioritas masalah yang\nc. Kompleksitas regimen : perlu penyelesaian segera sesuai dengan kondisi\n• Polifarmasi pasien, dan menentukan masalah tersebut sudah\n• Variasi rute pemberian terjadi atau berpotensi akan terjadi.\n• Variasi aturan pakai Cara pemberian khusus\n(contoh: inhalasi)\n\n2. Kertas kerja atau formulir\n1. Formulir PTO (Lihat Lampiran 11)"},{"page":99,"text":"99\nEvaluasi Penggunaan Obat\n\nTujuan\n1. Mendapatkan Manfaat\ngambaran pola Perbaikan pola penggunaan\npenggunaan obat obat secara berkelanjutan\npada kasus tertentu. berdasarkan bukti.\n2. Melakukan evaluasi\nsecara berkala untuk\npenggunaan obat\ntertentu.\n3. Memberikan masukan\nuntuk perbaikan Pelaksana\npenggunaan obat 1. Apoteker\n4. Menilai pengaruh 2. Tim terdiri apoteker,\nintervensi atas pola dokter, perawat\npenggunaan obat"},{"page":100,"text":"100\nEvaluasi Penggunaan Obat\n\nPasien dalam\nbangsal rawat inap ada kendala ya ada ya Laporan evaluasi\natau pasien pengobatan penyalahgunaan pengobatan pada fasilitas\nperawatan di pasien? pengobatan? kesehatan\nrumah\n\ntidak tidak\n\n• Konseling • Konseling dan\npengobatan edukasi pasien\n• Pemantauan rutin dan keluarga Persiapan:\nefek samping pasien tentang 1) Analisis masalah obat berdasarkan\npengobatan pengobatan • Kordinasi dengan kriteria yang ditetapkan sebagai\npetugas prioritas\nKesehatan untuk • biaya obat tinggi pemantauan efek\nsamping yang • obat dengan pemakaian tinggi\nmungkin timbul • kurang jelas efektifitasnya\n• antibiotik\n• injeksi\n• obat baru\n• kurang dalam penggunaan\n2) program EPO tahunan\n3) pemilihan penelitian/guidelines/standar\nsebagai standar pembanding"},{"page":101,"text":"101Home Pharmacy Care (Pelayanan Kefarmasian di\nRumah)\n\nTujuan Manfaat\n• Tercapainya keberhasilan terapi • Untuk Pasien :\npasien 1. Terjaminnya keamanan, efektifitas\n• Terlaksananya pendampingan dan keterjangkauan biaya\npasien oleh apoteker untuk pengobatan\nmendukung efektivitas, keamanan 2. Meningkatnya pemahaman dalam\ndan kesinambungan pengobatan pengelolaan dan penggunaan obat\n• Terwujudnya komitmen, dan/atau alat kesehatan\nketerlibatan dan kemandirian 3. Terhindarnya reaksi obat yang tidak\npasien dan keluarga dalam diinginkan\npenggunaan obat atau alat 4. Terselesaikannya masalah\nkesehatan yang tepat penggunaan obat dan/atau alat\n• Terwujudnya kerjasama profesi kesehatan dalam situasi tertentu.\nkesehatan, pasien dan keluarga\n• Untuk apoteker :\n1. Pengembangan kompetensi\napoteker dalam pelayanan\nPelaksana kefarmasian di rumah\n1. Apoteker 2. Pengakuan profesi apoteker oleh\n2. TTK dan tenaga kesehatan lain di masyarakat kesehatan, masyarakat\npuskesmas umum dan pemerintah\n3. Kolaborasi Apoteker, TTK dengan 3. Terwujudnya kerjasama antar profesi\nperawat dan dokter kesehatan."},{"page":102,"text":"102Home Pharmacy Care (Pelayanan Kefarmasian di\nRumah)\n\n• Konseling dan edukasi\npengobatan bagi\npasien dan keluarga\npasien untuk Laporan pelayanan Pasien perawatan di ada kendala ya\npemantauan rumah pengobatan kefarmasian di rumah\npengobatan pasien?\n• Koordinasi dengan\npetugas untuk subsitusi\npengobatan\ntidak\n\n• Konseling pengobatan\n• Pemantauan rutin efek\nsamping pengobatan\n\nKriteria pasien:\n(a) Pasien yang menderita penyakit kronis dan memerlukan perhatian khusus tentang penggunaan obat, interaksi\nobat dan efek samping\n(b) Pasien dengan terapi jangka panjang misal TB paru, DM, HIV-AIDS dan lain-lain.\n(c) Pasien dengan resiko misal usia >65 th atau lebih dengan salah satu kriteria atau lebih rejimen obat misal :\n• Pasien dengan 6 macam diagnosis atau lebih\n• Pasien minum obat 6 macam atau lebih setiap hari\n• Pasien minum obat 12 dosis atau lebih setiap hari\n• Pasien minum salah satu dari 20 macam obat berikut yang telah diidentifikasi tidak sesuai dengan pasien\ngeriatrik (Diazepam, Indometasin, Flurazepam, Cyclandelate, Pentobarbital, Methocarbamol, Amitriptilin,\nTrimethobenzamide, Isoxuprine, Phenylbutazon, Cyclobenzaprine, Chlorpropamide, Orpenadrine,\nPropoxyphene, Chlordiapoxide, Pentazosine, Meprobamate, Dipyridamole, Secobarbital, Carisoprodol)"},{"page":103,"text":"Pelayanan Rujuk Balik 103\n\nPelayanan Program Rujuk Balik (PRB) dihususkan pada penderita penyakit kronis yang dinyatakan stabil dan masih memerlukan\nperawatan jangka panjang yang dilaksanakan di pelayanan kesehatan tingkat pertama atas rujukan dokter spesialis yang\nmerawat.\n\nRujukan Rumah Sakit Perujuk Puskesmas wilayah Laporan pelayanan kefarmasian\npasien Laporan pasien rujukan di rumah\nFollow Up\n\nTerapi/obat obatan Pasien perawatan\nuntuk pengobatan di rumah rumah\n\n• Laporan pemakaian • Konseling\nobat dan alat pengobatan\nkesehatan • Pemantauan rutin\nefek samping\npengobatan\n\nPelayanan obat dalam PRB harus dikelola dengan baik oleh tenaga kesehatan yang memiliki kompetensi, untuk\nmemastikan tercapainya :\nhasil pengobatan yang baik,\nmencegah timbulnya gejala baru,\nmemperlambat komplikasi penyakitnya dan\nmeningkatkan kualitas hidup pasien yang secara keseluruhan akan\nmeningkatkan keselamatan pasien serta efektivitas pembiayaan kesehatan."},{"page":104,"text":"104\nMonitoring Efek Samping Obat (MESO)\n\nTujuan\n• menemukan Efek Manfaat\nSamping Obat (ESO) • Tercipta data based ESO\nsedini mungkin terutama Puskesmas sebagai dasar\nyang berat, tidak dikenal penatalaksanaan ESO\ndan frekuensinya jarang • Mendukung pola insidensi\n• menentukan frekuensi ESO nasional\ndan insidensi ESO yang\nsudah dikenal dan yang\nbaru saja ditemukan\nPelaksana • meminimalkan risiko\n1. Apoteker kejadian reaksi Obat\n2. TTK dan tenaga kesehatan yang tidak dikehendaki;\nlain di puskesmas dan\n3. Kolaborasi Apoteker, TTK • mencegah terulangnya\ndengan perawat dan kejadian reaksi Obat\ndokter yang tidak dikehendaki."},{"page":105,"text":"105\nMonitoring Efek Samping Obat (MESO)\n\nPersiapan\n1. Data ESO puskesmas\n• Lakukan pengisian Koordinasi dengan 2. Referensi ESO\nefek samping obat petugas medis atau ya 3. Resep, rekam medisLaporan efek dapat mengakses sesuai arahan dokter pembuat resep\nsamping Obat e-meso.pom.go.id • Rekam semua hasil terkait kejadian efek 4. Obat pasien\n? pelaporan untuk samping obat pasien\nevaluasi bersangkutan 5. Kertas kerja atau\nformulir MESO\ntidak (lampiran 13)\n\n• Lakukan\npencatatan manual\nmelalui lembar\n(kuning) efek\nsamping obat yang\ntersedia, atau\ndiunduh pada\nlaman e-\nmeso.pom.go.id"},{"page":106,"text":"106\nMonitoring Efek Samping Obat (MESO)\n\nKegiatan:\n\n1. Menganalisis laporan efek samping Obat.\n2. Mengidentifikasi Obat dan pasien yang mempunyai resiko tinggi\nmengalami efek samping Obat.\n3. Mengisi formulir Monitoring Efek Samping Obat (MESO).\n4. Melaporkan ke Pusat Monitoring Efek Samping Obat Nasional.\n\nFaktor yang perlu diperhatikan:\n\n1. Kerja sama dengan tim kesehatan lain.\n2. Ketersediaan formulir Monitoring Efek Samping Obat."},{"page":107,"text":"107\n\nStruktur Pelayanan\nLaboratorium\nBAB X Alur Pelayanan Laboratorium\nLABORATORIUM\nKESEHATAN Mekanisme Rujukan\nMASYARAKAT Pemantauan Mutu dan\nPembinaanTINGKAT I\nPencatatan, Pelaporan\nLaboratorium"},{"page":108,"text":"108\n\nStruktur Laboratorium Kesehatan"},{"page":109,"text":"Struktur Laboratorium 109\n\nStruktur Laboratorium dengan Struktur Laboratorium\npertimbangan kompleksitas\npelayanan Puskesmas bisa\nberbeda-beda tergantung Sarana dan Prasaranapada daerah/pengembangan\nwilayah setempat, maka\npersyaratan minimal yang harus Perlengkapan dan\ndimiliki oleh setiap Puskesmas. peralatan"},{"page":110,"text":"Struktur Laboratorium 110\n\nLaboratorium kesehatan masyarakat diselenggarakan oleh pemerintah pusat dan pemerintah daerah\nterdiri atas 5 (lima) tingkatan, meliputi\n\nLaboratorium Merupakan laboratorium kesehatan masyarakat sebagai bagian dari Puskesmas atau laboratorium lainnya sesuai kesehatan dengan ketentuan peraturan perundang-undangan. Laboratorium kesehatan masyarakat tingkat 1 melaksanakan masyarakat fungsi ke 1 sampai 5 tingkat 1\n\nLaboratorium\nkesehatan Merupakan laboratorium kesehatan masyarakat yang diselenggarakan oleh pemerintah daerah kabupaten/kota.\nmasyarakat Laboratorium kesehatan masyarakat tingkat 2 melaksanakan fungsi ke 1 sampai 8.\ntingkat 2\n\nLaboratorium\nkesehatan Merupakan laboratorium kesehatan masyarakat yang diselenggarakan oleh pemerintah daerah provinsi.\nmasyarakat Laboratorium kesehatan masyarakat tingkat 3 melaksanakan fungsi ke 1 sampai 12.\ntingkat 3\n\n.\nLaboratorium Merupakan Unit Pelaksana Teknis Kementerian Kesehatan di bidang laboratorium pada wilayah Regional. Labkemas kesehatan tingkat 4 melaksanakan fungsi ke 1 sampai 13 dalam satu Regional. Dalam hal di satu Regional terdapat lebih dari masyarakat\nsatu Labkesmas Regional, maka pelaksanaan fungsi dilakukan oleh Koordinator Regional tingkat 4\n\nLaboratorium\nkesehatan Merupakan merupakan laboratorium kesehatan masyarakat yang diselenggarakan oleh Kementerian Kesehatan\nmasyarakat sebagai rujukan nasional. Laboratorium kesehatan masyarakat tingkat 5 melaksanakan fungsi ke 1 sampai 14.\ntingkat 5"},{"page":111,"text":"Struktur Laboratorium 111\n\nLabkes Labkes Labkes Labkes Labkes Fungsi Tk.1 Tk.2 Tk.3 Tk.4 Tk.5\n✓ ✓ ✓ ✓ ✓ Pemeriksaan spesimen klinik;\n✓ ✓ ✓ ✓ ✓ Pengujian sampel (Lingkungan, vector, reservoir);\nSurveilans penyakit dan faktor risiko kesehatan\n✓ ✓ ✓ ✓ ✓ berbasis laboratorium serta respon kejadian luar\nbiasa, wabah, dan bencana;\n✓ ✓ ✓ ✓ ✓ Pengelolaan dan analisis data laboratorium;\n✓ ✓ ✓ ✓ ✓ Komunikasi dengan pemangku kepentingan;\n✓ ✓ ✓ ✓ Penguatan kapasitas sumber daya manusia;\n✓ ✓ ✓ ✓ Pengelolaan logistik khusus laboratorium;\n✓ ✓ ✓ Penjaminan mutu laboratorium kesehatan;\n✓ ✓ ✓ Pengoordinasian jejaring laboratorium kesehatan;\nKerja sama dengan lembaga/institusi nasional\n✓ ✓ ✓ dan/atau internasional;\nPengelolaan biorepositori spesimen klinik dan\n✓ ✓ ✓ sampel;\nAnalisis masalah kesehatan masyarakat berbasis\n✓ ✓ laboratorium;\n✓ Pengembangan teknologi tepat guna; dan\nMerumuskan rekomendasi kebijakan dan\n✓ pengembangan program kesehatan."},{"page":112,"text":"112Struktur SDM Laboratorium Kesehatan Kesehatan\nTingkat 1\n\nUntuk dapat melaksanakan fungsinya dan menyelenggarakan upaya wajib Puskesmas, dibutuhkan\nsumber daya manusia yang mencukupi baik jumlah maupun mutunya. Pola ketenagaan minimal\nharus dimiliki oleh Puskesmas, Puskesmas Dengan Tempat Perawatan (PDTP), dan Puskesmas di\nDaerah Tertinggal, Perbatasan dan Kepulauan terluar (PDTPK).\n\nJenis, kualifikasi dan Jumlah Tenaga Laboratorium Puskesmas dapat dilihat pada tabel 1 berikut:\n\nNo Kualifikasi Pendidikan Labkesmas Tingkat 1 Jumlah\n\n1 D3/D4 ATLM 1\n2 Snitarian/Kesling 1\n\nKetentuan lainnya:\n1. Penambahan tenaga pelaksana tergantung dari beban kerja laboratorium.\n2. Penanggung jawab Laboratorium Puskesmas adalah dokter Puskesmas/kepala Puskesmas.\n3. Tenaga teknis dianjurkan jangan merangkap tugas lain.\n4. Setiap petugas laboratorium harus mempunyai uraian tugas yang tertulis dan diketahui oleh\nkepala Puskesmas"},{"page":113,"text":"Struktur Laboratorium Kesehatan 113\n\nTugas pokok SDM di dalam laboratorium sesuai yang diatur dalam\nPermenkes 37 tahun 2012 adalah sebagai berikut:\n\nPenanggung Jawab Laboratorium Tenaga Teknis\nPuskesmas\n1. Melaksanakan kegiatan teknis\n1. Menyusun rencana kerja dan operasional laboratorium sesuai\nkebijakan teknis laboratorium; kompetensi dan kewenangan\n2. Bertanggung jawab terhadap mutu berdasarkan pedoman pelayanan\nlaboratorium, validasi hasil dan standar prosedur operasional;\npemeriksaan laboratorium, 2. Melaksanakan kegiatan mutu\nmengatasi masalah yang timbul laboratorium;\ndalam pelayanan laboratorium; 3. Melaksanakan kegiatan pencatatan\n3. Melaksanakan pengawasan, dan pelaporan;\npengendalian dan evaluasi kegiatan 4. Melaksanakan kegiatan kesehatan\nlaboratorium; dan keselamatan kerja laboratorium;\n4. Merencanakan dan mengawasi 5. Melakukan konsultasi dengan\nkegiatan pemantapan mutu. penanggung jawab laboratorium atau\ntenaga kesehatan lain;\n6. Menyiapkan bahan rujukan spesimen"},{"page":114,"text":"Sarana dan prasarana Laboratorium Kesehatan 114\n\nSarana laboratorium merupakan segala sesuatu yang berkaitan dengan fisik\nbangunan/ruangan laboratorium itu sendiri, dalam lingkup ini adalah ruangan\nLaboratorium Puskesmas. Persyaratan sarana/ruangan Laboratorium Puskesmas adalah\nsebagai berikut:\n\n1. Ukuran ruang minimal 3x4 m2, kebutuhan luas ruang disesuaikan dengan jenis\npemeriksaan yang diselenggarakan oleh Puskesmas.\n2. Langit-langit berwarna terang dan mudah dibersihkan.\n3. Dinding berwarna terang, harus keras, tidak berpori, kedap air, dan mudah dibersihkan\nserta tahan terhadap bahan kimia (keramik).\n4. Lantai harus terbuat dari bahan yang tidak licin, tidak berpori, warna terang, dan\nmudah dibersihkan serta tahan terhadap bahan kimia (epoxi, vinyl).\n5. Pintu disarankan memiliki lebar bukaan minimal 100 cm yang terdiri dari 2 dua daun\npintu dengan ukuran 80 cm dan 20 cm.\n6. Disarankan disediakan akses langsung (lubang/celah) bagi pasien untuk memberikan\nsampel dahak.\n7. Pada area bak cuci disarankan untuk menggunakan pembatas transparan (contoh:\npembatas polikarbonat) untuk menghindari paparan/tampias air cucian ke area\nsekitarnya.\n8. Kamar kecil/WC pasien laboratorium dapat bergabung dengan WC pasien Puskesmas"},{"page":115,"text":"Sarana dan prasarana Laboratorium Kesehatan 115\n\nPrasarana laboratorium merupakan jaringan/instalasi yang membuat suatu sarana yang ada bisa berfungsi sesuai dengan tujuan\nyang diharapkan. Prasarana-prasarana Laboratorium Puskesmas yang perlu diperhatikan adalah sebagai berikut:\n\n1. Pencahayaan harus cukup. Pencahayaan alami diperoleh setidaknya dari jendela dengan luas minimal 1,6 m2 (yaitu terdiri dari\n2 jendela dengan ukuran lebar 80 cm x tinggi 100 cm). Cahaya dari jendela tidak boleh langsung mengarah ke meja\npemeriksaan dan rak reagen, untuk menghindari terjadinya reaksi antara reagen dengan sinar matahari yang panas.\n2. Ruangan harus mempunyai sirkulasi udara yang baik (ventilasi silang/cross ventilation), sehingga pertukaran udara dari dalam\nruangan dapat mengalir ke luar ruangan. Pertukaran udara yang disarankan adalah 12 s/d 15 kali per jam (Air Change per\nHour; ACH = 12–15 times).\n3. Disarankan pada area pengambilan sampel dilengkapi exhauster yang mengarah keluar bangunan Puskesmas ke area\nterbuka sehingga pasien tidak dapat memapar/memajan petugas Puskesmas. Exhauster dipasang pada ketinggian + 120 cm\ndari permukaan lantai. - 13 –\n4. Suhu ruangan tidak boleh panas, dengan sirkulasi udara yang baik maka disarankan suhu dipertahankan antara 220C s/d 260C.\n5. Pengambilan dahak dilakukan di ruangan terbuka yang telah disiapkan.\n6. Harus tersedia fasilitas air bersih yang mengalir dan debit air yang cukup pada bak cuci. Air tersebut harus memenuhi syarat\nkesehatan.\n7. Harus tersedia wadah (tempat sampah) khusus/terpisah yang dilengkapi dengan penutupnya untuk pembuangan limbah\npadat medis infeksius dan non infeksius pada laboratorium. Pengelolaan (pewadahan, pengangkutan dan pemusnahan)\nlimbah padat dilakukan sesuai prosedur dan peraturan yang berlaku.\n8. Limbah cair/air buangan dari laboratorium harus diolah pada sistem/instalasi pengolahan air limbah Puskesmas."},{"page":116,"text":"116Perlengkapan dan peralatan Laboratorium\nKesehatan\n\nPerlengkapan\n\n1. Meja pengambilan sampel darah 6. Lemari pendingin (refrigerator)\n• Minimal menggunakan meja ½ biro (ukuran • Fungsinya adalah untuk menyimpan reagen\n90 x 60 cm) dan sampel, volume sesuai kebutuhan\n• Mempunyai laci • Reagen dan sampel disimpan dalam lemari\n2. Loket pendaftaran, penerimaan sampel urin pendingin yang terpisah\ndan dahak, pengambilan hasil 7. Lemari alat\n3. Kursi petugas laboratorium dan kursi pasien • Fungsinya untuk menyimpan alat\n• Mempunyai sandaran • Ukuran sekitar p x l x t = 160 cm x 40 cm x 100\n• Dapat terbuat dari kayu, besi, dan lain-lain cm\n4. Bak cuci/sink • Dapat terbuat dari kayu atau rangka\n• Dilengkapi keran untuk mengalirkan air alumunium dengan rak terbuat dari kaca\nbersih • Khusus untuk mikroskop dilengkapi dengan\n• Ukuran minimal 40 cm x 40 cm dengan lampu 5 watt\nkedalaman bak minimal 30 cm 8. Rak reagen\n• Dilengkapi saluran/pipa pembuangan air • Fungsinya adalah untuk menyimpan reagen\nkotor menuju sistem pengolahan air limbah • Ukuran sesuai kebutuhan\nPuskesmas • Dapat terbuat dari kayu dilapisi dengan\n5. Meja pemeriksaan teflon/ formika atau dapat terbuat dari\n• Lebar meja adalah 60 cm dengan panjang kaca\nsesuai dengan kebutuhan pelayanan yang\ndiselenggarakan\n• Meja pemeriksaan terbuat/dilapisi dari\nbahan tahan panas, tahan zat kimia\n(seperti teflon/ formika), mudah dibersihkan,\ntidak berpori dan berwarna terang\n• Ada meja khusus untuk meletakkan alat\ncentrifuge"},{"page":117,"text":"117Perlengkapan dan peralatan Laboratorium\nKesehatan\n\nMikroskop Binokuler Mikroskop terdiri dari :\n\n1. Tabung okuler\n2. Prisma\n3. Pemutar lensa objektif\n4. Lensa objektif\n5. Meja sediaan\n6. Kondensor dan\ndiafragma\n7. Cermin\n8. Kaki mikroskop atau\nlandasan\n9. Lensa okuler\n10. Pegangan mikroskop\n11. Makrometer\n12. Mikrometer"},{"page":118,"text":"118\n\nAlur Pelayanan Laboratorium"},{"page":119,"text":"119\n1. Tujuan pelayanan Laboratorium\n2. Pemeriksaan spesimen klinis\n3. Alur pelayanan dalam laboratorium\n4. Alur Pelayanan Laboratorium dalam puskesmas untuk spesimen\nrujukan\n5. Alur Pelayanan Laboratorium dalam puskesmas untuk spesimen\nSampel lingkungan, vektor dan BPP\n6. Pengembilan spesimen klinis\n• Pengambilan spesimen dahak\n• Darah vena (dengan phlebotomy/tabung vacuum, Jarum\nsuntik dan wing needle)Alur Pelayanan\n• Pengembilan darah kapilerLaboratorium\n• Pengambilan Dry blood Spor (DBS) untuk pemeriksaan darah\nbayi\n• Pengambilan Urin\n• Pengambilan Fese/tinja\n• Pengambilan Sekret uretra, endocervix dan vagina\n7. Pemeriksaan spesimen klinis\n• Pemeriksaan RDT malaria\n• Pemeriksaan Apusan darah malaria\n• Pemeriksaan HIV\n• Pemeriksaan TCM"},{"page":120,"text":"Tujuan Pelayanan Laboratorium 120\n\nTujuan Pelayanan Laboratorium\nPemeriksaan spesimen\nklinisMelaksanakan pengukuran,\npenetapan, dan pengujian\nterhadap bahan yang berasal Pengujian sampel\nlingkungandari manusia untuk penentuan\njenis penyakit, penyebaran\npenyakit, kondisi kesehatan, Pengujian vektor dan\natau faktor yang dapat BPP\nberpengaruh pada kesehatan\nperorangan dan masyarakat di\nwilayah kerja Puskesmas"},{"page":121,"text":"Pemeriksaan spesimen klinis Labkesmas Tk. 1 121\n\nNo PARAMETER SPESIMEN METODE ALAT REAGEN\nA. Hematologi\nDarah k l 70 %\ndarah berikutnya boleh dipakai untuk pemeriksaan 5. Obyek glass"},{"page":139,"text":"139\nPengambilan Spesimen Klinis\n\nPengambilan kapiler darah bayi\n\nAlat dan bahan:\n1. Sarung tangan\n2. Kartu DBS\n3. Lancet 2mm\n4. Disinfektan\n5. Kasa atau kapas\n6. Alat tulis\n7. Penyimpanan limbah barang tajam\nPilihlah tempat yang sesuai untuk pengambilan\nFormat laporan: dan mintalah ibu menghangatkan daerah itu\n1. Register klinik dengan mengelusnya:\n2. Format laporan permintaan dan\n• Bayi 6 mgg – 4 bln di tumit laporan hasil\n• Bayi 4 bulan – 10 bln pada jempol kaki\n• Bayi diatas 10 bulan atau berat >10kg : jari\ntangan."},{"page":140,"text":"140\nPengambilan Spesimen Klinis\n\nPengambilan Dry blood Spor (DBS)\nuntuk pemeriksaan darah bayi\n\nAlat dan bahan\n\n1. Cucilah tangan dan gunakan sarung\ntangan lateks\n2. Posisikan daerah penusukan lebih rendah,\ndisinfektan dan tunggu sktr 30 detik hingga\nkering\n3. Lakukan penusukan dengan menggunakan\nlancet 2 mm pada daerah yang telah\nditentukan dan biarkan darah mengalir\n4. Usap darah yang keluar pertama, dan\nbiarkan darah berikutnya terkumpul\n5. Tempelkan kertas DBS pada Kumpulan\ndarah dan tampung darah minimal pada\nketiga lingkaran kertas DBS\n6. Bersihkan sisa darah dengan menekan\nContoh spesimen yang valid daerah penusukan dan lengkapi\npencatatan dan pelaporan DBS"},{"page":141,"text":"141\nPengambilan Spesimen Klinis\n\nTeknik pengambilan urin pada Wanita Teknik pengambilan urin pada anak anak Teknik pengambilan urin pada laki laki\n\nPada pengambilan spesimen urin porsi 1. Pasien sebelumnya diberi minum untuk 1. Penderita harus mencuci rangan\nTengah yang dilakukan oleh penderita memudahkan buang air kecil memakai sabun kemudian dikeringkan\nsendir, sebelumnya harus diberikan 2. Bersihkan alat genital seperti yang dengan handuk\npenjelasan sebagai berikut: telah diterangkan di atas 2. Jika tidak disunat Tarik kulit preputium\n3. Pengambilan urin dilakukan dengan ke belakang, aliran yang pertama  Masukkan lidi dacron ke dalam rongga hidung. Posisi saline steril hingga menyentuh dinding belakang faring\nlidi tegak lurus. Panjang lidi yang masuk kira kira jarak 5. Usap kekiri dan kanan dinding belakang faring dan\nujung hidung sampai telinga. Masukkan sampai tonsil lalu Tarik keluar dengan hati hati tanpa\nmenyentuh dinding belakng nasofaring, kemudian menyentuh bagian mulut yang lain.\nTarik keluar. 6. Masukkan lidi kaps ke dalam media transport atau\n5. Masukkan lidi dakron ke dalam media transport atau langsung tanam pada media isolaso (agar darah,\nlangsung tanam pada media isolaso (agar darah, agar Thayer martin, Agar Cystin Tellurite) dan buat\nagar Thayer martin, Agar Cystin Tellurite) dan buat sediaan\nsediaan\n\nAlat dan Bahan :\n1) Sarung tangan\n2) Kapas lidi\n3) Spatula\n4) Tabung spesimen"},{"page":147,"text":"147\nPengambilan Spesimen Klinis\n\nPemeriksaan Rapid Diagnostic Test (RDT) malaria\n\n1. Ambil 2-5 µl darah ujung jari dengan tabung mikro kapiler dan teteskan pada kotak sampel\nyang terdapat pada dipstik. Tidak dianjurkan meneteskan darah 42 secara langsung ke kotak\nsampel. Pada beberapa jenis kit RDT dapat juga digunakan darah dengan\nantikoagulan/plasma.\n2. Teteskan larutan buffer pada tempat yang sudah ditentukan sesuai dengan petunjuk kit RDT.\nBuffer berisi komponen hemolisis dan antibodi spesifik yang sudah dilabel dengan Gold koloid.\n3. Jika darah berisi Antigen Malaria, maka kompleks antigen antibodi akan terbentuk dan terlihat\nsebagai garis sesuai dengan jenis antibodi yang ada pada strip tsb. Sedangkan garis kontrol\nakan terlihat, walaupun darah tersebut tidak mengandung antigen Malaria. Hal ini\nmenunjukkan bahwa kit/strip tersebut masih memenuhi syarat (berfungsi dengan baik)\n4. Waktu yang diperlukan untuk membaca hasil RDT berkisar antara 15-30 menit.\n5. Interpretasi hasil sesuai petunjuk pada kit."},{"page":148,"text":"148\nPengambilan Spesimen Klinis\n\nPemeriksaan Rapid Diagnostic Test (RDT) malaria\n\n1. Jari manis/tengah penderita dibersihkan dengan kapas alkohol 70% (atau dengan disposible alcohol swab)\n2. Kemudian jari diseka kembali dengan kasa steril untuk membersihkan kemungkinan adanya sisa alkohol di\njari.\n3. Tusuk Jari manis/jari tengah dengan lanset steril.\n4. Seka darah yang pertama keluar dengan kapas kering.\n5. Ambil darah dengan loop/ micro capiler tube yang tersedia. Jumlah darah yang diambil harus tepat.\nPastikan loop terisi penuh oleh darah.\n6. Teteskan darah tersebut di kotak tempat sampel darah. Dengan cara menyentuhkan loop pada kotak\nuntuk darah (posisi loop harus vertikal/tegak lurus)\n7. Kemudian teteskan cairan buffer pada kotak buffer. Jumlah tetesan tergantung jenis RDT ( umumnya 4 – 6\ntetes). Posisi botol buffer tegak lurus.\n8. Diamkan dan biarkan darah tercampur dan meresap pada kotak T (tes)\n9. Umumnya hasil dibaca setelah menit 15 (maksimal sampai 30 menit ) Baca hasil tes ditempat yang terang\n10. Tulis hasil tes dekat kotak T (Tes/ hasil) dan pada buku laporan tes.\n11. Tes tanpa garis kontrol berarti tidak valid, tes harus diulang dengan menggunakan RDT yang baru.\n12. Bila telah melewati 30 menit, hasil tidak boleh dibaca lagi karena sudah tidak valid.\n\nCara membaca hasil tes RDT jenis single (contoh: Paracheck P.f):\n• Bila terdapat 1 (satu) garis berwarna pada jendela Tes (T) dan 1 (satu) garis pada jendela kontrol\n(C) menunjukkan positif P.falciparum\n• Bila tidak terdapat garis berwarna pada jendela Control (C) menunjukkan kesalahan pada RDT\n(tes harus diulangi).\n• Bila terdapat garis pada jendela kontrol (C) menunjukkan negatif P.falciparum"},{"page":149,"text":"149\nPengambilan Spesimen Klinis\n\nAlat pewarnaan sampel apusan darah Malaria\n1. Slide/Kaca sediaan (Object Glass)\n• Slide yang sudah tergores tidak boleh dipakai. Yang terbaik adalah menggunakan object glass yang baru,\ndan tidak boleh menggunakan slide bekas pakai. Semua object glass direndam dalam air sabun selama 30\nmenit – 1 jam kemudian dibilas dengan air mengalir.\n• Membersihkan object glass: Dilap dengan kasa atau kain bersih. Setelah kaca sediaan dibersihkan, tidak\nboleh memegang pada bagian permukaan kaca sediaan, dan langsung dipakai atau disimpan pada slide\nbox.\n• Menyimpan object glass: Slide box yang yang dianjurkan adalah terbuat dari bahan plastik/fiber yang tahan\npecah. Slide box sebaiknya tidak terbuat dari bahan kayu karena dapat berpengaruh pada SD yang\ndisimpan. Ketebalan object gelas 1,1 – 1,3 mm, ukurannya 25 x 75 x 1 – 1,5 mm.\n2. Lancet steril, digunakan hanya untuk 1x pakai.\n3. Kapas, jika tidak tersedia kapas, dapat digunakan bahan halus.\n4. Alkohol 70 %, lebih baik lagi jika menggunakan swab alkohol siap pakai.\n5. Minyak imersi (immersion oil)\n6. Larutan buffer (pH 7.2)\n7. Larutan Giemsa\n8. Metanol"},{"page":150,"text":"150\nPengambilan Spesimen Klinis\n\nPenyiapan dan pewarnaan sampel apusan darah Malaria\n\n1. Lokasi yang akan diambil darah dibersihkan dengan kapas alkohol untuk menghilangkan kotoran dan minyak\nyang menempel, kemudian keringkan.\n2. Setelah kering, lokasi tersebut ditusuk secara cepat dengan menggunakan lanset. Kemudian lanset dibuang\npada tempat yang aman.\n3. Tetes darah pertama yang keluar dibuang dan dibersihkan dengan tisu, untuk menghilangkan bekuan darah\ndan sisa alkohol.\n4. Tetes darah berikutnya diteteskan di atas kaca objek, 1 tetes kecil darah (± 2 µl/diameter 1-2 mm) di bagian\ntengah untuk SD tipis, 2 - 3 tetes kecil darah (± 6 µl/diameter 2-4 mm) di bagian ujung dekat label untuk SD\ntebal.\n5. Darah sisa pada lokasi pengambilan dibersihkan.\n6. Kaca objek yang sudah berisi tetesan darah diletakkan di atas meja atau permukaan yang datar.\n7. Untuk membuat SD tipis, dengan menempelkan ujung kaca objek yang lain (bukan cover glass) pada tetes\ndarah kecil sampai darah menyebar sepanjang ujung kaca objek tersebut.\n8. Dengan membentuk sudut 450 , kaca objek digeser dengan cepat ke arah yang berlawanan dengan tetes\ndarah tebal, sehingga didapatkan sediaan hapus (seperti bentuk lidah)\n9. SD tebal dibuat dengan cara menempelkan salah satu ujung kaca objek yang lain pada ketiga tetes darah\ntebal. Darah dibuat homogen dengan cara memutar ujung kaca objek searah jarum jam dari arah luar ke\ndalam, sehingga terbentuk bulatan dengan diameter 1 – 1,5 cm\n10. SD dikeringkan dengan pada tempat yang datar. Pengeringan tidak boleh pada suhu yang panas karena\ndapat mengakibatkan SD menjadi pecah-pecah.\n11. Selama proses pengeringan, SD dihindarkan dari serangga (semut, lalat, kecoa, dll), debu, kelembaban yang\ntinggi, dan getaran.\n12. Setelah kering, sediaan harus segera diwarnai menggunakan larutan giemsa. Pada keadaan yang tidak\nmemungkinkan, boleh ditunda selambat-lambatnya dalam waktu 24 jam SD harus sudah diwarnai."},{"page":151,"text":"151\nPengambilan Spesimen Klinis\n\nAlur Pemeriksaan HIV\n\nTujuan\nMelakukan pemeriksaan terkait HIV meliputi pemeriksaan HIV, EID dan pemantauan terapi (pemeriksaan jumlah limfosit CD4, viral load, dan\nefek samping terapi).\n1. Bahan pemeriksan\n1. Bahan pemeriksaan dapat berupa serum, plasma, whole blood, Dried Blood Spot (DBS) sesuai dengan petunjuk dari reagensia\nyang dipakai\n2. Reagensia\n1. Reagensia berprinsip imunokromatografi atau aglutinasi (rapid test) dilakukan pada semua sarana pelayanan laboratorium tingkat\ndasar\n2. Pemilihan jenis reagensia (EIA atau rapid test) harus didasarkan pada:\n• Sarana dan prasarana yang tersedia, termasuk SDM terlatih\n• Waktu yang diperlukan untuk mendapatkan hasil\n• Jumlah spesimen yang diperiksa dalam satu kali pengerjaan\n• Reagensia dengan masa kadaluarsa yang lebih panjang\n3. Peralatan, Peralatan yang dibutuhkan oleh laboratorium pemeriksa antiHIV adalah:\n1. Alat-alat keamanan dan keselamatan kerja petugas laboratorium:\n2. Alat-alat persiapan dan penyimpanan bahan pemeriksaan:\n3. Alat-alat pemeriksaan:\n4. Prosedur pemeriksan terkait HIV, Masing-masing prosedur harus tertulis dalam Standar Operasional Prosedur (SOP), yang selalu\ndilakukan update, sesuai dengan reagensia yang dipakai saat tersebut, serta harus dilakukanpemantapan mutu internal."},{"page":152,"text":"152\nPengambilan Spesimen Klinis\n\nAlur Pemeriksaan HIV\n\n1. Pemeriksaan Serologis pada orang dewasa\nMetode pemeriksaan serologis ang digunakan adalah:\n1) Rapid diagnostic test (RDT)\n2) Enzyme immuno assay (EIA)\nSecara umum metode perneriksaan rapid test [tes cepat) dan ElA adalah untuk mendeteksi antigen dan atau\nantibodi, Alat diagnostfk yang digunakan untuk pemeriksaan serologis harus mempunyaJ sensitivitas mlnlmal 99%\n[untuk reagen ke-I] dan spesifisitas minimal 98% funtuk reagen ke-2] dan spesifisitas minlmal 99% (untuk reagen ke-3)\ndengan kesalahan baca <5%\n2. Pemeriksaan virologis dilakukan dengan pemerlksaan DNA HIV dan RNA HlV. Pemeriksaan virologis digunakan untuk\nmendlagnosts HIV pada:\n1) Bayi dan anak di bawah 18 bulan;\n2) Pasien pada kasus terminal, dengan hasll pernertksaan antibody yang negatif walaupun gejala kllnis sangat\nmendukung; dan\n3) Konfinnasi hasll Inkonkluslf atau konflrmast untuk dua hasil laboratortum yang berbeda,\nPerneriksaan HIV pada bayi dapat dilakukan dengan mengirimkan spesimen darah bay! menggunakan tetes darah\nkering (dried blood spot atau DBS) ke laboratorium yang dltetapkan"},{"page":153,"text":"153\nPengambilan Spesimen Klinis\n\nAlur Pemeriksaan HIV"},{"page":154,"text":"154\nPengambilan Spesimen Klinis\n\nLangkah Pemeriksaan HIV\n\n1. Siapkan kit reagen HIV ½, biarkan dalam suhu\nkamar\n2. Bukalah tes RDT HIV ( Rapid )dan letakkan diatas\nmeja yang rata dan bersih dan tuliskan identitas\nsampel yang akan diperiksa\n3. Masukkan 5ul sampel (serum, plasma, whole\nblood) kedalam lubang sampel yang terdapat di\ndalam rapid tes, biarkan menyerap ke dalam\nkaset Interpretasi hasil RDT Bioline HIV/Syphilis Duo\n4. Tambahkan 3 tetes diluent ke dalam luabng Nonreactive\nsampel HIV-1/2 Reactive\n5. Baca hasil setelah 12 menit dan tidak lebih dari 20\nmenit Syphilis Reactive\n6. Interpretasi\n• Reaktif : Jika terdapat 2 garis merah (pada HIV-1/2 and Syphilis Reactive\nregio kontrol/C dan regio tes/T)\n• Non Reaktif : Jika hanya 1 garis merah yang\nmuncul pada regio (C)"},{"page":155,"text":"155\nPengambilan Spesimen Klinis\n\nAlur Pemeriksaan viral load HIV dengan TCM\n\n1. Masukkan sample darah (Whole\nblood, DBS atau Plasma) ke dalam 50\nml tabung nunc.\n2. Tambahkan 1,3 ml dH2O\n3. Inkubasi @RT selama 20 menit\n4. Tambahkan 1 ml campuran ke dalam\nkatridge\n5. Masukkan untuk pemeriksaan ke\ndalam TCM"},{"page":156,"text":"156\nPengambilan Spesimen Klinis\n\nAlur Pemeriksaan Sputum dengan TCM\n\nPencatatan\ndalam SITB\n\nPenyimpanan Pasien Rujukan Pengambilen Faskes ya dan (Klaster 2, 3, atau spesimen memiliki Hasil TCM\npengolahan Pustu) dahak TCM?\nspesimen\n\ntidak\n\n1.Rujuk ke Faskes\nTCM Lihat mekanisme\n2.Pemeriksaan BTA rujukan spesimen\n3.Pemeriksaan\npenunjang lain\n\nTindak lanjut Rujuk balik hasil Faskes Perujuk pengobatan dan TCM Edukasi"},{"page":157,"text":"157\nPengambilan Spesimen Klinis\n\nPengoperasian mesin GeneXpert, harap memperhatikan panduan terkait bentuk dan model system pengoperasian alat\nGeneXpert.\n1. Nyalakan alat geneXpert\n1. Jika menggunakan GeneXpert Dx Instrument, nyalakan dahulu instrument setelah itu nyalakan computer.\nSoftware GeneXpert akan berjalan secara otomatis, jika tidak maka klik dua kali shortcut Genexpert ikon pada\ndesktop windows. Atau;\n2. Jika menggunakan GeneXpert Infinity instrument, nyalakan instrument, dan GeneXpert software akan berjalan\nsecara otomatis, jika tidak maka klik dua kali shortcut Genexpert ikon pada desktop windows.\n2. Gunakan username dan password anda untuk dapat Log in ke dalam GeneXpert Instrument System\n3. Pada jendela GeneXpert System, klik pada Create Test (GeneXpert Dx) atau Orders dan Order Test (Infinity).\n4. Scan lah ID Pasien (optional). Jika mengetik/memasukkan ID Pasien, pastikan ID pasien dengan benar. ID Patient akan\nberhubungan dengan hasil dan akan terlihat pada tampilan view Result.\n5. Scan-lah barcode yang ada pada katrid HIV-1 VL, tampilan Create Test akan muncul. Gunakan informasi pada\nbarcode, dan software akan otomatis mengisi pada kolom berikut: Select Assay, Reagent Lot ID, Cartridge SN, dan\nExpiration Date\n6. Klik Start Test (GeneXpert Dx) atau Submit (Infinity). Masukkan password, jika dibutuhkan.\n7. Untuk system GeneXpert, tempatkan katridge pada conveyor belt. Kartridge akan terisi secara otomatis, tes akan\nmulai berjalan,\n8. Secara otomatis pemeriksaan akan berjalan dan selanjutnya kartidge akan ditempatkan di container limbah. Atau\nuntuk instrument GeneXpert Dx:\n1.Buka pintu instrument modul dengan menekan lampu hijau yagn berkedip dan masukkan katridge\n2.Tutup pintu modul, selama pemeriksaan lampu hijau akan tetap menyala dan akan mati setelah pemeriksaan\nselesai\n3.Tunggu beberapa saat sampai system melepas kunci pintu lalu pindahkan katridge.\n4.Katridge yang telah digunakan harus dimusnahkan sesuai dengan standard pemusnahan limbah medis.."},{"page":158,"text":"158\nPengambilan Spesimen Klinis\n\nPemeriksaan Sputum dengan TCM Penyimpanan Sampel dahak\n\n1. Petugas laboratorium pelaksana TCM harus\nmenggunakan APD, yaitu jas laboratorium, masker,\nPenerimaan Sampel dahak dan sarung tangan pada saat membuka kemasan\ndan melakukan proses pemeriksaan spesimen.\n1. Petugas laboratorium pelaksana TCM harus 2. Periksa kerapatan tutup pot dan perhatikan ada\nmemeriksa kelengkapan dan kesesuaian paket tidaknya kebocoran pada pot spesimen. Jika\nspesimen yang diterima dengan formulir TB-05. terdapat pot spesimen yang pecah, maka pot\n2. Petugas laboratorium pelaksana TCM mencatat spesimen diperlakukan sebagai limbah infeksius.\ndata permintaan pemeriksaan TCM ke dalam buku Selanjutnya, harus dilaporkan ke laboratorium\nregister (TB-04). Periksa kesesuaian identitas pada pengirim spesimen melalui telepon/email\npot spesimen dengan lembar pengumpulan dan secepatnya dan dimintakan spesimen baru.\npemeriksaan spesimen. 3. Pemeriksaan harus dilakukan sesegera mungkin,\n3. Bila terdapat ketidaksesuaian identitas dan kualitas namun apabila tidak memungkinkan maka\nspesimen, segera hubungi pengirim untuk penyimpanan spesimen dilakukan pada:\nmelakukan klarifikasi. i. Suhu 2-8oC. Spesimen harus diolah dalam 7 hari,\nATAU\nii.Suhu ruang. Spesimen harus segera diolah\ndalam 3 hari.\n4. Bila spesimen yang terkumpul tidak memenuhi\nkualifikasi sebagai spesimen yang berkualitas,\npetugas laboratorium berhak meminta pasien\nterduga TB memberikan spesimen kembali.\n5. Petugas laboratorium pelaksana TCM harus\nmencuci tangan dengan sabun dan air mengalir,\nserta membilas kedua tangan dengan alkohol 70%\nsetelah melakukan penyimpanan spesimen."},{"page":159,"text":"159\nPengambilan Spesimen Klinis\n\nPemeriksaan Sputum dengan TCM\n\nPengolahan Sampel dahak\n\n1. Beri label identitas pada setiap katrid. Identitas spesimen\ndapat ditempel atau ditulis pada bagian sisi katrid.\nJANGAN memberikan label pada bagian barcode.\n2. Bukalah penutup pot dahak, tambahkan Sample\nReagent yang sudah tersedia sebanyak 2 kali volume\nspesimen. .\n3. Tutup kembali pot dahak, kemudian kocok dengan kuat 1. Campur Sample Reagent dengan sampel,\nsampai campuran dahak dan Sample Reagent menjadi kocok, dan inkubasi\nhomogen. 2. Masukkan spesimen ke dalam katrid\n4. Diamkan selama 10 menit pada suhu ruang. 3. Masukkan katrid yang sudah berisi spesimen ke\n5. Kocok kembali campuran, lalu diamkan selama 5 menit. dalam alat TCM\n6. Bila masih ada gumpalan, kocok kembali agar campuran\ndahak dan Sample Reagent menjadi homogen sempurna\ndan biarkan selama 5 menit pada suhu kamar. Catatan:\n7. Buka penutup katrid, kemudian buka tempat penampung • Spesimen yang sudah diolah dan masuk ke dalam katrid spesimen. Gunakan pipet yang disediakan untuk harus segera dimasukkan ke dalam alat TCM. Saat\nmemindahkan spesimen dahak yang telah diolah mengolah beberapa spesimen dalam satu waktu,\nsebany tidak adat anda 4. Pastikan wadah tertutup rapat,\ntandakebucoran. dan tidak adatanda tandan\n5. Pada beberapa sample, penjaga kebocoran.\nsuhu (es, atau pendingin lainnya) 5. Pada beberapa sample, penjaga\ndapat ditambahkan tapi jangan suhu (es, atau pendingin lainnya)\nsampai menyentuh atau terpapat dapat ditambahkan tapi jangan\nlangsung ke wadah container sampai menyentuh atau terpapat\nlapis pertama langsung ke wadah container\n6. Pastikan label untuk spesimen, lapis kedua\natau informasi lainnya terpasang 6. Pastikan stiker peringatan\njelas pada permukaan paket lapis terpasang dengan benar pada\nkedua. luar wadah ketiga, yaitu stiker\nspesimen, bahan infeksius,\nperingatan jangan dibanting atau\ndi balik, dan Alamat tujuan dari\npaket"},{"page":166,"text":"166Tatacara Pengepakan Spesimen Rujukan dengan\nPaket\n\nTata cara pengepakan dan labeling bahan infeksius kategori B Tata cara pengepakan dan labeling bahan infeksius kategori A\n\nPenyimpanan pertama Tutup anti\n(anti tumpah atau kedap tumpah\nTutup anti air)\ntumpah Penyimpanan\npertama (testtube) Penahan bentukan rak\n(Styrofoam, atau busa)\nPenahan bentukan\nrak (Styrofoam, atau\nbusa) Daftar isi dari spesien\nPackingan (catatan Spesimen)\nMaterial paket kedua\nabsorban (kedap air)\nBungkus paket Daftar isi dari spesien\nluar yang (catatan Spesimen)\nkokoh\n\nOrientasi dan\nposisi dari paket\n(bukan\nBungkus paket luar keharusan ketika\nPackingan yang kokoh penyimpanan\nkedua pertama tidak\n(antibocor atau melebihi 50ml)\nkedap air)\n\nNama pengiriman\nyang tepat\n\nTanda dan lambing\npaket\nLabel dari/kepada Tandan dan lebel UN"},{"page":167,"text":"167\nMekanisme Rujukan dan Pembinaan\n\nPrinsip Utama Mekanisme rujukan dan pembinaan\n\n1. Puskesmas dapat melakukan rujukan spesimen klinis dan rujukan sampel lingkungan,\nvektor dan BPP. Rujukan dapat dilakukan secara horizontal ke Puskesmas lain yang\nmemiliki fasilitas pemeriksaan yang dibutuhkan. Selain itu, dapat juga dilakukan\nrujukan vertikal ke Labkesmas tingkat di atasnya atau ke laboratorium jejaring\nLabkesmas misalnya Rumah Sakit atau laboratorium medis lainnya.\n2. Laboratorium akan mendapat pembinaan mutu, monitoring dan evaluasi dari\nLabkesmas Tingkat 2 (Labkesda kabupaten/kota) bersama Dinas Kesehatan\nkabupaten/kota setempat minimal 1 kali setahun."},{"page":168,"text":"168\n\n1. Tujuan Pemantauan mutu\n2. Mekanisme rujukan dan pembinaan\n3. Mekanisme pemantauan mutu\nPemantauan Mutu\n4. Mekanisme pemantauan mutu internal\ndan Pembinaan\na.Kalibrasi Alat\nb.Uji kualitas air\n5. Mekanisme pemantauan mutu Eksternal"},{"page":169,"text":"Tujuan Pemantauan Mutu dan Pembinaan 169\n\nDemi menjamin tercapainya dan\nterpeliharanya mutu dari waktu ke waktu,\ndiperlukan bakuan mutu berupa standar/\nbakuan yang tertulis yang dapat dijadlkan\npedoman kerja bagi tenaga pelaksana.\nPemantauan Mutu1. Tiap pelaksana yang ditunjuk memiliki\npegangan yang Jeias tentang apa dan\nbagaimana prosedur melakukan suatu\naktivltas. Mekanisme Pembinaan\n2. Standar yang tertulis memudahkan proses\npelatlhan bagi tenaga pelaksana baru\nyang akan dipercayakan untuk\nmengerjakan suatu aktivltas.\n3. Keglatan yang dllaksanakan dengan\nmenglkuti prosedur baku yang tertulis\nakan menjamin konslstennya mutu hasll\nyang dicapal."},{"page":170,"text":"Mekanisme Pemantauan Mutu dan Pembinaan 170\n\n2. Pemantapan Mutu Eksternal (PME/External\nPemantapan mutu (quality assurance)\nQuality Control) Pemantapan Mutu Eksternal\nlaboratorium adalah keseluruhan proses atau\nadalah kegiatan yang diselenggarakan\nsemua tindakan yang dilakukan untuk\nsecara periodik oleh pihak lain di luar\nmenjamin ketelitian dan ketepatan hasil\nlaboratorium yang bersangkutan untuk\npemeriksaan. Kegiatan ini berupa :\nmemantau dan menilai penampilan suatu\n1. Pemantapan Mutu Internal (PMI/Internal\nlaboratorium dalam bidang pemeriksaan\nQuality Control) Pemantapan Mutu Internal\ntertentu. Penyelenggaraan kegiatan\n(PMI) adalah kegiatan pencegahan dan\nPemantapan Mutu Eksternal dilaksanakan\npengawasan yang dilaksanakan oleh\noleh pihak pemerintah, swasta atau\nsetiap laboratorium secara terus menerus\ninternasional.\nagar tidak terjadi atau mengurangi\n3. Peningkatan Mutu Peningkatan Mutu adalah\nkejadian kesalahan atau penyimpangan\nsuatu proses terus menerus yang dilakukan\nsehingga diperoleh hasil pemeriksaan yang\noleh laboratorium sebagai tindak lanjut dari\ntepat. Cakupan Objek Pemantapan Mutu\nPemantapan Mutu Internal (PMI) dan\nInternal meliputi aktivitas: tahap praanalitik,\nPemantapan Mutu Eksternal (PME) untuk\ntahap analitik dan tahap pasca analitik\nmeningkatkan kinerja laboratorium"},{"page":171,"text":"Mekanisme Pemantauan Mutu 171\n\nsarana Pemantauan Mutu Internal dan ya ya Mekanisme ada petugas analis prasarana (PMI) dan Pemantauan Mutu\nmemadai? lab? pembinaan rutin Eksternal (PME)\n\ntidak tidak\nPelatihan dan OJT\npetugas\nlaboratorium\nKordinasi dan ya\nmanajemen pengadaan dapat dilakukan\nuntuk pemeriksaan task shifting?\nlaboratorium sederhana\n\ntidak"},{"page":172,"text":"Mekanisme Pemantauan Mutu Internal 172\n\nTujuan: Manfaat Pemantapan Mutu Internal\n1. Pemantapan dan penyempurnaan metode Pemantapan mutu internal adalah kegiatan\npemeriksaan dengan mempertimbangkan aspek pencegahan dan pengawasan yang\nanalitik dan klinis. dilaksanakan oieh masing-masing Iaboratorium\n2. Mempertinggi kesiagaan tenaga, sehingga\nsecara terus menerus agar tidak terjadi atau\npengeluaran hasil yang salah tidak terjadi dan\nmengurangi kejadian error/penyimpangan perbaikan penyimpangan dapat dilakukan segera.\nsehingga diperoleh hasil pemeriksaan yang3. Memastikan bahwa semua proses mulai dari\npersiapan pasien, pengambilan, pengiriman, tepat.\npenyimpanan dan pengolahan spesimen sampai\ndengan pencatatan dan pelaporan telah\ndilakukan dengan benar.\n4. Mendeteksi penyimpangan dan mengetahul\nsumbernya\n5. Membantu perbaikan pelayanan kepada\npelanggan (customer)."},{"page":173,"text":"Mekanisme Pemantauan Mutu Internal 173\n\nBeberapa kegiatan pemantapan mutu internal yang dibahas :\n\nPersiapan Pasien Pengambilan dan Kalibrasi Peralatan\nPengolahan Spesimen\n\nSebelum spesimen diambil, Spesimen harus diambil Salah satu faktor yang\npasien harus dipersiapkan secara benar dengan dapat mempengaruhi\nterlebih dahulu dengan memperhatlkan waktu, hasil pemeriksaan\nbaiksesuai dengan lokasi, volume,cara, Iaboratorium adalah\npersyaratan pengambilan peralatan, wadah peralatan Iaboratorium,\nspesimen spesimen, pengawet / oieh karena itu alat perlu\nantikoagulan, sesuai dipelihara dan dikalibrasi\ndengan persyaratan secara berkala\npengambilan spesimen\nyang telah diuraikan\npada."},{"page":174,"text":"174\n\nKalibrasi Alat:\n1. Inkubator\n2. Lemari Es\n3. Oven\n4. Autoclave\n5. Peralatan Elisa\nMekanisme 6. pH Meter\nPemantauan Mutu\n7. Pipet\nInternal\n8. Penangar air (Waterbath)\n9. Sentrifus (centrifuge)\n10.Spektrofotometer (spectrophotometer)\n11.TImbangan analitik (Analytical Balance)\n12.Timbangan elektrik (ElectricalBalance)\n13.Termometer"},{"page":175,"text":"175\nMekanisme Pemantauan Mutu Eksternal\n\nPemantapan Mutu Eksternal adalah kegiatan yang diselenggarakan secara periodik oleh pihak lain\ndi luar laboratorium yang bersangkutan untuk memantau dan menilai penampilan suatu\nlaboratorium dalam bidang pemeriksaan tertentu. Penyelenggaraan kegiatan Pemantapan Mutu\nEksternal dilaksanakan oleh pihak pemerintah, swasta atau internasional.\n\nManfaat Pemantapan Mutu Eksternal\n1. Bagi Laboratorium\n• Mampu membandingkan hasil tes laboratoriumnya dengan laboratorium lain\n• Memberikan informasi mengenai systemic error dari alat laboratorium peserta dan secara\nobyektif memberikan informasi kualitas pengujian.\n• Menjadi salah satu dasar untuk menentukan laboratorium peserta membutuhkan perbaikan\nperalatan atau memberikan pelatihan tenaga teknis laboratorium.\n2. Bagi Masyarakat\n• Hasil pemeriksaan sampel pasien memiliki keakuratan dan validitas yang baik (terpercaya).\n• Diagnosa dan rencana terapi dokter menjadi lebih tepat sehingga mengurangi risiko terjadinya\nkesalahan pengobatan (medication error) akibat kesalahan hasil pemeriksaan laboratorium."},{"page":176,"text":"176\nMekanisme Pemantauan Mutu Eksternal\n\nLabkesmas Tingkat 4 Labkesmas Tingkat 1 (Puskesmas)\n\nPermintaan dan\npembayaran Uji mutu\n(PME)\n\nPenginputan hasil\nPengujian sampel uji Mengirimkan sampel pemeriksaan ke oleh uji kepada Puskesmas tautan laman peserta/puskesmas Labkesmas Tingkat 4\n\nUnduh hasil dan Evaluasi hasil sertifikat"},{"page":177,"text":"177\n\nMekanisme Pencatatan,\nPelaporan dan Analisis Data\nberbasis Laboratorium"},{"page":178,"text":"Tujuan Mekanisme Pencatatan dan Pelaporan 178\n\nTujuan Mekanisme Pencatatan dan\nJenis data-data yang\nPelaporan dilakukan pencatatan\ndan pelaporan\n\n1. Dokumentasi pelayanan\nlaboratorium Kesehatan Pencatatan dan\npelaporan labkesmas\n2. Bentuk validasi data Tingkat layanan\nkesehatan"},{"page":179,"text":"179\nPengelolaan, Analisis, dan Penyajian Data\n\nPrinsip Utama Pengelolaan, analisis, dan penyajian data\n\n1. Petugas laboratorium wajib melakukan analisis data rutin dalam fungsi identifikasi awal\nkemungkinan krisis yang timbul di wilayah kerjanya\n2. Pencatatan dan pelaporan dari seluruh bagian fasilitas Kesehatan harus mampu\nterintegrasi sehingga dapat divalidasi dengan data dan temuan laboratorium\n3. Validasi data rutin sebagai langkah koordinasi dengan program Kesehatan dalam\nmenjamin kelangsungan program Kesehatan yang berlangsung.\n4. Koordinasi rutin dapat memberi masukan terkait langkah perbaikan untuk layanan\nlaboratorium yang tepat\n5. Peningkatan kapasitas dan pemantauan untuk menjaminan mutu dan tepatnya hasil\ndari layanan laboratorium"},{"page":180,"text":"180\nKomunikasi dengan Pemangku Kepentingan\n\nPrinsip Utama Komunikasi dengan pemangku kepentingan\n\n1. Mekanisme komunikasi dengan pemangku kepentingan adalah mekanisme\naudiensi untuk antisipasi atau tanggap darurat baik pra krisis maupun keadaan krisis\nKesehatan\n2. Lampiran berupa hasil analisis data laboratorium sebagai dasar komunikasi dengan\npemangku kepentingan\n3. Analisis data adalah kegiatan rutin laboratorium puskesmas untuk memonitor\nkeadaan penyakit di wilayah kerja puskesmas secara khusus dan daerah dalam\nskala yang lebih besar"},{"page":181,"text":"181\nPencatatan dan Pelaporan\n\nya sistem validasi ya\npencatatan berbasis\nRegister Pendaftaran data berjalan elektronik/aplikasi? baik?\n\nRegister pemeriksaan\ndan hasil\n\ntidak tidak\nRegister Rujukan\n\nRegister ekspedisi\npengambilan hasil Dokumen\nmanualpemeriks Kendala dengan tidak Alur Pemantauan dan\naan tercatat dan infrastruktur layanan? pengelolaan\nya tersimpan baik?\n\ntidak ya\n\nAlur Mekanisme pembinaan rutin\n\nMekanisme\nAlur Mekanisme manajemen perbaikan\npembinaan rutin infrastruktur\nlaboratorium"},{"page":182,"text":"182\nPengelolaan, Analisis dan Penyajian Data\n\nIkuti alur Analisis data laboratorium\npencatatan dan ya Rekapitulasi dan\npencatatan dan pelaporan Ikuti alur Analisis data penyajian data\npelaporan lab. rutin laboratorium secara laboratorium laboratorium\nelektronik?\n\nRujukan kasus\nDisajikan dalam pemeriksaan\nlokakarya mini tidak\nsebagai bagian\nidentifikasi masalah\n\nada dilakukan validasi ya Rekapitulasi\ndata laboratoium pencatatan dan\nrutin? pelapran lab manual\n\ntidak\n\nAlur koordinasi\nperbaikan sarana dan\nprasarana laboratorium\n(Klaster 1)"},{"page":183,"text":"183\n\nPelayanan Rawat Inap\nBAB Y\nAlur Pelayanan RawatRAWAT INAP Inap"},{"page":184,"text":"184\n\nPelayanan Rawat Inap"},{"page":185,"text":"185\n\nTujuan Pelayanan rawat inap\n\n1. Merawat pasien rujukan layanan klaster yang\nmemerlukan rawat inap secara tuntas sesuai\nstandar prosedur operasional dan standar\npelayanan;\nPelayanan 2. Merawat pasien gawat darurat secara tuntas\nRawat Inap ataupun merawat sementara dalam rangka menstabilkan kondisi sebelum dirujuk ke fasilitas\nkesehatan rujukan, sesuai standar prosedur\noperasional dan standar pelayanan;\n3. Observasi pasien dalam rangka diagnostic atau\nrujukan standar prosedur operasional dan standar\npelayanan; dan\n4. Pasca pelayanan persalinan, sesuai dengan\nstandar prosedur operasional dan standar\npelayanan."},{"page":186,"text":"186\n\nAlur Pelayanan Rawat Inap"},{"page":187,"text":"187\nAlur Rawat Inap Pasien Gawat Darurat\n\nMonitor paska\nkepulangan/mon\nitor pada saat\nhome visit\n\n• Pasien stabil pasca tersedia Memerlukan Rawat hingga\npenanganan ya prasarana Pelayanan Pelayanan di tidak kondisi pasien\nKegawatdaruratan rawat Inap? Rawat Inap fasyankes membaik untuk\n• Pasien rujukan tingkat lanjut dipulangkan\nklaster\n\nya tidak\nPencatatan dan\nPasien Tatalaksana pelaporan tidak dalam perawatan hingga pelayanan Rawat\nkondisi pasien stabil untuk Inap\nStabil rujukan\n\nya\n\nRujuk Ke FKRTL"},{"page":188,"text":"188\n\nPenanggulangan Krisis\nKesehatan\nBAB Z\nUpaya Penanggulangan\nPENANGGULANGAN Krisis Kesehatan\nKRISIS KESEHATAN\nPengkajian Resiko Krisis\nKesehatan\n\nPenyediaan Sumber\ndaya"},{"page":189,"text":"189\nPenanggulangan Krisis Kesehatan\n\nKrisis kesehatan adalah peristiwa atau rangkaian peristiwa yang\nmengakibatkan timbulnya korban jiwa, korban luka/sakit, pengungsian\ndan/atau adanya potensi bahaya yang berdampak pada kesehatan\nmasyarakat yang membutuhkan respons cepat di luar kebiasaan normal dan\nkapasitas kesehatan tidak memadai\n\nPenanggulangan Krisis Kesehatan bertujuan untuk terselenggaranya\nPenanggulangan Krisis Kesehatan yang terkoordinasi, terencana, terpadu, dan\nmenyeluruh guna memberikan perlindungan kepada masyarakat dari\nancaman, risiko, dan dampak permasalahan kesehatan.\n\nPenanggulangan krisis kesehatan dilakukan melalui tiga tahapan, yaitu\nsebelum terjadinya krisis kesehatan (prakrisis kesehatan), saat darurat krisis\nkesehatan, dan setelah terjadinya krisis kesehatan (pascakrisis kesehatan).\nUpaya penanggulangan menitikberatkan pada upaya sebelum terjadinya krisis\nkesehatan melalui kegiatan pengurangan risiko krisis Kesehatan\n\nSumber: Permenkes No. 75 Tahun 2023"},{"page":190,"text":"190\nUpaya Penanggulangan Krisis Kesehatan\n\nAssesment\n\nPrakrisis Kesehatan Darurat Krisis Kesehatan Pascakrisis Kesehatan\n\n1. Pengkajian Risiko Krisis Kesehatan 1. Melakukan Rapid Health Assessment (RHA) 1. Terlibat dalam kegiatan penilaian\n2. Rencana Penanggulangan Krisis 2. Melakukan pelayanan kesehatan darurat krisis kerusakan, kerugian dan kebutuhan\nkesehatan kesehatan sumber daya kesehatan pascakrisis\n3. Pemberdayaan Masyarakat dalam 3. Memastikan pelayanan kesehatan esensial kesehatan\nPenanggulangan Krisis Kesehatan tetap berjalan sesuai standar minimum 2. Memberi masukan terhadap dokumen\n4. Tim: RHA, EMT, PHRRT, dll pelayanan kesehatan rehabilitasi dan rekonstruksi\n5. Peningkatan Kapasitas SDM Kesehatan 4. Melaporkan kejadian krisis Kesehatan ke 3. Ikut melakukan monitoring dan\n6. Penguatan fasyankes sesuai standar dinkes kab/ kota evaluasi pelaksanaan rencana\naman bencana 5. Melakukan penilaian cepat di fasyankes rehabilitasi dan rekonstruksi\nTerintegrasi dengan: 6. Aktivasi sistem komando fasyankes yang 4. Melakukan upaya rehabilitasi dan\na. proses perizinan mendirikan merupakan bagian dari Klaster Kesehatan di rekonstruksi\nbangunan wilayahnya. 5. Evaluasi dan pembelajaran\nb. penerbitan sertifikat laik fungsi 7. Melakukan pelayanan kesehatan 6. Build back better, safer, sustainable\nbangunan Gedung 8. Tetap aman & dapat diakses, berkoordinasi\nc. perizinan operasional fasyankes dengan LP dan LS terkait\nd. syarat kelulusan akreditasi 9. Penambahan kapasitas /surge capacity\nfasyankes\n\nFasilitas pelayanan kesehatan yang tetap aman, dapat diakses dan berfungsi pada kapasitas maksimum,\nsebelum, selama, dan segera setelah situasi darurat dan bencana.\nStandar Fasyankes aman bencana: Komponen struktural dan nonstruktural aman bencana, memiliki sistem\npengelolaan untuk situasi darurat dan krisis kesehatan, dan memiliki sumber daya yang memadai\n\nSumber: Hospital safety index: guide for evaluators (who.int), comprehensive-safe-hospital-framework.pdf (who.int), Assessing hospital disaster\npreparedness: A scoping review of available tools - PMC (nih.gov)"},{"page":191,"text":"191\nPengkajian Risiko Krisis Kesehatan\n\n● Memberikan masukan dalam\nMenyusun rencana penyusunan rencana\nAssessment Prakrisis Penanggulangan Bencana penanggulangan krisis kesehatan\nKesehatan Fasyankes (contoh: ● Pengembangan skenario renkon\nPuskesmas disasterya plan, dsb) kesehatan, terintegrasi dalam\ndokumen Puskesmas disaster plan\n\nAssessment Darurat Memberikan masukan dalam penyusunan Menyusun rencana operasi\nKrisis kesehatan rencana operasi darurat krisis kesehatan puskesmas\n(RHA) kab/kota/prov ya\n\nAssessment Menyusun rencana rehabilitasi Memberikan masukan dalam penyusunan\nPascakrisis dan rekonstruksi pasca Rencana rehabilitasi dan rekonstruksi\nkesehatan bencana (R3P)yaPuskesmas pasca bencana (R3P) kab/kota/prov"},{"page":192,"text":"192\nPenyediaan Sumber Daya\n\nSumber Daya Logistik\nManusia Kesehatan\n\n1. Dokter 1. Alat Kesehatan\n2. Perawat 2. Obat\n3. Bidan 3. Vaksin\n4. Tenaga Kefarmasian 4. Bahan Medis Habis Pakai\n5. Tenaga Kesehatan Masyarakat 5. Bahan/ alat pendukung lainnya\n6. Tenaga Kesehatan Lingkungan\n7. Tenaga Gizi\n8. Tenaga Kesehatan Terlatih di\nbidang Kesehatan Jiwa"},{"page":193,"text":"193\nDaftar Pustaka\n\n• Undang-Undang Republik Indonesia Nomor 17 Tahun 2023 Tentang Kesehatan"},{"page":194,"text":""}]};

 }}
